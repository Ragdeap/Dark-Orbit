  const RANK_TABLE = [
    { n: 1, rank: 20 }, { n: 2, rank: 19 }, { n: 3, rank: 18 }, { n: 5, rank: 17 }, { n: 20, rank: 16 },
    { pct: 1, rank: 15 }, { pct: 1.5, rank: 14 }, { pct: 2, rank: 13 }, { pct: 2.5, rank: 12 }, { pct: 3, rank: 11 },
    { pct: 3.5, rank: 10 }, { pct: 4, rank: 9 }, { pct: 4.5, rank: 8 }, { pct: 5, rank: 7 }, { pct: 6, rank: 6 },
    { pct: 7, rank: 5 }, { pct: 8, rank: 4 }, { pct: 9, rank: 3 }, { pct: 10, rank: 2 }, { pct: 12.9, rank: 1 }, { pct: 20, rank: 0 },
  ];

  // Puntos de rango. De momento sólo PE, honor y nivel: el resto de términos de la fórmula aún no existe en el juego
  const rankPoints = c => c.exp / 100000 + c.honor / 100 + levelFor(c.exp) * 100;

  // Ordena a cada empresa por puntos de rango y reparte los rangos según RANK_TABLE
  function updateRanks() {
    const byCompany = {};
    for (const c of [g.p, ...g.allies]) (byCompany[c.company] ||= []).push(c);
    for (const list of Object.values(byCompany)) {
      list.sort((a, b) => rankPoints(b) - rankPoints(a));
      let pos = 0;
      for (const row of RANK_TABLE) {
        const slots = row.n ?? Math.max(1, Math.round(list.length * row.pct / 100));
        for (let i = 0; i < slots && pos < list.length; i++) list[pos++].rank = row.rank;
      }
      for (; pos < list.length; pos++) list[pos].rank = null;
    }
  }

  // Robot de reparación: una pieza pequeña que orbita la nave mientras cura, con un destello verde hacia ella
  function drawRepairBot(cx, cy) {
    const t = performance.now();
    const a = t / 600;
    const x = cx + Math.cos(a) * 30, y = cy + Math.sin(a) * 16 - 6;
    ctx.save();
    ctx.fillStyle = '#c9d6e3';
    ctx.strokeStyle = '#5dff8a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#5dff8a';
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t / 120);
    ctx.beginPath();
    ctx.arc(x + (cx - x) * 0.3, y + (cy - y) * 0.3, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Llamas de cada motor de la nave: salen de la tobera, con la misma orientación y cámara que el sprite
  function drawShipFlames(cx, cy, angle, sprite, ship) {
    const k = frameOf(angle, sprite);
    const phi = (180 - k * 11.25) * Math.PI / 180;
    const cp = Math.cos(phi), sp = Math.sin(phi), ce = Math.cos(sprite.tilt), se = Math.sin(sprite.tilt);
    // Hacia atrás de la nave en pantalla (el morro apunta a (cp, -sp*se))
    const back = norm2(-cp, sp * se);
    const perp = [-back[1], back[0]];
    for (const e of ship.engines) {
      // Tobera en el plano del suelo (Y = 0): su posición en pantalla. La llama arranca 3 px dentro del motor,
      // para que el sprite la tape en la base y no parezca que sale de debajo cuando la nave mira hacia arriba
      const wx = e.x * cp - e.z * sp, wz = e.x * sp + e.z * cp;
      const ex = cx + wx - back[0] * 3, ey = cy - wz * se - back[1] * 3;
      const len = ship.flame.len * (0.85 + rnd(0, 0.3));
      const w = ship.flame.w;
      const tipX = ex + back[0] * len, tipY = ey + back[1] * len;
      const grad = ctx.createLinearGradient(ex, ey, tipX, tipY);
      grad.addColorStop(0, 'rgba(255,255,255,0.95)');
      grad.addColorStop(0.3, 'rgba(255,209,102,0.9)');
      grad.addColorStop(1, 'rgba(255,90,31,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(ex + perp[0] * w, ey + perp[1] * w);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(ex - perp[0] * w, ey - perp[1] * w);
      ctx.fill();
      // Núcleo más claro, para dar volumen a la llama
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.moveTo(ex + perp[0] * w * 0.45, ey + perp[1] * w * 0.45);
      ctx.lineTo(ex + back[0] * len * 0.6, ey + back[1] * len * 0.6);
      ctx.lineTo(ex - perp[0] * w * 0.45, ey - perp[1] * w * 0.45);
      ctx.fill();
    }
  }

  // Frame que corresponde al ángulo de la nave
  function frameOf(angle, sprite) {
    const deg = angle * 180 / Math.PI;
    return ((Math.round((deg - 180) / 11.25) % sprite.count) + sprite.count) % sprite.count;
  }

  // Con la tobera hacia la cámara (se ve la cola), la llama queda delante de la nave
  function colaHaciaCamara(angle, sprite) {
    const phi = (180 - frameOf(angle, sprite) * 11.25) * Math.PI / 180;
    return Math.sin(phi) * Math.cos(sprite.tilt) > 0;
  }

  function norm2(x, y) {
    const l = Math.hypot(x, y);
    return [x / l, y / l];
  }

  function drawShipSprite(cx, cy, angle, sprite) {
    const k = frameOf(angle, sprite);
    ctx.drawImage(sprite.frames[k], cx - sprite.pivot.x, cy - sprite.pivot.y);
  }

  // Mitad de la caja de impacto de un sprite: la distancia máxima, en x o en y, del píxel visible más alejado
  // del pivote, mirando todos los frames. La caja queda cuadrada y centrada en la nave
  function spriteHalf(imgs, data) {
    const w = data.canvas.width, h = data.canvas.height;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx2 = c.getContext('2d', { willReadFrequently: true });
    let half = 0;
    for (const img of imgs) {
      cx2.clearRect(0, 0, w, h);
      cx2.drawImage(img, 0, 0);
      const d = cx2.getImageData(0, 0, w, h).data;
      for (let i = 0; i < w * h; i++) {
        if (d[i * 4 + 3] <= 60) continue;
        const dx = i % w + 0.5 - data.pivot.x, dy = Math.floor(i / w) + 0.5 - data.pivot.y;
        half = Math.max(half, Math.abs(dx), Math.abs(dy));
      }
    }
    return Math.ceil(half);
  }

  // ¿Toca el tramo (x0, y0)-(x1, y1) la caja cuadrada de la nave v? Con sprite, su mitad; sin sprite, r.
  // El tramo se muestrea cada 2 px, para que una bala rápida no atraviese la caja
  function shipHit(v, sp, r, x0, y0, x1, y1) {
    const half = sp ? sp.half : r;
    const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 2));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      if (Math.abs(x0 + (x1 - x0) * t - v.x) <= half && Math.abs(y0 + (y1 - y0) * t - v.y) <= half) return true;
    }
    return false;
  }

  // Nave con sprite 2,5D: las llamas van detrás de la nave, o delante si se ve la cola
  function drawNaveSprite(cx, cy, angle, sprite, ship, moving) {
    const flames = moving && ship.engines;
    const delante = flames && colaHaciaCamara(angle, sprite);
    if (flames && !delante) drawShipFlames(cx, cy, angle, sprite, ship);
    drawShipSprite(cx, cy, angle, sprite);
    if (delante) drawShipFlames(cx, cy, angle, sprite, ship);
  }

  function drawPlayer() {
    const p = g.p;
    if (p.dead) return;
    const cx = W / 2, cy = H / 2;
    const moving = Math.hypot(p.vx, p.vy) > 20;
    const sprite = SPRITES[g.shipId] || null;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(p.angle);
    if (!sprite) {
      if (moving) {
        ctx.fillStyle = '#ffb347';
        ctx.beginPath();
        ctx.moveTo(-10, -4); ctx.lineTo(-22 - rnd(0, 6), 0); ctx.lineTo(-10, 4);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.moveTo(14, 0); ctx.lineTo(-10, 8); ctx.lineTo(-6, 0); ctx.lineTo(-10, -8); ctx.closePath();
      ctx.fillStyle = '#d7e6ff';
      ctx.fill();
      ctx.strokeStyle = '#5aa8ff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
    if (sprite) drawNaveSprite(cx, cy, p.angle, sprite, SHIPS[g.shipId], moving);
    if (repairActive) drawRepairBot(cx, cy);
    // Barras sobre la nave: la vida siempre; el escudo sólo si hay escudo equipado y le queda carga
    const bw = 40, bx = cx - bw / 2;
    bar(bx, cy - 40, bw, 4, p.hp / maxHpNow(), '#5dff8a');
    if (p.maxShield > 0 && p.shield > 0) bar(bx, cy - 46, bw, 3, p.shield / p.maxShield, '#5ac8ff');
    // Aviso mientras dura el efecto del misil ralentizador
    if (p.slowT > 0) {
      ctx.save();
      ctx.font = 'bold 11px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#7fe7ff';
      ctx.fillText(`RALENTIZADO ${Math.ceil(p.slowT)} s`, cx, cy - 56);
      ctx.restore();
    }
    // Nombre del jugador debajo de la nave: blanco y grueso, con borde negro
    ctx.save();
    ctx.font = 'bold 15px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#000000';
    ctx.strokeText(PLAYER_NAME, cx, cy + 46);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(PLAYER_NAME, cx, cy + 46);
    const nameW = ctx.measureText(PLAYER_NAME).width;
    if (p.rank != null) drawRank(p.rank, cx - nameW / 2 - 4, cy + 46 - 6);
    drawCompany(p.company, cx + nameW / 2 + 4, cy + 46 - 6);
    ctx.restore();
  }

  function drawCursor() {
    ctx.strokeStyle = 'rgba(127,214,255,0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2);
    ctx.moveTo(mouse.x - 12, mouse.y); ctx.lineTo(mouse.x - 4, mouse.y);
    ctx.moveTo(mouse.x + 4, mouse.y); ctx.lineTo(mouse.x + 12, mouse.y);
    ctx.stroke();
  }

  function drawCenter(text, color, size, alpha, y) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.font = `${size}px Consolas, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, W / 2, y);
    ctx.restore();
  }

  // ---------- Ventana de usuario ----------
  const PLAYER_W = 340, PLAYER_H = 116;
  const formatNum = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

  // Minimizada es un icono abajo a la izquierda; abierta, una ventana arrastrable
  // Orden de los iconos de ventana en la barra superior izquierda. Solo ocupan hueco los visibles, y el hangar solo existe dentro de la base
  const WIN_ICON_ORDER = ['mission', 'player', 'nave', 'refine', 'minimap', 'hangar'];
  function winIconGeom(key) {
    const shown = WIN_ICON_ORDER.filter(k => k !== 'hangar' || inBase());
    return { x: 16 + shown.indexOf(key) * 44, y: 16, w: 36, h: 36 };
  }

  function playerIconGeom() { return winIconGeom('player'); }

  function playerGeom() {
    if (!g.playerOpen) return playerIconGeom();
    const pos = g.playerPos || { x: 16, y: H - PLAYER_H - 60 };
    const x = clamp(pos.x, 0, W - PLAYER_W), y = clamp(pos.y, 0, H - PLAYER_H);
    return { x, y, w: PLAYER_W, h: PLAYER_H, close: { x: x + PLAYER_W - 26, y: y + 6, w: 20, h: 20 } };
  }

  // Busto de usuario: cabeza y hombros, sin detalle. Centrado en (cx, cy) con tamaño de referencia "size"
  function drawBustIcon(cx, cy, size) {
    ctx.beginPath();
    ctx.arc(cx, cy - size * 0.22, size * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy + size * 0.45, size * 0.4, Math.PI, 0);
    ctx.fill();
  }

  // Icono de una ventana: en gris mientras la ventana está abierta (en uso), igual que el hangar fuera de la base
  function drawWinIcon(draw, b, open) {
    ctx.filter = open ? 'grayscale(1) brightness(0.55)' : 'none';
    draw(b);
    ctx.filter = 'none';
  }

  function drawPlayerIcon(b) {
    const hover = inBox(b, mouse.x, mouse.y);
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = hover ? 16 : 6;
    drawBustIcon(b.x + b.w / 2, b.y + b.h / 2, 26);
    ctx.shadowBlur = 0;
    if (hover) drawIconTooltip(b, 'Usuario');
  }

  // Iconos de las filas de la ventana de usuario (dibujados con trazos, sin texto). Centrados en (cx, cy), tamaño 12 px
  function drawDataIcon(kind, cx, cy) {
    const r = 6;
    ctx.fillStyle = '#ffd166';
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (kind === 'id') {
      // Tarjeta de identificación: marco, cabeza y líneas de datos
      ctx.strokeRect(cx - 6, cy - 4.5, 12, 9);
      ctx.arc(cx - 2.5, cy - 0.5, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(cx + 1, cy - 2, 3.5, 1);
      ctx.fillRect(cx + 1, cy + 1, 3.5, 1);
    } else if (kind === 'exp') {
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const d = i % 2 ? r * 0.45 : r;
        ctx.lineTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
      }
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'level') {
      [0.4, 0.7, 1].forEach((k, i) => ctx.rect(cx - r + i * 4.5, cy + r - r * 2 * k, 3, r * 2 * k));
      ctx.fill();
    } else if (kind === 'honor') {
      ctx.arc(cx, cy - 2, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - 3, cy + 1);
      ctx.lineTo(cx - 4, cy + r);
      ctx.lineTo(cx - 1, cy + r - 1.5);
      ctx.lineTo(cx + 1, cy + r);
      ctx.lineTo(cx + 3, cy + 1);
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'credits') {
      // Logo de créditos: una "C" de trazos rectos con los extremos superior e inferior hacia la derecha, como la "U" de uridium
      ctx.strokeStyle = '#ffd166';
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 4;
      ctx.lineWidth = 2;
      ctx.moveTo(cx + 4, cy - 5);
      ctx.lineTo(cx - 3, cy - 5);
      ctx.lineTo(cx - 3, cy + 5);
      ctx.lineTo(cx + 4, cy + 5);
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (kind === 'uridium') {
      // Logo de uridium: una "U" luminosa con un pequeño trazo hacia la derecha en el brazo derecho
      ctx.strokeStyle = '#ffd166';
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 4;
      ctx.lineWidth = 2;
      ctx.moveTo(cx - 4, cy - 5);
      ctx.lineTo(cx - 4, cy + 4);
      ctx.lineTo(cx + 3, cy + 4);
      ctx.lineTo(cx + 3, cy - 5);
      ctx.moveTo(cx + 3, cy - 2);
      ctx.lineTo(cx + 6, cy - 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (kind === 'teleport') {
      [[0.3, -1], [-0.6, 0.15], [0, 0.15], [-0.3, 1], [0.6, -0.2], [0, -0.2]].forEach(([x, y], i) => {
        if (i === 0) ctx.moveTo(cx + x * r, cy + y * r);
        else ctx.lineTo(cx + x * r, cy + y * r);
      });
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'keys') {
      ctx.arc(cx - 3.5, cy, 2.5, 0, Math.PI * 2);
      ctx.moveTo(cx - 1, cy);
      ctx.lineTo(cx + r, cy);
      ctx.moveTo(cx + 3.5, cy);
      ctx.lineTo(cx + 3.5, cy + 3);
      ctx.moveTo(cx + r, cy);
      ctx.lineTo(cx + r, cy + 2);
      ctx.stroke();
    }
  }

  // Etiqueta de una fila: cada dato se identifica solo con su icono
  function drawDataLabel(kind, x, y) {
    drawDataIcon(kind, x + 6, y - 4);
  }

  function drawPlayerWindow() {
    const b = playerGeom();
    ctx.save();
    drawWinIcon(drawPlayerIcon, playerIconGeom(), g.playerOpen);
    if (!g.playerOpen) { ctx.restore(); return; }
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd166';
    drawBustIcon(b.x + 18, b.y + 17, 14);
    ctx.fillText('USUARIO', b.x + 30, b.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.x + 8, b.y + 30, b.w - 16, 1);
    ctx.fillRect(b.x + 172, b.y + 38, 1, b.h - 48);
    // Botón de cerrar
    const c = b.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();
    // Columna izquierda: identificador, experiencia, nivel y honor
    const left = [['id', g.playerId], ['exp', formatNum(g.exp)], ['level', levelFor(g.exp)],['honor', formatNum(g.honor)]];
    // Columna derecha: créditos, uridium, bonos de teleportación y llaves de botín
    const right = [['credits', formatNum(g.credits)], ['uridium', formatNum(g.uridium)], ['teleport', formatNum(g.teleportBonus)], ['keys', formatNum(g.lootKeys)]];
    const rowY = i => b.y + 48 + i * 20;
    left.forEach(([kind, value], i) => {
      drawDataLabel(kind, b.x + 14, rowY(i));
      ctx.fillStyle = '#cfe8ff';
      ctx.textAlign = 'right';
      ctx.fillText(String(value), b.x + 160, rowY(i));
    });
    right.forEach(([kind, value], i) => {
      drawDataLabel(kind, b.x + 184, rowY(i));
      ctx.fillStyle = '#cfe8ff';
      ctx.textAlign = 'right';
      ctx.fillText(String(value), b.x + b.w - 14, rowY(i));
    });
    ctx.restore();
  }

  // ---------- Ventana de nave ----------
  // Seis datos en dos columnas de tres: izquierda casco, escudo y nanocasco; derecha configuración, tonelaje y velocidad
  const NAVE_W = 340, NAVE_H = 114;

  // Minimizada es un icono junto a los de usuario y misiones; abierta, una ventana arrastrable
  function naveIconGeom() { return winIconGeom('nave'); }

  function naveGeom() {
    if (!g.naveOpen) return naveIconGeom();
    const pos = g.navePos || { x: 16, y: 190 };
    const x = clamp(pos.x, 0, W - NAVE_W), y = clamp(pos.y, 0, H - NAVE_H);
    return { x, y, w: NAVE_W, h: NAVE_H, close: { x: x + NAVE_W - 26, y: y + 6, w: 20, h: 20 } };
  }

  // Silueta de nave: triángulo apuntando hacia arriba
  function drawShipIcon(cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - s);
    ctx.lineTo(cx + s * 0.7, cy + s * 0.8);
    ctx.lineTo(cx, cy + s * 0.4);
    ctx.lineTo(cx - s * 0.7, cy + s * 0.8);
    ctx.closePath();
    ctx.fill();
  }

  function drawNaveIcon(b) {
    const hover = inBox(b, mouse.x, mouse.y);
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = hover ? 16 : 6;
    drawShipIcon(b.x + b.w / 2, b.y + b.h / 2, 11);
    ctx.shadowBlur = 0;
    if (hover) drawIconTooltip(b, 'Nave');
  }

  // Iconos de las filas de la ventana de nave, con el mismo trazo dorado que la de usuario
  function drawNaveRowIcon(kind, cx, cy) {
    ctx.fillStyle = '#ffd166';
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (kind === 'hull') {
      // Cruz: casco
      ctx.fillRect(cx - 1.5, cy - 5, 3, 10);
      ctx.fillRect(cx - 5, cy - 1.5, 10, 3);
    } else if (kind === 'shield') {
      // Escudo
      ctx.moveTo(cx, cy - 6);
      ctx.lineTo(cx + 5, cy - 3.5);
      ctx.lineTo(cx + 5, cy + 1);
      ctx.quadraticCurveTo(cx + 5, cy + 5, cx, cy + 6);
      ctx.quadraticCurveTo(cx - 5, cy + 5, cx - 5, cy + 1);
      ctx.lineTo(cx - 5, cy - 3.5);
      ctx.closePath();
      ctx.stroke();
    } else if (kind === 'nano') {
      // Hexágono: nanocasco
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        ctx.lineTo(cx + Math.cos(a) * 5, cy + Math.sin(a) * 5);
      }
      ctx.closePath();
      ctx.stroke();
    } else if (kind === 'config') {
      // Engranaje: configuración
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        ctx.moveTo(cx + Math.cos(a) * 3.5, cy + Math.sin(a) * 3.5);
        ctx.lineTo(cx + Math.cos(a) * 5.5, cy + Math.sin(a) * 5.5);
      }
      ctx.stroke();
    } else if (kind === 'cargo') {
      // Caja: tonelaje
      ctx.strokeRect(cx - 5, cy - 4, 10, 8);
      ctx.moveTo(cx - 5, cy);
      ctx.lineTo(cx + 5, cy);
      ctx.stroke();
    } else if (kind === 'speed') {
      // Doble flecha: velocidad
      ctx.moveTo(cx - 4, cy - 4);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx - 4, cy + 4);
      ctx.moveTo(cx, cy - 4);
      ctx.lineTo(cx + 4, cy);
      ctx.lineTo(cx, cy + 4);
      ctx.stroke();
    }
  }

  // Barra de segmentos: cuánto de "frac" (0 a 1) está lleno
  function drawSegBar(x, y, w, h, frac) {
    const n = 10, gap = 2, segW = (w - gap * (n - 1)) / n;
    const on = Math.round(clamp(frac, 0, 1) * n);
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = i < on ? '#ffd166' : '#1e2c44';
      ctx.fillRect(x + i * (segW + gap), y, segW, h);
    }
  }

  function drawNaveWindow() {
    const b = naveGeom();
    ctx.save();
    drawWinIcon(drawNaveIcon, naveIconGeom(), g.naveOpen);
    if (!g.naveOpen) { ctx.restore(); return; }
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd166';
    drawShipIcon(b.x + 18, b.y + 17, 8);
    ctx.fillText('NAVE', b.x + 30, b.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.x + 8, b.y + 30, b.w - 16, 1);
    ctx.fillRect(b.x + 170, b.y + 38, 1, b.h - 48);
    // Botón de cerrar
    const c = b.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();

    const p = g.p;
    const cargo = Object.values(g.cargo).reduce((sum, n) => sum + n, 0);
    const cap = SHIPS[g.shipId].cargo;
    const nano = 0;   // nanocasco actual: sin implementar, siempre 0
    // Columna izquierda: casco, escudo y nanocasco (todavía sin implementar: 0)
    const left = [
      { kind: 'hull', frac: p.hp / maxHpNow(), value: formatNum(Math.ceil(p.hp)) },
      { kind: 'shield', frac: p.maxShield ? p.shield / p.maxShield : 0, value: formatNum(Math.ceil(p.shield)) },
      // Nanocasco: su máximo es igual al casco de la nave. Sin implementar, siempre está a 0
      { kind: 'nano', frac: nano / maxHpNow(), value: formatNum(nano) },
    ];
    // Columna derecha: tonelaje, velocidad máxima y configuración (sin implementar: 1)
    const right = [
      { kind: 'cargo', frac: cargo / cap, value: `${formatNum(cargo)} / ${formatNum(cap)}` },
      { kind: 'speed', frac: null, value: formatNum(Math.round(p.speed * (1 + boostBonus('engine')))) },
      { kind: 'config', frac: null, value: '1' },
    ];
    const rowY = i => b.y + 50 + i * 21;
    ctx.font = '12px Consolas, monospace';
    left.forEach((r, i) => {
      drawNaveRowIcon(r.kind, b.x + 20, rowY(i) - 4);
      if (r.frac !== null) drawSegBar(b.x + 32, rowY(i) - 8, 64, 7, r.frac);
      ctx.fillStyle = '#cfe8ff';
      ctx.textAlign = 'right';
      ctx.fillText(r.value, b.x + 160, rowY(i));
    });
    right.forEach((r, i) => {
      drawNaveRowIcon(r.kind, b.x + 190, rowY(i) - 4);
      if (r.frac !== null) drawSegBar(b.x + 202, rowY(i) - 8, 60, 7, r.frac);
      ctx.fillStyle = '#cfe8ff';
      ctx.textAlign = 'right';
      ctx.fillText(r.value, b.x + b.w - 14, rowY(i));
    });
    ctx.restore();
  }

  // ---------- Estación de venta ----------
  const STATION_RANGE = 110;   // distancia máxima a la estación para abrir la venta
  const STATION_CLICK = 40;    // radio del clic sobre la estación

  const inBox = (r, px, py) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;

  function stationNear() {
    const st = g.zone.station;
    return !!st && dist(g.p.x, g.p.y, st.x, st.y) < STATION_RANGE;
  }

  function sellMaterial(m) {
    const qty = g.cargo[m.key];
    if (!qty) return;
    const total = qty * m.price;
    g.credits += total;
    g.cargo[m.key] = 0;
    showBanner(`Vendido: ${qty} ${m.name} por ${total} créditos`);
  }

  function stationGeom() {
    const w = 360, h = 210, x = Math.round((W - w) / 2), y = Math.round((H - h) / 2);
    return {
      x, y, w, h,
      close: { x: x + w - 26, y: y + 6, w: 20, h: 20 },
      rows: MATERIALS.map((m, i) => ({ m, btn: { x: x + 276, y: y + 60 + i * 24, w: 70, h: 18 } })),
    };
  }

  function drawStation() {
    const st = g.zone.station;
    if (!st) return;
    const x = sx(st.x), y = sy(st.y);
    ctx.save();
    ctx.fillStyle = 'rgba(90,209,255,0.15)';
    ctx.fillRect(x - 18, y - 18, 36, 36);
    ctx.strokeStyle = '#5ad1ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 18, y - 18, 36, 36);
    ctx.fillStyle = '#5ad1ff';
    ctx.font = '12px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('VENTA', x, y - 26);
    if (stationNear() && !g.stationOpen) ctx.fillText('Clic para vender', x, y + 36);
    ctx.restore();
  }

  function drawStationWindow() {
    if (!g.stationOpen) return;
    const b = stationGeom();
    ctx.save();
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#5ad1ff';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#5ad1ff';
    ctx.fillText('ESTACIÓN DE VENTA', b.x + 12, b.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.x + 8, b.y + 30, b.w - 16, 1);
    ctx.fillText('Materia', b.x + 14, b.y + 50);
    ctx.textAlign = 'right';
    ctx.fillText('Cant.', b.x + 160, b.y + 50);
    ctx.fillText('Precio', b.x + 262, b.y + 50);
    // Botón de cerrar
    const c = b.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();
    // Una fila por materia: nombre, cantidad en bodega, precio por unidad y botón de venta
    for (const { m, btn } of b.rows) {
      const ty = btn.y + 13;
      ctx.textAlign = 'left';
      ctx.fillStyle = g.cargo[m.key] ? '#cfe8ff' : '#5f6e84';
      ctx.fillText(m.name, b.x + 14, ty);
      ctx.textAlign = 'right';
      ctx.fillText(`${g.cargo[m.key]} ud`, b.x + 160, ty);
      ctx.fillText(`${m.price} cr/ud`, b.x + 262, ty);
      ctx.fillStyle = '#1b2a44';
      ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
      ctx.strokeStyle = '#5ad1ff';
      ctx.strokeRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1);
      ctx.fillStyle = '#5ad1ff';
      ctx.textAlign = 'center';
      ctx.fillText('Vender', btn.x + btn.w / 2, ty);
    }
    ctx.restore();
  }

  // ---------- Centro de misiones ----------
  // Punto de la base donde se aceptan las misiones y se reclaman sus recompensas, igual que la venta.
  // Izquierda: lista con solo los títulos (con scroll). Derecha: detalle de la misión seleccionada
  const MISSION_DESK_W = 640, MISSION_DESK_H = 380;
  const DESK_LIST_W = 220, DESK_ITEM_H = 30, DESK_HEAD_H = 26;

  function missionDeskNear() {
    const d = g.zone.missions;
    return !!d && dist(g.p.x, g.p.y, d.x, d.y) < STATION_RANGE;
  }

  function drawMissionDesk() {
    const d = g.zone.missions;
    if (!d) return;
    const x = sx(d.x), y = sy(d.y);
    ctx.save();
    ctx.fillStyle = 'rgba(255,209,102,0.15)';
    ctx.fillRect(x - 18, y - 18, 36, 36);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 18, y - 18, 36, 36);
    ctx.fillStyle = '#ffd166';
    ctx.font = '12px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('MISIONES', x, y - 26);
    if (missionDeskNear() && !g.missionDeskOpen) ctx.fillText('Clic para misiones', x, y + 36);
    ctx.restore();
  }

  // Filas de la lista: cabeceras de sección, avisos vacíos y misiones.
  // Disponibles: primero las activas (con fondo fijo), luego las que se pueden aceptar. Completadas: el histórico
  function deskEntries() {
    const active = g.missions.map(e => e.id);
    const avail = availableMissionIds();
    const entries = [{ type: 'head', text: 'Disponibles' }];
    if (!active.length && !avail.length) entries.push({ type: 'empty', text: 'Ninguna para tu nivel' });
    active.forEach(id => entries.push({ type: 'item', id, active: true }));
    avail.forEach(id => entries.push({ type: 'item', id, active: false }));
    entries.push({ type: 'head', text: 'Completadas' });
    const done = g.completed.filter(id => !active.includes(id));
    if (!done.length) entries.push({ type: 'empty', text: 'Ninguna todavía' });
    done.forEach(id => entries.push({ type: 'item', id, active: false, done: true }));
    return entries;
  }

  // Misión mostrada en el detalle: la elegida, o la primera de la lista si no hay elección válida
  function deskSelected() {
    const ids = deskEntries().filter(en => en.type === 'item').map(en => en.id);
    if (ids.includes(g.deskSel)) return g.deskSel;
    return ids.length ? ids[0] : null;
  }

  function missionDeskGeom() {
    const w = MISSION_DESK_W, h = MISSION_DESK_H, x = Math.round((W - w) / 2), y = Math.round((H - h) / 2);
    const list = { x: x + 8, y: y + 40, w: DESK_LIST_W, h: h - 48 };
    // Altura total de la lista y desplazamiento máximo; el scroll se mantiene dentro de esos límites
    let content = 0;
    const tops = deskEntries().map(en => {
      const top = content;
      content += en.type === 'item' ? DESK_ITEM_H : DESK_HEAD_H;
      return { en, top };
    });
    const max = Math.max(0, content - list.h);
    g.deskScroll = clamp(g.deskScroll, 0, max);
    const rows = tops.filter(t => t.en.type === 'item').map(t => ({ id: t.en.id, r: { x: list.x, y: list.y + t.top - g.deskScroll, w: list.w, h: DESK_ITEM_H } }));
    // Acción de la misión elegida: aceptar si está disponible, reclamar si está completada
    const sel = deskSelected();
    let action = null;
    if (sel !== null) {
      const act = g.missions.find(e => e.id === sel);
      if (!act && availableMissionIds().includes(sel) && canAcceptMission()) action = { label: 'Aceptar', kind: 'accept', id: sel };
      else if (act && act.progress >= MISSIONS[sel].count) action = { label: 'Reclamar', kind: 'claim', id: sel };
    }
    return {
      x, y, w, h, list, rows, tops, content,
      scrollMax: max,
      close: { x: x + w - 26, y: y + 6, w: 20, h: 20 },
      detail: { x: x + 248, y: y + 40, w: w - 268 },
      action: action ? { ...action, r: { x: x + w - 102, y: y + h - 40, w: 90, h: 26 } } : null,
      cancel: sel !== null && g.missions.some(e => e.id === sel && e.progress < MISSIONS[sel].count) ? { id: sel, r: { x: x + 248, y: y + h - 40, w: 130, h: 26 } } : null,
    };
  }

  function drawDeskButton(r, text) {
    ctx.fillStyle = '#1b2a44';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.fillStyle = '#ffd166';
    ctx.textAlign = 'center';
    ctx.fillText(text, r.x + r.w / 2, r.y + r.h / 2 + 4);
    ctx.textAlign = 'left';
  }

  function drawMissionDeskWindow() {
    if (!g.missionDeskOpen) return;
    const b = missionDeskGeom();
    ctx.save();
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('CENTRO DE MISIONES', b.x + 12, b.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.x + 8, b.y + 30, b.w - 16, 1);
    // Botón de cerrar
    const c = b.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();
    // Divisor entre la lista y el detalle
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.list.x + b.list.w + 6, b.y + 40, 1, b.h - 48);

    // Lista de títulos, recortada para que el scroll no se salga de su zona
    const sel = deskSelected();
    ctx.save();
    ctx.beginPath();
    ctx.rect(b.list.x, b.list.y, b.list.w, b.list.h);
    ctx.clip();
    b.tops.forEach(({ en, top }) => {
      const y0 = b.list.y + top - g.deskScroll;
      if (en.type === 'head') {
        ctx.font = '12px Consolas, monospace';
        ctx.fillStyle = '#5f6e84';
        ctx.fillText(en.text, b.list.x + 6, y0 + 16);
      } else if (en.type === 'empty') {
        ctx.font = '12px Consolas, monospace';
        ctx.fillStyle = '#5f6e84';
        ctx.fillText(en.text, b.list.x + 14, y0 + 19);
      } else {
        const selected = en.id === sel;
        if (en.active) {
          ctx.fillStyle = 'rgba(90,209,255,0.16)';
          ctx.fillRect(b.list.x, y0, b.list.w, DESK_ITEM_H - 2);
        }
        if (selected) {
          ctx.fillStyle = 'rgba(255,209,102,0.14)';
          ctx.fillRect(b.list.x, y0, b.list.w, DESK_ITEM_H - 2);
        }
        ctx.font = '13px Consolas, monospace';
        ctx.fillStyle = selected ? '#ffd166' : en.done ? '#5f6e84' : '#cfe8ff';
        ctx.fillText(MISSIONS[en.id].title, b.list.x + 14, y0 + 20);
      }
    });
    ctx.restore();
    // Barra de desplazamiento: solo si la lista no cabe entera
    if (b.scrollMax > 0) {
      const thumbH = Math.max(24, b.list.h * b.list.h / b.content);
      const thumbY = b.list.y + (b.list.h - thumbH) * (g.deskScroll / b.scrollMax);
      ctx.fillStyle = '#1b2a44';
      ctx.fillRect(b.list.x + b.list.w + 2, b.list.y, 3, b.list.h);
      ctx.fillStyle = '#5f6e84';
      ctx.fillRect(b.list.x + b.list.w + 2, thumbY, 3, thumbH);
    }

    // Detalle de la misión seleccionada: título, descripción, requisitos, progreso y recompensas
    if (sel !== null) {
      const m = MISSIONS[sel], d = b.detail;
      const prog = g.missions.find(e => e.id === sel);
      ctx.font = 'bold 16px Consolas, monospace';
      ctx.fillStyle = '#ffd166';
      ctx.fillText(m.title, d.x, d.y + 18);
      ctx.font = '13px Consolas, monospace';
      ctx.fillStyle = '#cfe8ff';
      const lines = wrapText(missionText(m, m.description), d.w);
      lines.forEach((ln, i) => ctx.fillText(ln, d.x, d.y + 44 + i * 18));
      let ty = d.y + 44 + lines.length * 18 + 16;
      ctx.fillStyle = '#5f6e84';
      ctx.fillText('Requisitos', d.x, ty);
      ctx.fillStyle = '#cfe8ff';
      ctx.fillText(missionText(m, m.text), d.x + 14, ty + 18);
      const done = !prog && g.taken.includes(sel);
      if (prog || done) {
        ctx.fillStyle = '#5f6e84';
        ctx.fillText(prog ? `Progreso: ${prog.progress} / ${m.count}` : 'Completada', d.x + 14, ty + 36);
      }
      ty += prog || done ? 58 : 40;
      ctx.fillStyle = '#5f6e84';
      ctx.fillText('Recompensas', d.x, ty);
      ctx.fillStyle = '#cfe8ff';
      REWARD_LABELS.filter(([k]) => m.rewards[k]).forEach(([k, label], i) => {
        // Tipo de recompensa en una columna y cantidad en otra, alineadas aunque cambie la longitud del nombre
        ctx.fillText(label, d.x + 14, ty + 18 + i * 18);
        ctx.fillText(formatNum(m.rewards[k]), d.x + 14 + 130, ty + 18 + i * 18);
      });
    }
    if (b.action) drawDeskButton(b.action.r, b.action.label);
    if (b.cancel) drawDeskButton(b.cancel.r, 'Cancelar misión');
    ctx.restore();
  }

  // Rueda sobre la lista: desplaza los títulos
  canvas.addEventListener('wheel', e => {
    if (!g.missionDeskOpen) return;
    const b = missionDeskGeom();
    if (!inBox(b.list, e.clientX, e.clientY)) return;
    e.preventDefault();
    g.deskScroll = clamp(g.deskScroll + Math.sign(e.deltaY) * 30, 0, b.scrollMax);
  }, { passive: false });

  // Ventana de misiones y mejoras: minimizada es un cuadrado arriba a la derecha; abierta, un panel de fondo sólido
  const MAX_MISSIONS = 5;   // misiones aceptadas a la vez
  function canAcceptMission() {
    return g.missions.length < MAX_MISSIONS;
  }

  // Misiones que el jugador puede aceptar ahora: no aceptadas antes y con el nivel necesario
  function availableMissionIds() {
    const lvl = levelFor(g.exp);
    return MISSIONS.map((m, i) => i).filter(i => !g.taken.includes(i) && (MISSIONS[i].level || 1) <= lvl);
  }

  function missionIconGeom() { return winIconGeom('mission'); }

  function missionPanelGeom() {
    if (!g.missionOpen) return missionIconGeom();
    const w = 300, h = 190;
    // Por defecto arriba a la derecha; si se ha arrastrado, se queda en la posición elegida (dentro de la pantalla)
    const pos = g.missionPos || { x: W - w - 16, y: 64 };
    const x = clamp(pos.x, 0, W - w), y = clamp(pos.y, 0, H - h);
    // Bolas de misiones junto a la X, alineadas a la derecha; una por misión aceptada
    const n = g.missions.length;
    return {
      x, y, w, h,
      close: { x: x + w - 26, y: y + 6, w: 20, h: 20 },
      slots: g.missions.map((_, i) => ({ x: x + w - 48 - (n - 1 - i) * 16, y: y + 8, w: 16, h: 16 })),
      tabs: {
        description: { x: x + 8, y: y + 40, w: 96, h: 22 },
        summary: { x: x + 110, y: y + 40, w: 70, h: 22 },
        rewards: { x: x + 186, y: y + 40, w: 90, h: 22 },
      },
    };
  }

  // Divide un texto en líneas que no superen maxW (con la fuente actual del contexto)
  function wrapText(text, maxW) {
    const lines = [];
    let line = '';
    for (const word of text.split(' ')) {
      const test = line ? `${line} ${word}` : word;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // Etiqueta que aparece debajo de un icono al pasar el ratón
  // above: el rótulo va encima del icono en lugar de debajo
  function drawIconTooltip(b, label, above = false) {
    ctx.font = '13px Consolas, monospace';
    const tw = ctx.measureText(label).width;
    const bx = b.x + b.w / 2 - (tw + 16) / 2, by = above ? b.y - 30 : b.y + b.h + 8;
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(bx, by, tw + 16, 22);
    ctx.strokeStyle = '#ffd166';
    ctx.strokeRect(bx + 0.5, by + 0.5, tw + 15, 21);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(label, bx + 8, by + 15);
  }

  // Icono minimizado: una exclamación dorada sobre un cuadro oscuro, con brillo y etiqueta al pasar el ratón
  function drawMissionIcon(b) {
    const hover = mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h;
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = hover ? 16 : 6;
    ctx.font = 'bold 24px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('!', b.x + b.w / 2, b.y + b.h / 2 + 1);
    ctx.shadowBlur = 0;
    if (hover) drawIconTooltip(b, 'Misiones');
  }

  function drawMissionPanel() {
    const b = missionPanelGeom();
    ctx.save();
    drawWinIcon(drawMissionIcon, missionIconGeom(), g.missionOpen);
    if (!g.missionOpen) { ctx.restore(); return; }
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    // Icono de misiones (solo la exclamación) junto al nombre de la ventana
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 14px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('!', b.x + 18, b.y + 22);
    ctx.font = '13px Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('MISIONES', b.x + 30, b.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.x + 8, b.y + 30, b.w - 16, 1);
    // Botón de cerrar (vuelve a minimizarse)
    const c = b.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();

    // Una bola por misión aceptada: blanca la seleccionada, gris el resto
    b.slots.forEach((s, i) => {
      ctx.beginPath();
      ctx.arc(s.x + s.w / 2, s.y + s.h / 2, 4, 0, Math.PI * 2);
      ctx.fillStyle = i === g.missionSel ? '#ffffff' : '#5f6e84';
      ctx.fill();
    });

    // Pestañas: Resumen (objetivo) y Recompensa
    const tabs = [['description', 'Descripción'], ['summary', 'Resumen'], ['rewards', 'Recompensa']];
    for (const [id, label] of tabs) {
      const r = b.tabs[id];
      const active = g.missionTab === id;
      ctx.fillStyle = active ? '#ffd166' : '#5f6e84';
      ctx.fillText(label, r.x + 4, r.y + 15);
      if (active) ctx.fillRect(r.x, r.y + r.h, r.w, 2);
    }

    // Misión del slot seleccionado
    const entry = g.missions[g.missionSel];
    const m = entry ? MISSIONS[entry.id] : null;
    const allDone = !g.missions.length && g.taken.length >= MISSIONS.length;
    // Título de la misión, destacado sobre el resto de la información
    if (m) {
      ctx.font = 'bold 14px Consolas, monospace';
      ctx.fillStyle = '#ffd166';
      ctx.fillText(m.title, b.x + 12, b.y + 84);
      ctx.font = '13px Consolas, monospace';
    }
    ctx.fillStyle = '#cfe8ff';
    if (g.missionTab === 'description') {
      // Historia de la misión, con el mismo margen que los requisitos y ajustada al ancho disponible
      if (m) {
        wrapText(missionText(m, m.description), b.w - 40).forEach((line, i) => ctx.fillText(line, b.x + 28, b.y + 104 + i * 18));
      } else {
        ctx.fillText('No hay misiones activas', b.x + 12, b.y + 84);
      }
    } else if (g.missionTab === 'summary') {
      if (m) {
        // Requisitos de la misión, con margen izquierdo para diferenciarlos del título
        ctx.fillText(missionText(m, m.text), b.x + 28, b.y + 104);
        ctx.fillText(`${entry.progress} / ${m.count}`, b.x + 28, b.y + 122);
      } else {
        ctx.fillText(allDone ? 'Todas las misiones completadas' : 'No hay misiones activas', b.x + 12, b.y + 84);
      }
    } else if (m) {
      // Solo se listan las recompensas que da la misión
      REWARD_LABELS.filter(([k]) => m.rewards[k]).forEach(([k, label], i) => {
        ctx.fillText(`${label}: ${m.rewards[k]}`, b.x + 28, b.y + 104 + i * 18);
      });
    } else {
      ctx.fillText('No hay misiones activas', b.x + 12, b.y + 84);
    }
    ctx.restore();
  }

  function drawHUD() {
    const p = g.p;
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';

    // Izquierda arriba: solo el aviso de guardado. Casco, escudo y munición están en la ventana de nave
    if (!storageOk) {
      ctx.fillStyle = '#ff9f1a';
      ctx.fillText('Progreso no guardado: se ha perdido la conexión con el servidor', 16, 34);
    }

    ctx.textAlign = 'left';

  }

  // ---------- Refinamiento ----------
  const REF_W = 500, REF_H = 600;
  // Posición de cada materia en la pestaña: cx es el centro horizontal y y el borde superior dentro de la ventana
  // La xenomita va aparte: no se refina, se obtiene
  const REF_CARDS = {
    prometium: { cx: 135, y: 100, color: '#ff5a3c' },
    endurium: { cx: 245, y: 100, color: '#7fe7ff' },
    terbium: { cx: 355, y: 100, color: '#ffe066' },
    prometid: { cx: 190, y: 270, color: '#ff7ad9' },
    duranium: { cx: 300, y: 270, color: '#6fe39a' },
    xenomita: { cx: 440, y: 270, color: '#cfe9ff', star: true },
    promerium: { cx: 245, y: 440, color: '#ffa640' },
  };
  // Enlaces de cada materia base a la refinada que la usa
  const REF_LINKS = [
    ['prometium', 'prometid'], ['endurium', 'prometid'], ['endurium', 'duranium'], ['terbium', 'duranium'],
    ['prometid', 'promerium'], ['duranium', 'promerium'], ['xenomita', 'promerium'],
  ];
  const REF_TABS = [{ id: 'refine', label: 'Refinamiento' }, { id: 'improve', label: 'Mejorar' }];

  // Cantidad de una materia: el almacén ilimitado para las de refinamiento, la bodega para el resto
  const stockOf = key => (key in g.refine ? g.refine[key] : g.cargo[key]);
  const setStock = (key, n) => { if (key in g.refine) g.refine[key] = n; else g.cargo[key] = n; };
  const materialName = key => [...MATERIALS, ...REFINE_MATERIALS].find(m => m.key === key).name;
  const canRefine = key => Object.entries(REFINE_RECIPES[key]).every(([k, n]) => stockOf(k) >= n);

  // Fabrica una unidad de la materia refinada si hay ingredientes suficientes
  function refine(key) {
    if (!canRefine(key)) return;
    for (const [k, n] of Object.entries(REFINE_RECIPES[key])) setStock(k, stockOf(k) - n);
    setStock(key, stockOf(key) + 1);
    saveGame();
  }

  // Mejora temporal activa de una categoría: 0 si no queda nada
  function boostBonus(slot) {
    const b = g.boost[slot];
    return b.left > 0 ? BOOST[b.key][slot] : 0;
  }

  // Descuenta lo gastado (un disparo o los segundos transcurridos); al llegar a 0 la materia deja de aplicarse
  function spendBoost(slot, amount) {
    const b = g.boost[slot];
    if (b.left <= 0) return;
    b.left = Math.max(0, b.left - amount);
    if (b.left === 0) b.key = null;
  }

  // Motor y escudo gastan tiempo real; al acabarse el escudo se recalcula su capacidad
  function tickBoosts(dt) {
    const shieldOn = g.boost.shield.left > 0;
    spendBoost('engine', dt);
    spendBoost('shield', dt);
    if (shieldOn && g.boost.shield.left === 0) refreshShield();
  }

  // Arrastra una materia refinada a una categoría: consume una unidad y suma su tiempo o disparos.
  // Si la categoría tiene otra materia activa, pide confirmación; al confirmar (replace), se pierde lo que quedaba
  function applyBoost(key, slot, replace = false) {
    if (BOOST[key][slot] === undefined) { showBanner('Esa materia no se puede aplicar aquí'); return; }
    if (stockOf(key) < 1) return;
    const b = g.boost[slot];
    if (b.left > 0 && b.key !== key && !replace) { g.confirmBoost = { key, slot }; return; }
    setStock(key, stockOf(key) - 1);
    if (b.key !== key) b.left = 0;
    b.key = key;
    b.left += BOOST_PER_UNIT[slot];
    if (slot === 'shield') refreshShield();
    saveGame();
  }

  // Posiciones de la pestaña Mejorar: materias refinadas (origen del arrastre) y categorías (destino)
  function mejorarGeom(b) {
    const x0 = b.x + 26;
    return {
      x0,
      refined: MEJORAR_REFINED.map((c, i) => ({ ...c, x: x0 + i * 117, y: b.y + 262, w: 96, h: 100 })),
      slots: BOOST_SLOTS.map((slot, i) => ({ slot, x: x0 + i * 117, y: b.y + 388, w: 96, h: 64 })),
    };
  }

  // Clave de la materia refinada bajo el cursor, si hay stock para arrastrarla
  function mejorarSourceAt(b, x, y) {
    const c = mejorarGeom(b).refined.find(r => inBox(r, x, y));
    return c && stockOf(c.key) > 0 ? c.key : null;
  }

  // Categoría bajo el cursor
  function mejorarSlotAt(b, x, y) {
    const s = mejorarGeom(b).slots.find(r => inBox(r, x, y));
    return s ? s.slot : null;
  }

  // Contador de una categoría: disparos en láseres y misiles, minutos en motor y escudo
  function boostLabel(slot) {
    const left = g.boost[slot].left;
    if (slot === 'lasers' || slot === 'missiles') return `${formatNum(Math.floor(left))} disparos`;
    return `${formatNum(Math.floor(left / 60))} min.`;
  }

  const BOOST_SLOT_NAMES = { lasers: 'Láseres', missiles: 'Misiles', engine: 'Motor', shield: 'Escudo' };

  // Ventana de confirmación al sustituir una materia activa, centrada en la pantalla
  function confirmBoostGeom() {
    const w = 380, h = 130, x = (W - w) / 2, y = (H - h) / 2;
    return { x, y, w, h, yes: { x: x + w - 170, y: y + h - 40, w: 70, h: 26 }, no: { x: x + w - 90, y: y + h - 40, w: 70, h: 26 } };
  }

  function drawBoostConfirm() {
    if (!g.confirmBoost) return;
    const { key, slot } = g.confirmBoost, d = confirmBoostGeom(), b = g.boost[slot];
    ctx.save();
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(d.x + 0.5, d.y + 0.5, d.w - 1, d.h - 1);
    ctx.font = '12px Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#cfe8ff';
    ctx.fillText(`${BOOST_SLOT_NAMES[slot]} tiene ${materialName(b.key)} activo.`, d.x + 16, d.y + 30);
    ctx.fillText(`Si continúas se perderán sus ${boostLabel(slot)}`, d.x + 16, d.y + 50);
    ctx.fillText(`y se aplicará ${materialName(key)}. ¿Quieres sustituirlo?`, d.x + 16, d.y + 70);
    for (const [btn, text] of [[d.yes, 'Sí'], [d.no, 'No']]) {
      ctx.fillStyle = '#1b2a44';
      ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
      ctx.strokeStyle = '#5f6e84';
      ctx.strokeRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1);
      ctx.fillStyle = '#ffd166';
      ctx.textAlign = 'center';
      ctx.fillText(text, btn.x + btn.w / 2, btn.y + 18);
    }
    ctx.restore();
  }

  function refineIconGeom() { return winIconGeom('refine'); }

  function refineGeom() {
    if (!g.refineOpen) return refineIconGeom();
    const pos = g.refinePos || { x: Math.max(0, (W - REF_W) / 2), y: 40 };
    const x = clamp(pos.x, 0, W - REF_W), y = clamp(pos.y, 0, H - REF_H);
    return { x, y, w: REF_W, h: REF_H, close: { x: x + REF_W - 26, y: y + 6, w: 20, h: 20 } };
  }

  function refineTabGeom(b, i) { return { x: b.x + 16 + i * 170, y: b.y + 40, w: 150, h: 26 }; }

  // Tarjeta de una materia: con botón de refinado si tiene receta
  function refineCardGeom(b, key) {
    const c = REF_CARDS[key], x = b.x + c.cx - 48, y = b.y + c.y;
    const hasBtn = key in REFINE_RECIPES;
    return { x, y, w: 96, h: hasBtn ? 144 : 116, btn: hasBtn ? { x: x + 10, y: y + 122, w: 76, h: 22 } : null };
  }

  // Gema o estrella de una materia, centrada en (cx, cy) y escalada por s
  function drawGem(cx, cy, color, s = 1, star = false) {
    const pts = star
      ? Array.from({ length: 8 }, (_, i) => {
        const a = i * Math.PI / 4 - Math.PI / 2, r = i % 2 ? 6 : 18;
        return [Math.cos(a) * r, Math.sin(a) * r];
      })
      : [[-20, -4], [-6, -22], [14, -18], [22, 2], [8, 20], [-14, 16]];
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = color;
    ctx.beginPath();
    pts.forEach(([x, y], i) => {
      if (i) ctx.lineTo(cx + x * s, cy + y * s);
      else ctx.moveTo(cx + x * s, cy + y * s);
    });
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawRefineIcon(b) {
    const hover = inBox(b, mouse.x, mouse.y);
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    drawGem(b.x + b.w / 2, b.y + b.h / 2, '#ff7ad9', 0.5);
    if (hover) drawIconTooltip(b, 'Refinamiento');
  }

  // Enlaces de cada materia base hasta la refinada que la usa
  function drawRefineLinks(b) {
    ctx.save();
    ctx.strokeStyle = '#e8eef8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const [from, to] of REF_LINKS) {
      const a = refineCardGeom(b, from), t = refineCardGeom(b, to);
      ctx.moveTo(a.x + a.w / 2, a.y + a.h);
      ctx.lineTo(t.x + t.w / 2, t.y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawRefineCard(b, key) {
    const c = REF_CARDS[key], r = refineCardGeom(b, key);
    ctx.save();
    ctx.textAlign = 'center';
    // Nombre
    ctx.fillStyle = '#1b2a44';
    ctx.fillRect(r.x, r.y, r.w, 20);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Consolas, monospace';
    ctx.fillText(materialName(key), r.x + r.w / 2, r.y + 14);
    // Dibujo de la materia
    ctx.fillStyle = '#10192b';
    ctx.fillRect(r.x, r.y + 20, r.w, 70);
    drawGem(r.x + r.w / 2, r.y + 55, c.color, 1, c.star);
    // Cantidad en la bodega o en el almacén de refinamiento
    ctx.fillStyle = '#000000';
    ctx.fillRect(r.x, r.y + 90, r.w, 20);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Consolas, monospace';
    ctx.fillText(formatNum(stockOf(key)), r.x + r.w / 2, r.y + 105);
    // Botón de refinado: apagado si faltan ingredientes
    if (r.btn) {
      const ok = canRefine(key), hover = ok && inBox(r.btn, mouse.x, mouse.y);
      ctx.fillStyle = ok ? (hover ? '#3a4b66' : '#2a3a55') : '#151e30';
      ctx.fillRect(r.btn.x, r.btn.y, r.btn.w, r.btn.h);
      ctx.fillStyle = ok ? '#ffffff' : '#5f6e84';
      ctx.font = '12px Consolas, monospace';
      ctx.fillText('Refinar', r.btn.x + r.btn.w / 2, r.btn.y + 15);
    }
    ctx.restore();
  }

  // Tarjeta de materia de la pestaña Mejorar. Las dim no están implementadas y se muestran apagadas
  function drawMejorarCard(x, y, w, c) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1b2a44';
    ctx.fillRect(x, y, w, 20);
    ctx.fillStyle = c.dim ? '#5f6e84' : '#ffffff';
    ctx.font = 'bold 12px Consolas, monospace';
    ctx.fillText(c.name, x + w / 2, y + 14);
    ctx.fillStyle = '#10192b';
    ctx.fillRect(x, y + 20, w, 60);
    drawGem(x + w / 2, y + 50, c.dim ? '#3a4658' : c.color, 0.8, c.star);
    ctx.fillStyle = '#000000';
    ctx.fillRect(x, y + 80, w, 20);
    ctx.fillStyle = c.dim ? '#5f6e84' : '#ffffff';
    ctx.font = 'bold 12px Consolas, monospace';
    ctx.fillText(c.dim ? '—' : formatNum(stockOf(c.key)), x + w / 2, y + 95);
    ctx.restore();
  }

  // Categoría de mejora: icono, casilla y contador. Se resalta cuando una materia compatible pasa por encima
  function drawMejorarUpgrade(s, draw, label, hl) {
    const { x, y, w } = s;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#10192b';
    ctx.fillRect(x, y, w, 64);
    ctx.strokeStyle = hl ? '#ffd166' : '#5f6e84';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 63);
    draw(x + w / 2, y + 32);
    ctx.strokeRect(x + 6.5, y + 46.5, 14, 14);
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText(label, x + w / 2, y + 82);
    ctx.restore();
  }

  // Pestaña Mejorar: materias primas, materias refinadas y categorías de mejora de la nave
  function drawMejorarTab(b) {
    const geom = mejorarGeom(b), x0 = geom.x0;
    ctx.save();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText('Materias primas:', x0, b.y + 96);
    const raw = [
      { name: 'Prometium', key: 'prometium', color: '#ff5a3c' },
      { name: 'Endurium', key: 'endurium', color: '#7fe7ff' },
      { name: 'Terbium', key: 'terbium', color: '#ffe066' },
      { name: 'Xenomita', key: 'xenomita', color: '#cfe9ff', star: true },
      { name: 'Paladio', dim: true },
    ];
    raw.forEach((c, i) => drawMejorarCard(x0 + i * 92, b.y + 104, 80, c));
    ctx.fillStyle = '#9fb3c8';
    ctx.font = '11px Consolas, monospace';
    ctx.fillText('Con arrastrar y soltar puedes equipar rápidamente tus artículos:', x0, b.y + 224);
    ctx.fillText('Arrastra la materia prima sobre el artículo deseado.', x0, b.y + 240);
    geom.refined.forEach(c => drawMejorarCard(c.x, c.y, c.w, c));
    const icons = {
      lasers: (cx, cy) => drawLaserIcon(cx, cy),
      missiles: (cx, cy) => drawMissileIcon(cx, cy),
      engine: (cx, cy) => drawNaveRowIcon('speed', cx, cy),
      shield: (cx, cy) => drawNaveRowIcon('shield', cx, cy),
    };
    const hovered = g.matDrag ? mejorarSlotAt(b, g.matDrag.x, g.matDrag.y) : null;
    geom.slots.forEach(s => {
      const hl = s.slot === hovered && BOOST[g.matDrag.key][s.slot] !== undefined;
      drawMejorarUpgrade(s, icons[s.slot], boostLabel(s.slot), hl);
    });
    ctx.restore();
  }

  function drawRefineWindow() {
    const b = refineGeom();
    ctx.save();
    drawWinIcon(drawRefineIcon, refineIconGeom(), g.refineOpen);
    if (!g.refineOpen) { ctx.restore(); return; }
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    // Cabecera con icono, título y botón de cerrar, como las demás ventanas
    drawGem(b.x + 18, b.y + 17, '#ff7ad9', 0.35);
    ctx.font = '13px Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('REFINAMIENTO', b.x + 30, b.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.x + 8, b.y + 30, b.w - 16, 1);
    const c = b.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();
    // Pestañas
    REF_TABS.forEach((t, i) => {
      const r = refineTabGeom(b, i), on = g.refineTab === t.id;
      ctx.fillStyle = on ? '#1b2a44' : '#0b1424';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = on ? '#ffd166' : '#5f6e84';
      ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
      ctx.fillStyle = on ? '#ffd166' : '#8fa0b8';
      ctx.font = '12px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(t.label, r.x + r.w / 2, r.y + 17);
    });
    if (g.refineTab === 'refine') {
      drawRefineLinks(b);
      for (const key of Object.keys(REF_CARDS)) drawRefineCard(b, key);
    } else {
      drawMejorarTab(b);
    }
    // Materia que se está arrastrando: sigue al cursor hasta soltarla
    if (g.matDrag) drawGem(g.matDrag.x, g.matDrag.y, MEJORAR_REFINED.find(c => c.key === g.matDrag.key).color, 0.8);
    ctx.restore();
  }

  // ---------- Hangar ----------
  // Icono del hangar, arriba a la derecha junto a los de nave, usuario y misiones
  function hangarIconGeom() { return winIconGeom('hangar'); }

  function inBase() {
    const z = g.zone, p = g.p;
    return !!z.base && dist(p.x, p.y, z.base.x, z.base.y) < z.base.r;
  }

  // Icono del hangar: solo aparece dentro de la base; abierto se ve en gris como el resto de ventanas
  function drawHangarIcon(b) {
    const hover = inBox(b, mouse.x, mouse.y);
    const col = '#ffd166';
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : col;
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    // Edificio del hangar: cubierta curva con puerta
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx - 9, cy + 7);
    ctx.lineTo(cx - 9, cy - 1);
    ctx.quadraticCurveTo(cx, cy - 10, cx + 9, cy - 1);
    ctx.lineTo(cx + 9, cy + 7);
    ctx.moveTo(cx - 4, cy + 7);
    ctx.lineTo(cx - 4, cy + 1);
    ctx.lineTo(cx + 4, cy + 1);
    ctx.lineTo(cx + 4, cy + 7);
    ctx.stroke();
    if (hover) drawIconTooltip(b, 'Hangar');
  }

  // Distribución del hangar: se adapta al número de naves, ranuras y láseres
  // Distribución del hangar: se adapta al número de naves, ranuras y opciones.
  // La lista de opciones muestra láseres o generadores según la ranura seleccionada.
  function hangarLayout() {
    const pw = 620;
    // Solo se ofrecen las naves que posee el jugador
    const shipIds = Object.keys(SHIPS).filter(id => g.inv.ships[id]);
    // Solo se ofrecen las piezas que tiene el jugador; null = ranura vacía
    const laserOpts = [null, ...Object.keys(LASERS).filter(id => invOf('laser')[id] > 0)];
    const missOpts = [null, ...Object.keys(MISSILES).filter(id => invOf('miss')[id] > 0)];
    const genOpts = [null, ...Object.keys(GENERATORS).filter(id => invOf('gen')[id] > 0)];
    const extraOpts = [null, ...Object.keys(EXTRAS).filter(id => invOf('extra')[id] > 0)];
    const ship = SHIPS[g.shipId];
    const shipRows = Math.ceil(shipIds.length / 4);
    const optRows = Math.ceil(Math.max(laserOpts.length, missOpts.length, genOpts.length, extraOpts.length) / 4);
    const n = ship.slots, mn = ship.missSlots, gn = ship.genSlots, en = ship.extraSlots;
    const slotW = Math.min(70, (pw - 40 - (n - 1) * 8) / n);
    // Orden de secciones: láseres, lanzamisiles, generadores, extras y, debajo, las opciones de la ranura seleccionada
    const slotLabel = 50 + shipRows * 32 + 12;   // posiciones relativas al panel
    const slotY = slotLabel + 8;
    const missLabel = slotY + 70 + 22;
    const missY = missLabel + 8;
    const genLabel = missY + 70 + 22;
    const genY = genLabel + 8;
    const extraLabel = genY + 70 + 22;
    const extraY = extraLabel + 8;
    const optLabel = extraY + 70 + 22;
    const optY = optLabel + 12;
    const ph = optY + optRows * 50 + 30;
    const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
    const optType = g.hangar.sel.type;
    const ships = shipIds.map((id, i) => ({ id, x: px + 20 + (i % 4) * 150, y: py + 50 + Math.floor(i / 4) * 32, w: 140, h: 28 }));
    const row = (count, y) => Array.from({ length: count }, (_, i) => ({ i, x: px + 20 + i * (slotW + 8), y: py + y, w: slotW, h: 70 }));
    const slots = row(n, slotY), missSlots = row(mn, missY), genSlots = row(gn, genY), extraSlots = row(en, extraY);
    const opts = { laser: laserOpts, miss: missOpts, gen: genOpts, extra: extraOpts }[optType];
    const options = opts.map((id, i) => ({ id, x: px + 20 + (i % 4) * 150, y: py + optY + Math.floor(i / 4) * 50, w: 140, h: 40 }));
    const close = { x: px + pw - 34, y: py + 10, w: 24, h: 24 };
    return {
      px, py, pw, ph, ships, slots, missSlots, genSlots, extraSlots, options, close, optType,
      slotLabelY: py + slotLabel, missLabelY: py + missLabel, genLabelY: py + genLabel, extraLabelY: py + extraLabel, optLabelY: py + optLabel, instrY: py + ph - 16,
    };
  }

  // Cambia de nave en el hangar: la vida y la velocidad pasan a ser las de la nueva nave (vida completa)
  function applyShip(id) {
    if (id === g.shipId) return;
    const ship = SHIPS[id], p = g.p;
    g.shipId = id;
    p.maxHp = ship.hp; p.hp = ship.hp;
    p.speed = ship.speed;
    g.hangar.sel = { type: 'laser', i: 0 };
    refreshShield();
  }

  function hangarClick(x, y) {
    const L = hangarLayout();
    const hit = r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
    if (hit(L.close)) { g.hangar.open = false; return; }
    for (const s of L.ships) if (hit(s)) { applyShip(s.id); return; }
    for (const s of L.slots) if (hit(s)) { g.hangar.sel = { type: 'laser', i: s.i }; return; }
    for (const s of L.missSlots) if (hit(s)) { g.hangar.sel = { type: 'miss', i: s.i }; return; }
    for (const s of L.genSlots) if (hit(s)) { g.hangar.sel = { type: 'gen', i: s.i }; return; }
    for (const s of L.extraSlots) if (hit(s)) { g.hangar.sel = { type: 'extra', i: s.i }; return; }
    for (const o of L.options) if (hit(o)) {
      const arr = slotArr(L.optType), cur = arr[g.hangar.sel.i];
      // Sin unidades libres en el almacén no se puede equipar
      if (o.id && freeOf(L.optType, o.id, cur) <= 0) return;
      arr[g.hangar.sel.i] = o.id;
      refreshShield();
      return;
    }
  }

  function hangarButton(x, y, w, h, text, active, disabled = false) {
    ctx.fillStyle = active ? 'rgba(255,209,102,0.2)' : 'rgba(12,24,48,0.92)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = active ? '#ffd166' : 'rgba(150,200,255,0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = disabled ? '#5f6e84' : '#e6f2ff';
    ctx.font = '13px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }

  function drawHangar() {
    const L = hangarLayout();
    ctx.fillStyle = 'rgba(8,16,32,0.96)';
    ctx.fillRect(L.px, L.py, L.pw, L.ph);
    ctx.strokeStyle = 'rgba(150,200,255,0.75)';
    ctx.strokeRect(L.px + 0.5, L.py + 0.5, L.pw - 1, L.ph - 1);

    ctx.fillStyle = '#e6f2ff';
    ctx.font = '16px Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('HANGAR', L.px + 20, L.py + 30);
    hangarButton(L.close.x, L.close.y, L.close.w, L.close.h, 'X', false);

    for (const s of L.ships) {
      hangarButton(s.x, s.y, s.w, s.h, `${SHIPS[s.id].name} (${SHIPS[s.id].slots})`, s.id === g.shipId);
    }

    const sel = g.hangar.sel;
    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText('Láseres', L.px + 20, L.slotLabelY);
    for (const s of L.slots) {
      const id = equipOf()[s.i];
      hangarButton(s.x, s.y, s.w, s.h, id ? LASERS[id].name : '—', sel.type === 'laser' && s.i === sel.i);
      ctx.fillStyle = '#5f6e84';
      ctx.font = '11px Consolas, monospace';
      ctx.fillText(String(s.i + 1), s.x + 5, s.y + 13);
    }

    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText('Lanzamisiles', L.px + 20, L.missLabelY);
    for (const s of L.missSlots) {
      const id = missileOf()[s.i];
      hangarButton(s.x, s.y, s.w, s.h, id ? MISSILES[id].name : '—', sel.type === 'miss' && s.i === sel.i);
      ctx.fillStyle = '#5f6e84';
      ctx.font = '11px Consolas, monospace';
      ctx.fillText(String(s.i + 1), s.x + 5, s.y + 13);
    }

    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText('Generadores', L.px + 20, L.genLabelY);
    for (const s of L.genSlots) {
      const id = genOf()[s.i];
      hangarButton(s.x, s.y, s.w, s.h, id ? GENERATORS[id].name : '—', sel.type === 'gen' && s.i === sel.i);
      ctx.fillStyle = '#5f6e84';
      ctx.font = '11px Consolas, monospace';
      ctx.fillText(String(s.i + 1), s.x + 5, s.y + 13);
    }

    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText('Extras', L.px + 20, L.extraLabelY);
    for (const s of L.extraSlots) {
      const id = extraOf()[s.i];
      hangarButton(s.x, s.y, s.w, s.h, id ? EXTRAS[id].name : '—', sel.type === 'extra' && s.i === sel.i);
      ctx.fillStyle = '#5f6e84';
      ctx.font = '11px Consolas, monospace';
      ctx.fillText(String(s.i + 1), s.x + 5, s.y + 13);
    }

    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText({ laser: 'Láseres', miss: 'Lanzamisiles', gen: 'Generadores', extra: 'Extras' }[L.optType], L.px + 20, L.optLabelY);
    // Cada pieza muestra cuántas unidades libres tiene; las que no quedan libres aparecen apagadas
    const cur = slotArr(sel.type)[sel.i];
    const names = { laser: LASERS, miss: MISSILES, gen: GENERATORS, extra: EXTRAS };
    for (const o of L.options) {
      let name = 'Vacío', free = 1;
      if (o.id) {
        free = freeOf(L.optType, o.id, cur);
        name = `${names[L.optType][o.id].name} (${free})`;
      }
      hangarButton(o.x, o.y, o.w, o.h, name, false, o.id && free <= 0);
    }

    ctx.fillStyle = '#5f6e84';
    ctx.fillText('Selecciona una ranura y luego una opción. Esc para cerrar.', L.px + 20, L.instrY);
  }

  function drawSafeMsg() {
    if (g.safeT <= 0) return;
    ctx.save();
    // Aparece en 0,6 s y se oculta poco a poco en el último segundo (dura 3 s)
    ctx.globalAlpha = Math.min(1, g.safeT, (3 - g.safeT) / 0.6);
    ctx.fillStyle = '#5dff8a';
    ctx.font = '18px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Zona de no ataques', W / 2, 72);
    ctx.restore();
  }

  // Barra principal (teclas 1 a 0). Si la flecha está desplegada, la fila de categorías encima; si hay una categoría abierta, sus objetos encima de esa fila
  function drawActionBar() {
    drawBarRow(barY0(), g.bar, true);
    drawBarArrow();
    if (g.barOpen) {
      drawBarRow(barY0() - SLOT - GAP, BAR_EXTRA, false);
      if (g.barCat) drawBarRow(barSubGeom().y, barSubRow(), false);
      drawCategoryTip();
    }
    drawBarTip();
    drawBarDrag();
  }

  // Lo que muestra el rótulo de una casilla de la barra principal: nombre, cantidad y efecto
  function barItemLines(item) {
    if (item.repair) {
      const ex = EXTRAS[item.repair];
      return [`Robot de reparación: ${ex.name}`, `Repara la vida en ${ex.repair.seconds} s`, 'Solo fuera de combate'];
    }
    if (item.ammo) {
      const a = AMMO[item.ammo];
      return [`Tipo de láser: ${a.name}`, 'Cantidad: ∞', `Efecto: daño láser multiplicado por ${a.mult}`];
    }
    const m = MISSILES[item.missile];
    return [`Tipo de misil: ${m.name}`, 'Cantidad: ∞', `Daños medios: ${m.dmg}`];
  }

  // Al pasar el cursor sobre una casilla ocupada de la barra principal, su rótulo encima de la barra
  function drawBarTip() {
    if (g.barDrag) return;
    const i = barSlotAt(mouse.x, mouse.y);
    const item = i >= 0 ? g.bar[i] : null;
    if (!item) return;
    const lines = barItemLines(item);
    ctx.font = '13px Consolas, monospace';
    const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 16, h = lines.length * 18 + 10;
    const cx = barX0() + i * (SLOT + GAP) + SLOT / 2;
    const bx = clamp(cx - w / 2, 4, W - w - 4), by = barY0() - h - 8;
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(bx, by, w, h);
    ctx.strokeStyle = '#ffd166';
    ctx.strokeRect(bx + 0.5, by + 0.5, w - 1, h - 1);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    lines.forEach((l, k) => ctx.fillText(l, bx + 8, by + 18 + k * 18));
  }

  // Al pasar el cursor sobre una categoría, un rótulo encima con lo que contiene. Se dibuja al final para que no lo tape la subsección
  function drawCategoryTip() {
    BAR_EXTRA.forEach((item, i) => {
      if (!item || !item.category) return;
      const r = { x: barX0() + i * (SLOT + GAP), y: barY0() - SLOT - GAP, w: SLOT, h: SLOT };
      if (inBox(r, mouse.x, mouse.y)) drawIconTooltip(r, CATEGORY_NAMES[item.category], true);
    });
  }

  // Modo edición: el objeto arrastrado sigue al cursor y se resalta la casilla de la barra principal que está debajo.
  // Un objeto que se descarta se desvanece en el sitio donde se soltó
  function drawBarDrag() {
    const d = g.barDrag;
    if (d) {
      const t = slotIn(d.x, d.y, barY0());
      if (t >= 0) {
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 2;
        ctx.strokeRect(barX0() + t * (SLOT + GAP) + 1, barY0() + 1, SLOT - 2, SLOT - 2);
      }
      drawBarGhost(d.x, d.y, d.item, 0.85);
    }
    if (g.barFade) drawBarGhost(g.barFade.x, g.barFade.y, g.barFade.item, 0.85 * (1 - g.barFade.t / BAR_FADE));
  }

  // Casilla con el contenido de un objeto, centrada en (cx, cy)
  function drawBarGhost(cx, cy, item, alpha) {
    const x = cx - SLOT / 2, y = cy - SLOT / 2;
    const o = item.ammo ? AMMO[item.ammo] : item.repair ? { name: EXTRAS[item.repair].name, color: REPAIR_COLOR } : MISSILES[item.missile];
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(12,24,48,0.92)';
    ctx.fillRect(x, y, SLOT, SLOT);
    ctx.fillStyle = o.color;
    ctx.fillRect(x + SLOT / 2 - 12, y + 20, 24, 4);
    ctx.fillStyle = '#e6f2ff';
    ctx.font = '11px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(o.name, x + SLOT / 2, y + 42);
    ctx.restore();
  }

  // Suelta el objeto arrastrado.
  // - Desde la subsección: sobre una casilla de la barra principal la sobrescribe, aunque ya haya otro igual.
  // - Desde la barra principal: fuera de la barra la casilla queda vacía; sobre otra casilla, se intercambian; sobre la misma, es un clic.
  function dropBarItem(x, y) {
    const d = g.barDrag;
    g.barDrag = null;
    const t = slotIn(x, y, barY0());
    if (d.from === undefined) {
      if (t >= 0) { g.bar[t] = { ...d.item }; saveGame(); }
      return;
    }
    if (t < 0) {
      g.bar[d.from] = null;
      g.barFade = { x, y, item: d.item, t: 0 };
      saveGame();
    } else if (t === d.from) {
      useSlot(d.from);
    } else if (t >= 0) {
      // Sobre otra casilla de la barra: se intercambian (si la otra está vacía, la casilla de origen queda vacía)
      [g.bar[t], g.bar[d.from]] = [g.bar[d.from], g.bar[t]];
      saveGame();
    }
  }

  const BAR_FADE = 0.4;   // segundos que tarda en desvanecerse una casilla descartada
  function updateBarFade(dt) {
    if (!g.barFade) return;
    g.barFade.t += dt;
    if (g.barFade.t >= BAR_FADE) g.barFade = null;
  }

  // Barra guardada: sólo se aceptan munición y misiles que existan en el juego; el resto de casillas quedan vacías
  function sanitizeBar(list) {
    return Array.from({ length: 10 }, (_, i) => {
      const it = Array.isArray(list) ? list[i] : null;
      if (it && it.ammo && AMMO[it.ammo]) return { ammo: it.ammo };
      if (it && it.missile && MISSILES[it.missile]) return { missile: it.missile };
      if (it && it.repair && EXTRAS[it.repair] && EXTRAS[it.repair].repair) return { repair: it.repair };
      return null;
    });
  }

  // Objetos de la categoría abierta: todos los láseres o todos los misiles, en el orden de su tabla
  function barSubRow() {
    const items = g.barCat === 'laser' ? Object.keys(AMMO).map(ammo => ({ ammo }))
      : g.barCat === 'missile' ? Object.keys(MISSILES).map(missile => ({ missile }))
      : equippedRepairs().map(repair => ({ repair }));
    return [...items, ...Array(10 - items.length).fill(null)];
  }

  // Robots de reparación equipados en la nave actual; en la sección de CPUs solo aparecen estos
  function equippedRepairs() {
    return extraOf().filter(id => id && EXTRAS[id] && EXTRAS[id].repair);
  }

  // Una fila de 10 casillas. `keys`: muestra el número de la tecla que la activa
  function drawBarRow(y0, row, keys) {
    const x0 = barX0();
    for (let i = 0; i < 10; i++) {
      const x = x0 + i * (SLOT + GAP);
      const item = row[i];
      const id = item && item.ammo;
      const a = id ? AMMO[id] : null;
      const mid = item && item.missile;
      const m = mid ? MISSILES[mid] : null;
      const rep = item && item.repair ? EXTRAS[item.repair] : null;
      const selected = (a && g.p.ammo === id) || (m && g.p.missile === mid);
      ctx.fillStyle = 'rgba(12,24,48,0.92)';
      ctx.fillRect(x, y0, SLOT, SLOT);
      ctx.strokeStyle = selected ? '#ffd166' : 'rgba(150,200,255,0.75)';
      ctx.lineWidth = selected ? 2 : 1;
      ctx.strokeRect(x + 0.5, y0 + 0.5, SLOT - 1, SLOT - 1);
      // Categoría: sólo icono, sin texto
      if (item && item.category) {
        const cx = x + SLOT / 2, cy = y0 + SLOT / 2;
        if (item.category === 'laser') drawLaserIcon(cx, cy);
        else if (item.category === 'missile') drawMissileIcon(cx, cy);
        else drawCpuIcon(cx, cy);
        continue;
      }
      if (keys) {
        ctx.fillStyle = '#9fb3c8';
        ctx.font = '11px Consolas, monospace';
        ctx.textAlign = 'left';
        ctx.fillText(i === 9 ? '0' : String(i + 1), x + 5, y0 + 13);
      }
      if (a) {
        ctx.fillStyle = a.color;
        ctx.fillRect(x + SLOT / 2 - 12, y0 + 20, 24, 4);
        ctx.fillStyle = '#e6f2ff';
        ctx.font = '11px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(a.name, x + SLOT / 2, y0 + 42);
      }
      if (m) {
        ctx.fillStyle = m.color;
        ctx.fillRect(x + SLOT / 2 - 12, y0 + 20, 24, 4);
        ctx.fillStyle = '#e6f2ff';
        ctx.font = '11px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(m.name, x + SLOT / 2, y0 + 42);
      }
      if (rep) {
        ctx.fillStyle = REPAIR_COLOR;
        ctx.fillRect(x + SLOT / 2 - 12, y0 + 20, 24, 4);
        ctx.fillStyle = '#e6f2ff';
        ctx.font = '11px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(rep.name, x + SLOT / 2, y0 + 42);
      }
    }
    ctx.textAlign = 'left';
  }

  // Icono de CPUs: chip con sus patillas
  function drawCpuIcon(cx, cy) {
    ctx.save();
    ctx.strokeStyle = REPAIR_COLOR;
    ctx.shadowColor = REPAIR_COLOR;
    ctx.shadowBlur = 6;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(cx - 9, cy - 9, 18, 18);
    ctx.beginPath();
    for (const k of [-5, 0, 5]) {
      ctx.moveTo(cx + k, cy - 9); ctx.lineTo(cx + k, cy - 13);
      ctx.moveTo(cx + k, cy + 9); ctx.lineTo(cx + k, cy + 13);
      ctx.moveTo(cx - 9, cy + k); ctx.lineTo(cx - 13, cy + k);
      ctx.moveTo(cx + 9, cy + k); ctx.lineTo(cx + 13, cy + k);
    }
    ctx.stroke();
    ctx.fillStyle = REPAIR_COLOR;
    ctx.fillRect(cx - 4, cy - 4, 8, 8);
    ctx.restore();
  }

  // Icono de láseres: dos haces paralelos con brillo y un punto de disparo
  function drawLaserIcon(cx, cy) {
    ctx.save();
    ctx.strokeStyle = '#7fd6ff';
    ctx.shadowColor = '#7fd6ff';
    ctx.shadowBlur = 8;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy - 5); ctx.lineTo(cx + 12, cy - 5);
    ctx.moveTo(cx - 16, cy + 5); ctx.lineTo(cx + 12, cy + 5);
    ctx.stroke();
    ctx.fillStyle = '#e6f8ff';
    ctx.beginPath();
    ctx.arc(cx + 14, cy, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Icono de misiles: cohete apuntando hacia arriba, con aletas y llama
  function drawMissileIcon(cx, cy) {
    ctx.save();
    ctx.fillStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 16); ctx.lineTo(cx + 5, cy - 6); ctx.lineTo(cx + 5, cy + 8);
    ctx.lineTo(cx - 5, cy + 8); ctx.lineTo(cx - 5, cy - 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#7d8ea8';
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy + 2); ctx.lineTo(cx - 9, cy + 10); ctx.lineTo(cx - 5, cy + 8);
    ctx.closePath();
    ctx.moveTo(cx + 5, cy + 2); ctx.lineTo(cx + 9, cy + 10); ctx.lineTo(cx + 5, cy + 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath();
    ctx.moveTo(cx - 3, cy + 8); ctx.lineTo(cx + 3, cy + 8); ctx.lineTo(cx, cy + 15);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Flecha a la derecha de la décima casilla. Cerrada apunta hacia arriba; al desplegar la segunda barra apunta hacia abajo
  function drawBarArrow() {
    const b = barArrowGeom();
    const hover = inBox(b, mouse.x, mouse.y);
    ctx.fillStyle = hover ? 'rgba(255,209,102,0.25)' : 'rgba(12,24,48,0.92)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : 'rgba(150,200,255,0.75)';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    if (g.barOpen) {
      ctx.moveTo(b.x + 5, b.y + 7);
      ctx.lineTo(b.x + 15, b.y + 7);
      ctx.lineTo(b.x + 10, b.y + 14);
    } else {
      ctx.moveTo(b.x + 5, b.y + 13);
      ctx.lineTo(b.x + 15, b.y + 13);
      ctx.lineTo(b.x + 10, b.y + 6);
    }
    ctx.closePath();
    ctx.fill();
  }

  // Ventana del minimapa: icono cuando está colapsado; abierta, arrastrable y con cabecera de 30 px
  const MINIMAP_WIN_W = 236, MINIMAP_WIN_H = 176;
  // La barra de peligrosidad solo existe en los mapas X1 y X2 (segundo número 1 o 2), como ayuda para jugadores nuevos
  function dangerBarShown() { return /-[12]$/.test(g.zone.id); }

  function minimapIconGeom() { return winIconGeom('minimap'); }

  function minimapWinGeom() {
    if (!g.mapOpen) return minimapIconGeom();
    const w = dangerBarShown() ? MINIMAP_WIN_W : MINIMAP_WIN_W - 20;
    const pos = g.mapPos || { x: W - w - 16, y: H - MINIMAP_WIN_H - 16 };
    const x = clamp(pos.x, 0, W - w), y = clamp(pos.y, 0, H - MINIMAP_WIN_H);
    return { x, y, w, h: MINIMAP_WIN_H, close: { x: x + w - 26, y: y + 6, w: 20, h: 20 } };
  }

  // Geometría del mapa dentro de la ventana, compartida por el dibujo y los clics
  function minimapGeom() {
    const win = minimapWinGeom(), mw = 200, mh = 130, mx = win.x + (dangerBarShown() ? 26 : 8), my = win.y + 38, z = g.zone;
    const s = Math.min(mw / z.w, mh / z.h);
    const ox = mx + (mw - z.w * s) / 2, oy = my + (mh - z.h * s) / 2;
    return { mw, mh, mx, my, s, ox, oy, x: mx, y: my, w: mw, h: mh };
  }
