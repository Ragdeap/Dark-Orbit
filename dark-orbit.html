  // Icono del minimapa colapsado: un recuadro con la cruz de la nave
  function drawMapIcon(b) {
    const hover = inBox(b, mouse.x, mouse.y);
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x + 9.5, b.y + 9.5, 18, 17);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(b.x + 17, b.y + 16, 2, 2);
    if (hover) drawIconTooltip(b, 'Mapa');
  }

  // Peligrosidad de la zona: una unidad por cada bot vivo de otra empresa en el mapa, hasta 5
  function dangerLevel() {
    return Math.min(5, g.allies.filter(b => b.zi === g.zi && !b.dead && b.company !== g.p.company).length);
  }

  // Colores de los niveles de peligrosidad: de amarillo claro (1) a rojizo (5)
  const DANGER_COLORS = ['#fff2a8', '#ffd84a', '#ffb13b', '#ff7a2e', '#e0392b'];

  // Barra vertical de 5 niveles a la izquierda del mapa: se enciende un segmento por cada enemigo
  function drawDangerBar() {
    const { mx, my, mh } = minimapGeom();
    const bx = mx - 14, lvl = dangerLevel(), gap = 3, segH = (mh - 4 * gap) / 5;
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const y = my + mh - (i + 1) * segH - i * gap;
      ctx.fillStyle = i < lvl ? DANGER_COLORS[lvl - 1] : '#1b2a44';
      ctx.fillRect(bx, y, 8, segH);
      ctx.strokeStyle = '#5f6e84';
      ctx.strokeRect(bx + 0.5, y + 0.5, 7, segH - 1);
    }
  }

  function drawMinimap() {
    const win = minimapWinGeom();
    ctx.save();
    drawWinIcon(drawMapIcon, minimapIconGeom(), g.mapOpen);
    if (!g.mapOpen) { ctx.restore(); return; }
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(win.x, win.y, win.w, win.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(win.x + 0.5, win.y + 0.5, win.w - 1, win.h - 1);
    // Cabecera: mapa actual a la izquierda, coordenadas de la nave a la izquierda del botón de cerrar
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd166';
    ctx.fillText(`MAPA ${g.zone.id}`, win.x + 10, win.y + 22);
    ctx.font = '12px Consolas, monospace';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#cfe8ff';
    ctx.fillText(`${Math.floor(g.p.x / MINI_UNIT)} / ${Math.floor(g.p.y / MINI_UNIT)}`, win.close.x - 8, win.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(win.x + 8, win.y + 30, win.w - 16, 1);
    if (dangerBarShown()) drawDangerBar();
    const c = win.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();

    const { mw, mh, mx, my, s, ox, oy } = minimapGeom();
    const z = g.zone;
    // Fondo del mapa actual, con los mismos colores que el fondo principal
    const bg = ctx.createLinearGradient(0, my, 0, my + mh);
    bg.addColorStop(0, z.bgTop);
    bg.addColorStop(1, z.bgBottom);
    ctx.fillStyle = bg;
    ctx.fillRect(mx, my, mw, mh);
    // El planeta se dibuja a escala, sin parallax, recortado al recuadro del minimapa
    if (z.planet) {
      const pl = z.planet;
      ctx.save();
      ctx.beginPath();
      ctx.rect(mx, my, mw, mh);
      ctx.clip();
      drawPlanet({ r: pl.r * s, alpha: pl.alpha }, ox + pl.x * s, oy + pl.y * s);
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(120,160,255,0.5)';
    ctx.strokeRect(mx + 0.5, my + 0.5, mw - 1, mh - 1);
    ctx.strokeRect(ox, oy, z.w * s, z.h * s);
    // Todos los NPC se ven como un punto rojo, sin importar su tipo
    ctx.fillStyle = '#ff3b3b';
    for (const a of g.aliens) {
      ctx.beginPath();
      ctx.arc(ox + a.x * s, oy + a.y * s, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const b of g.allies) {
      if (b.zi !== g.zi || b.dead) continue;
      ctx.fillStyle = b.enemy ? '#ff5c5c' : '#4da6ff';
      ctx.beginPath();
      ctx.arc(ox + b.x * s, oy + b.y * s, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const portal of portalsOf(g.zi)) {
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(ox + portal.x * s - 2, oy + portal.y * s - 2, 4, 4);
    }
    if (z.base) {
      const base = z.base;
      ctx.strokeStyle = 'rgba(140,255,170,0.8)';
      ctx.beginPath();
      ctx.arc(ox + base.x * s, oy + base.y * s, Math.max(2, base.r * s), 0, Math.PI * 2);
      ctx.stroke();
    }

    // Líneas finas que marcan la posición del jugador; su cruce es la nave
    // Fuera del mapa la marca de la nave se queda en el borde del minimapa
    const px = clamp(ox + g.p.x * s, mx, mx + mw), py = clamp(oy + g.p.y * s, my, my + mh);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.moveTo(px + 0.5, my); ctx.lineTo(px + 0.5, my + mh);
    ctx.moveTo(mx, py + 0.5); ctx.lineTo(mx + mw, py + 0.5);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px - 2, py - 2, 4, 4);

    // Destino marcado desde el minimapa; desaparece al llegar o al dar otro destino.
    // La línea va de la nave al destino, así que se acorta según se avanza
    if (g.mmDest && g.p.tx === g.mmDest.x && g.p.ty === g.mmDest.y) {
      const dx = ox + g.p.tx * s, dy = oy + g.p.ty * s;
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(77,166,255,0.6)';
      ctx.beginPath();
      ctx.moveTo(px, py); ctx.lineTo(dx, dy);
      ctx.stroke();
      ctx.fillStyle = '#4da6ff';
      ctx.beginPath();
      ctx.arc(dx, dy, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawBackground() {
    const z = g.zone;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, z.bgTop);
    grad.addColorStop(1, z.bgBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    if (z.planet) drawPlanet(z.planet);
  }

  // Por defecto, el planeta de la vista principal: se mueve más despacio que la nave (parallax)
  // Colores de cada planeta: halo, discos, bandas y sombras. Venus es el que se usa si no se indica otro
  const PLANET_LOOK = {
    venus: { halo: '160,255,150', body: ['#f2ffc8', '#b8d86a', '#4d7a32'], band: '230,255,180', shade: '40,90,40' },
    earth: { halo: '120,190,255', body: ['#e4f4ff', '#4f9be0', '#1b3f80'], band: '220,240,255', shade: '20,60,130' },
    mars: { halo: '255,120,90', body: ['#ffd6c4', '#d9663a', '#7a2a14'], band: '255,200,170', shade: '120,40,20' },
  };

  function drawPlanet(pl, cx = W / 2 + (pl.x - g.p.x) * 0.25, cy = H / 2 + (pl.y - g.p.y) * 0.25) {
    ctx.save();
    ctx.globalAlpha = pl.alpha;

    // Atmósfera
    const look = PLANET_LOOK[pl.look] || PLANET_LOOK.venus;
    const halo = ctx.createRadialGradient(cx, cy, pl.r * 0.95, cx, cy, pl.r * 1.25);
    halo.addColorStop(0, `rgba(${look.halo},0.45)`);
    halo.addColorStop(1, `rgba(${look.halo},0)`);
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, pl.r * 1.25, 0, Math.PI * 2);
    ctx.fill();

    // Disco del planeta
    const body = ctx.createRadialGradient(cx - pl.r * 0.35, cy - pl.r * 0.35, pl.r * 0.1, cx, cy, pl.r);
    body.addColorStop(0, look.body[0]);
    body.addColorStop(0.5, look.body[1]);
    body.addColorStop(1, look.body[2]);
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(cx, cy, pl.r, 0, Math.PI * 2);
    ctx.fill();

    // Bandas de nubes, recortadas al disco
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, pl.r, 0, Math.PI * 2);
    ctx.clip();
    for (let i = -3; i <= 3; i++) {
      ctx.fillStyle = i % 2 ? `rgba(${look.band},0.14)` : `rgba(${look.shade},0.12)`;
      ctx.fillRect(cx - pl.r, cy + i * pl.r * 0.22, pl.r * 2, pl.r * 0.14);
    }
    ctx.restore();

    ctx.restore();
  }

  function draw() {
    // Las coordenadas de dibujo siguen siendo píxeles CSS; la transformación las escala a la resolución real
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    drawStars();
    drawWorldBackground();
    drawStation();
    drawMissionDesk();
    drawPickups();
    drawAliens();
    drawPems();
    drawAllies();
    drawProjectiles();
    drawParticles();
    drawTexts();
    drawMoveMarker();
    drawPlayer();

    if (g.p.dead) drawReviveMenu();
    if (g.hitFlash > 0) {
      ctx.fillStyle = `rgba(255,40,40,${g.hitFlash * 2})`;
      ctx.fillRect(0, 0, W, H);
    }

    drawHUD();
    drawMissionPanel();
    drawStationWindow();
    drawMissionDeskWindow();
    drawPlayerWindow();
    drawNaveWindow();
    drawRefineWindow();
    if (g.hangar.open) drawHangar();
    drawBoostConfirm();
    if (inBase()) drawWinIcon(drawHangarIcon, hangarIconGeom(), g.hangar.open);
    drawActionBar();
    drawSafeMsg();
    drawRadiationWarning();
    drawMinimap();
    if (g.banner > 0) drawCenter(g.bannerText, '#9fe3ff', 26, 1, H * 0.25);
    // Recompensas de la última baja: entran con un deslizamiento suave y se ocultan poco a poco en el último segundo
    if (g.rewardT > 0) {
      const inT = Math.min(1, (3 - g.rewardT) / 0.3);
      const alpha = inT * Math.min(1, g.rewardT / 0.6);
      const slide = (1 - inT) * -10;
      g.rewardLines.forEach((line, i) => drawCenter(line, '#ffffff', 18, alpha, 18 + slide + i * 22));
    }
    if (g.paused) {
      drawCenter('PAUSA', '#ffffff', 36, 1, H / 2);
      drawCenter('P / Esc para continuar', '#9fb3c8', 16, 0.9, H / 2 + 40);
    }
    drawCursor();
  }

  // ---------- Entrada ----------
  const mouse = { x: 0, y: 0, holding: false, downAt: 0 };
  canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  // Píxeles que hay que mover con el botón pulsado para pasar de un clic a arrastrar un objeto de la barra
  const BAR_DRAG_PX = 12;     // píxeles que hay que mover...
  const BAR_HOLD_MS = 150;    // ...con el botón mantenido al menos este tiempo
  canvas.addEventListener('mousedown', e => {
    // Confirmación de sustitución: mientras esté abierta, solo responden sus botones
    if (g.confirmBoost) {
      const d = confirmBoostGeom(), c = g.confirmBoost;
      if (inBox(d.yes, e.clientX, e.clientY)) { g.confirmBoost = null; applyBoost(c.key, c.slot, true); }
      else if (inBox(d.no, e.clientX, e.clientY)) g.confirmBoost = null;
      return;
    }
    // Nave destruida: solo el menú de reaparición responde a los clics
    if (g.p.dead) { const i = reviveIndexAt(e.clientX, e.clientY); if (i >= 0) revive(reviveOptions()[i].id); return; }
    // Icono del hangar: solo existe dentro de la base; un clic lo abre o lo cierra
    if (inBase() && inBox(hangarIconGeom(), e.clientX, e.clientY)) { g.hangar.open = !g.hangar.open; return; }
    // Panel del hangar: dentro responde el hangar; fuera el clic sigue llegando al juego
    if (g.hangar.open) {
      const L = hangarLayout();
      if (e.clientX >= L.px && e.clientX <= L.px + L.pw && e.clientY >= L.py && e.clientY <= L.py + L.ph) { hangarClick(e.clientX, e.clientY); return; }
    }
    // Iconos de ventana, arriba a la izquierda: un clic abre o cierra su ventana, también con la ventana abierta
    const winIcon = [
      ['missionOpen', missionIconGeom()], ['mapOpen', minimapIconGeom()], ['playerOpen', playerIconGeom()],
      ['naveOpen', naveIconGeom()], ['refineOpen', refineIconGeom()],
    ].find(([, b]) => inBox(b, e.clientX, e.clientY));
    if (winIcon) { g[winIcon[0]] = !g[winIcon[0]]; return; }
    // Ventana de misiones: el cuadrado la abre; el botón X la minimiza. Un clic dentro no mueve la nave
    const mp = missionPanelGeom();
    if (e.clientX >= mp.x && e.clientX <= mp.x + mp.w && e.clientY >= mp.y && e.clientY <= mp.y + mp.h) {
      const inRect = r => e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h;
      if (!g.missionOpen) { g.missionOpen = true; g.missionTab = 'summary'; }
      else if (inRect(mp.close)) g.missionOpen = false;
      else if (inRect(mp.tabs.description)) g.missionTab = 'description';
      else if (inRect(mp.tabs.summary)) g.missionTab = 'summary';
      else if (inRect(mp.tabs.rewards)) g.missionTab = 'rewards';
      else {
        // Slot de misión: selecciona esa misión y vuelve a la pestaña Resumen
        const s = mp.slots.findIndex(inRect);
        if (s >= 0 && s < g.missions.length) { g.missionSel = s; g.missionTab = 'summary'; }
        // Barra superior: arrastra la ventana
        else if (e.clientY < mp.y + 30) g.drag = { key: 'missionPos', dx: e.clientX - mp.x, dy: e.clientY - mp.y };
      }
      return;
    }
    // Ventana del minimapa: el icono la abre; la X la cierra; la barra superior la arrastra.
    // Dentro del mapa el clic sigue hasta el manejo del minimapa; en el resto de la ventana no hace nada
    const mw_ = minimapWinGeom();
    if (inBox(mw_, e.clientX, e.clientY)) {
      if (!g.mapOpen) { g.mapOpen = true; return; }
      if (inBox(mw_.close, e.clientX, e.clientY)) { g.mapOpen = false; return; }
      if (e.clientY < mw_.y + 30) { g.drag = { key: 'mapPos', dx: e.clientX - mw_.x, dy: e.clientY - mw_.y }; return; }
      if (!inBox(minimapGeom(), e.clientX, e.clientY)) return;
    }
    // Ventana de usuario: el icono la abre; la X la cierra; la barra superior la arrastra
    const pw = playerGeom();
    if (inBox(pw, e.clientX, e.clientY)) {
      if (!g.playerOpen) g.playerOpen = true;
      else if (inBox(pw.close, e.clientX, e.clientY)) g.playerOpen = false;
      else if (e.clientY < pw.y + 30) g.drag = { key: 'playerPos', dx: e.clientX - pw.x, dy: e.clientY - pw.y };
      return;
    }
    // Ventana de nave: el icono la abre; la X la cierra; la barra superior la arrastra
    const nw = naveGeom();
    if (inBox(nw, e.clientX, e.clientY)) {
      if (!g.naveOpen) g.naveOpen = true;
      else if (inBox(nw.close, e.clientX, e.clientY)) g.naveOpen = false;
      else if (e.clientY < nw.y + 30) g.drag = { key: 'navePos', dx: e.clientX - nw.x, dy: e.clientY - nw.y };
      return;
    }
    // Ventana de refinamiento: el icono la abre; la X la cierra; las pestañas cambian; cada botón refina una unidad
    const rw = refineGeom();
    if (inBox(rw, e.clientX, e.clientY)) {
      if (!g.refineOpen) g.refineOpen = true;
      else if (inBox(rw.close, e.clientX, e.clientY)) g.refineOpen = false;
      else {
        const tab = REF_TABS.find((t, i) => inBox(refineTabGeom(rw, i), e.clientX, e.clientY));
        const key = g.refineTab === 'refine' ? Object.keys(REFINE_RECIPES).find(k => inBox(refineCardGeom(rw, k).btn, e.clientX, e.clientY)) : null;
        const src = g.refineTab === 'improve' ? mejorarSourceAt(rw, e.clientX, e.clientY) : null;
        if (tab) g.refineTab = tab.id;
        else if (key) refine(key);
        else if (src) g.matDrag = { key: src, x: e.clientX, y: e.clientY };
        else if (e.clientY < rw.y + 30) g.drag = { key: 'refinePos', dx: e.clientX - rw.x, dy: e.clientY - rw.y };
      }
      return;
    }
    // Ventana de venta: la X la cierra y cada "Vender" vende esa materia; un clic dentro no mueve la nave
    if (g.stationOpen) {
      const sb = stationGeom();
      if (inBox(sb.close, e.clientX, e.clientY)) { g.stationOpen = false; return; }
      const row = sb.rows.find(r => inBox(r.btn, e.clientX, e.clientY));
      if (row) sellMaterial(row.m);
      if (inBox(sb, e.clientX, e.clientY)) return;
    }
    // Centro de misiones: Aceptar y Reclamar; un clic dentro no mueve la nave
    if (g.missionDeskOpen) {
      const db = missionDeskGeom();
      if (inBox(db.close, e.clientX, e.clientY)) { g.missionDeskOpen = false; return; }
      if (db.cancel && inBox(db.cancel.r, e.clientX, e.clientY)) { cancelMission(db.cancel.id); return; }
      if (db.action && inBox(db.action.r, e.clientX, e.clientY)) {
        if (db.action.kind === 'accept') acceptMission(db.action.id);
        else claimMission(g.missions.findIndex(en => en.id === db.action.id));
        return;
      }
      const row = db.rows.find(r => inBox(r.r, e.clientX, e.clientY) && inBox(db.list, e.clientX, e.clientY));
      if (row) { g.deskSel = row.id; return; }
      if (inBox(db, e.clientX, e.clientY)) return;
    }
    if (g.paused || g.p.dead) return;
    // Icono de teletransporte sobre la puerta: solo funciona al alcance
    const near = portalInRange();
    if (near && inBox(portalIconBox(near), e.clientX, e.clientY)) { teleport(near); return; }
    // Flecha de la barra: despliega o recoge las filas de categorías (al recogerlas se cierra la categoría abierta)
    if (inBox(barArrowGeom(), e.clientX, e.clientY)) { g.barOpen = !g.barOpen; if (!g.barOpen) g.barCat = null; return; }
    if (g.barOpen) {
      // Sección de categoría: abre o cierra la fila de objetos que tiene encima
      const sec = slotIn(e.clientX, e.clientY, barExtraGeom().y);
      if (sec >= 0 && BAR_EXTRA[sec] && BAR_EXTRA[sec].category) {
        const cat = BAR_EXTRA[sec].category;
        g.barCat = g.barCat === cat ? null : cat;
        return;
      }
      // Objetos de la categoría abierta: un clic lo selecciona y el doble clic ataca con él
      if (g.barCat) {
        const si = slotIn(e.clientX, e.clientY, barSubGeom().y);
        if (si >= 0) {
          const item = barSubRow()[si];
          // Modo edición: el objeto se puede arrastrar a una casilla de la barra principal
          if (item) g.barPress = { item, x: e.clientX, y: e.clientY, t: performance.now() };
          pickBarItem(item, e.detail >= 2);
          return;
        }
        if (inBox(barSubGeom(), e.clientX, e.clientY)) return;
      }
      if (inBox(barExtraGeom(), e.clientX, e.clientY)) return;
    }
    const slot = barSlotAt(e.clientX, e.clientY);
    if (slot >= 0) {
      // Modo edición: arrastrar una casilla la quita de la barra si se suelta fuera; un clic sin arrastrar la usa
      if (g.barOpen && g.bar[slot]) { g.barPress = { item: g.bar[slot], x: e.clientX, y: e.clientY, t: performance.now(), from: slot }; return; }
      useSlot(slot);
      return;
    }

    // Clic en el minimapa: la nave viaja al punto marcado. Cualquier otro clic lo cancela.
    const mm = minimapGeom();
    if (g.mapOpen && e.clientX >= mm.mx && e.clientX <= mm.mx + mm.mw && e.clientY >= mm.my && e.clientY <= mm.my + mm.mh) {
      g.p.tx = clamp((e.clientX - mm.ox) / mm.s, 0, g.zone.w);
      g.p.ty = clamp((e.clientY - mm.oy) / mm.s, 0, g.zone.h);
      g.mmDest = { x: g.p.tx, y: g.p.ty };
      return;
    }
    const wx = e.clientX - W / 2 + g.p.x;
    const wy = e.clientY - H / 2 + g.p.y;
    // Clic sobre la estación de venta: si la nave está cerca, abre la venta; si no, la nave se acerca
    const st = g.zone.station;
    if (e.button === 0 && st && dist(wx, wy, st.x, st.y) < STATION_CLICK) {
      if (stationNear()) g.stationOpen = true;
      else { g.p.tx = st.x; g.p.ty = st.y; }
      return;
    }
    // Clic sobre el centro de misiones: igual que la venta, abre la ventana o acerca la nave
    const md = g.zone.missions;
    if (e.button === 0 && md && dist(wx, wy, md.x, md.y) < STATION_CLICK) {
      if (missionDeskNear()) { g.missionDeskOpen = true; g.deskScroll = 0; g.deskSel = null; }
      else { g.p.tx = md.x; g.p.ty = md.y; }
      return;
    }
    // Clic sobre una caja de carga: la nave viaja hasta ella y la recoge al llegar
    const box = e.button === 0 ? g.pickups.find(k => k.type === 'cargo' && dist(k.x, k.y, wx, wy) < 18) : null;
    if (box) { box.want = true; g.p.tx = box.x; g.p.ty = box.y; return; }
    const a = e.button === 0 ? nearestFoe(wx, wy, 40) : null;
    if (a) {
      if (e.detail >= 2) startAttack(a);        // doble clic: inicia el ataque
      else if (a !== g.p.target) { g.p.target = a; g.p.attacking = false; }  // clic simple: cambia el objetivo fijado
      return;
    }
    g.p.tx = wx;
    g.p.ty = wy;
    mouse.holding = true;
    mouse.downAt = performance.now();
  });

  // Arrastre de la ventana de misiones: sigue al cursor hasta soltar el botón
  addEventListener('mousemove', e => {
    if (g.drag) g[g.drag.key] = { x: e.clientX - g.drag.dx, y: e.clientY - g.drag.dy };
    // Un clic sobre la barra solo se convierte en arrastre si el ratón se mueve lo suficiente con el botón pulsado
    if (g.barPress && performance.now() - g.barPress.t >= BAR_HOLD_MS && Math.hypot(e.clientX - g.barPress.x, e.clientY - g.barPress.y) > BAR_DRAG_PX) {
      g.barDrag = { ...g.barPress, x: e.clientX, y: e.clientY };
      g.barPress = null;
    }
    if (g.barDrag) { g.barDrag.x = e.clientX; g.barDrag.y = e.clientY; }
    if (g.matDrag) { g.matDrag.x = e.clientX; g.matDrag.y = e.clientY; }
  });

  addEventListener('mouseup', e => {
    g.drag = null;
    // Soltar una materia refinada sobre una categoría de la pestaña Mejorar la aplica; en otro sitio se cancela
    if (g.matDrag) {
      const slot = g.refineOpen ? mejorarSlotAt(refineGeom(), e.clientX, e.clientY) : null;
      if (slot) applyBoost(g.matDrag.key, slot);
      g.matDrag = null;
    }
    // Clic sin arrastre sobre una casilla de la barra principal: la usa
    if (g.barPress) {
      if (g.barPress.from !== undefined) useSlot(g.barPress.from);
      g.barPress = null;
    }
    if (g.barDrag) { dropBarItem(e.clientX, e.clientY); return; }
    if (!mouse.holding) return;
    mouse.holding = false;
    // Un clic corto es un destino; si se mantuvo pulsado, la nave se detiene al soltar
    if (performance.now() - mouse.downAt > 200) g.p.tx = null;
  });

  function startAttack(a) {
    if (!hasLaser()) { showBanner('Sin láseres equipados'); return; }
    const p = g.p;
    p.target = a;
    p.attacking = true;
    markHostile();
  }

  // Casilla de la barra (clic o tecla). Un láser alterna el ataque: si ya se ataca con ese láser, cesa;
  // si se ataca con otro, cambia de láser y sigue atacando
  function useSlot(i) {
    const item = g.bar[i];
    if (!item) return;
    if (item.repair) { startRepair(item.repair); return; }
    if (item.missile) g.p.missile = item.missile;
    if (!item.ammo) return;
    if (g.p.attacking && g.p.ammo === item.ammo) { g.p.attacking = false; return; }
    g.p.ammo = item.ammo;
    if (g.p.target && g.p.target.hp > 0 && !g.p.dead) startAttack(g.p.target);
  }

  // Objeto de una categoría: el clic lo selecciona como munición o misil. El doble clic además ataca con él
  // (láser: ataca al NPC fijado; misil: lo dispara contra el NPC fijado)
  function pickBarItem(item, dbl) {
    if (!item) return;
    // Un robot de reparación se activa con un clic; no cambia la munición ni el misil
    if (item.repair) { startRepair(item.repair); return; }
    if (item.ammo) g.p.ammo = item.ammo;
    if (item.missile) g.p.missile = item.missile;
    if (!dbl || g.p.dead) return;
    if (item.missile) fireMissile();
    else if (g.p.target && g.p.target.hp > 0) startAttack(g.p.target);
  }

  function barX0() { return W / 2 - (10 * SLOT + 9 * GAP) / 2; }
  function barY0() { return H - SLOT - 24; }
  // Flecha a la derecha de la décima casilla, centrada verticalmente en la barra
  function barArrowGeom() { return { x: barX0() + 10 * (SLOT + GAP), y: barY0() + (SLOT - 20) / 2, w: 20, h: 20 }; }
  // Fila de categorías, encima de la principal y alineada con ella, cuando la flecha está desplegada
  function barExtraGeom() { return { x: barX0(), y: barY0() - SLOT - GAP, w: 10 * SLOT + 9 * GAP, h: SLOT }; }
  // Fila de objetos de la categoría abierta, encima de la fila de categorías
  function barSubGeom() { return { x: barX0(), y: barY0() - 2 * (SLOT + GAP), w: 10 * SLOT + 9 * GAP, h: SLOT }; }

  // Casilla de una fila (y0 = borde superior) en la que cae (x, y), o -1
  function slotIn(x, y, y0) {
    const i = Math.floor((x - barX0()) / (SLOT + GAP));
    if (i < 0 || i > 9) return -1;
    const rel = x - barX0() - i * (SLOT + GAP);
    return rel <= SLOT && y >= y0 && y <= y0 + SLOT ? i : -1;
  }

  function barSlotAt(x, y) {
    const i = Math.floor((x - barX0()) / (SLOT + GAP));
    if (i < 0 || i > 9) return -1;
    const rel = x - barX0() - i * (SLOT + GAP);
    return rel <= SLOT && y >= barY0() && y <= barY0() + SLOT ? i : -1;
  }

  function toggleAttack() {
    if (g.p.attacking) g.p.attacking = false;
    else if (g.p.target && g.p.target.hp > 0 && !g.p.dead) startAttack(g.p.target);
  }

  addEventListener('keydown', e => {
    // Esc cierra el hangar; mientras está abierto el juego sigue y las teclas de combate responden
    if (g.hangar.open && e.code === 'Escape') { g.hangar.open = false; return; }
    if (e.code === 'ControlLeft' || e.code === 'ControlRight') {
      e.preventDefault();
      if (!e.repeat && !g.paused) toggleAttack();
      return;
    }
    if (e.code === 'KeyP' || e.code === 'Escape') { g.paused = !g.paused; return; }
    if (g.paused) return;
    if (e.code === 'KeyJ') teleport(portalInRange());
    const slot = BAR_KEYS.indexOf(e.code);
    if (slot >= 0) useSlot(slot);
    if (e.code === 'Space') { e.preventDefault(); fireMissile(); }
    const u = UPGRADES.find(x => x.key === e.code);
    if (u) buyUpgrade(u);
  });

  // ---------- Guardado ----------
  // El progreso se guarda en el servidor local (server.js), nunca en el navegador
  const SAVE_EVERY = 5;   // segundos entre guardados automáticos
  let saveT = 0;
  let storageOk = true;   // false si la última escritura en el servidor ha fallado

  function saveGame() {
    const p = g.p;
    const data = {
      zi: g.zi, x: p.x, y: p.y, hp: p.hp, maxHp: p.maxHp, shield: p.shield,
      damage: p.damage, speed: p.speed, ammo: p.ammo, missile: p.missile,
      up: g.up, credits: g.credits, uridium: g.uridium, exp: g.exp, honor: g.honor,
      cargo: g.cargo, refine: g.refine, missions: g.missions, taken: g.taken, completed: g.completed, missionPos: g.missionPos,
      mapOpen: g.mapOpen, mapPos: g.mapPos, playerId: g.playerId, playerPos: g.playerPos, navePos: g.navePos, refinePos: g.refinePos, teleportBonus: g.teleportBonus, lootKeys: g.lootKeys,
      shipId: g.shipId, equip: g.equip, generators: g.generators, missiles: g.missiles, extras: g.extras, inv: g.inv, boost: g.boost,
      bots: g.allies.map(b => ({ name: b.name, zi: b.zi, x: b.x, y: b.y, exp: b.exp, honor: b.honor })),
      world: { ...g.world, [g.zone.id]: saveAliens(g.aliens) },
      bar: g.bar,
    };
    fetch('/api/save', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data), keepalive: true })
      .then(r => { storageOk = r.ok; }, () => { storageOk = false; });
  }

  // Lee el progreso del servidor. Si no responde, rechaza: el juego no debe arrancar sin él
  function readSave() {
    return fetch('/api/save').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  // Devuelve false si no hay progreso guardado válido; entonces se empieza de cero
  function loadGame(d) {
    if (!d || !ZONES[d.zi] || !SHIPS[d.shipId]) return false;
    g = newState();
    g.zi = d.zi; g.zone = ZONES[d.zi];
    g.world = d.world || {};
    g.aliens = restoreAliens(g.world[g.zone.id]);
    g.shipId = d.shipId; g.equip = d.equip; g.generators = d.generators; g.missiles = d.missiles || {}; g.extras = d.extras || {};
    // Las partidas guardadas antes de un tipo de inventario (p. ej. naves) reciben lo que les falte a partir de lo equipado
    g.inv = { ...inventoryFrom(d.equip, d.generators || {}, d.shipId, d.missiles || {}, d.extras || {}), ...d.inv };
    // Todo jugador tiene el robot de reparación básico (REP1), también en las partidas que no lo tenían
    g.inv.extras.REP1 = Math.max(1, g.inv.extras.REP1 || 0);
    g.up = d.up; g.credits = d.credits; g.uridium = d.uridium; g.exp = d.exp; g.honor = d.honor;
    g.cargo = { ...g.cargo, ...d.cargo };
    g.refine = { ...g.refine, ...d.refine };
    // Mejoras temporales: si la materia guardada ya no vale para su categoría, la categoría queda vacía
    if (d.boost) g.boost = { ...g.boost, ...d.boost };
    for (const s of BOOST_SLOTS) {
      const k = g.boost[s].key;
      if (!BOOST[k] || BOOST[k][s] === undefined) g.boost[s] = { key: null, left: 0 };
    }
    if (Array.isArray(d.missions)) {
      g.missions = d.missions;
      // Las partidas antiguas guardaban nextMission: las misiones anteriores a ese número ya estaban aceptadas
      g.taken = Array.isArray(d.taken) ? d.taken : Array.from({ length: d.nextMission || 0 }, (_, i) => i);
      // Partidas antiguas sin orden de completado: se usa el de aceptación
      g.completed = Array.isArray(d.completed) ? d.completed : g.taken.filter(id => !g.missions.some(e => e.id === id));
    }
    if (d.missionPos) g.missionPos = d.missionPos;
    if (d.playerId) g.playerId = d.playerId;
    if (d.playerPos) g.playerPos = d.playerPos;
    g.mapOpen = d.mapOpen !== false;
    if (d.mapPos) g.mapPos = d.mapPos;
    if (d.navePos) g.navePos = d.navePos;
    if (d.refinePos) g.refinePos = d.refinePos;
    g.teleportBonus = d.teleportBonus || 0;
    g.lootKeys = d.lootKeys || 0;
    // Partidas anteriores a la barra editable no tienen "bar": se queda la barra por defecto
    if (Array.isArray(d.bar)) g.bar = sanitizeBar(d.bar);
    const p = g.p;
    p.x = d.x; p.y = d.y; p.maxHp = d.maxHp; p.hp = d.hp > 0 ? d.hp : d.maxHp;
    p.damage = d.damage; p.speed = d.speed;
    if (AMMO[d.ammo]) p.ammo = d.ammo;
    if (MISSILES[d.missile]) p.missile = d.missile;
    // Escudo: la capacidad sale de los generadores equipados; la reserva se limita a ella
    const st = shieldStats();
    p.maxShield = st.max; p.absorb = st.absorb; p.shield = Math.min(d.shield, st.max);
    // Progreso de los bots, emparejado por nombre; los que no estén en el guardado empiezan de cero
    for (const s of Array.isArray(d.bots) ? d.bots : []) {
      const b = g.allies.find(x => x.name === s.name);
      if (!b || !ZONES[s.zi]) continue;
      b.zi = s.zi; b.x = b.tx = s.x; b.y = b.ty = s.y; b.exp = s.exp; b.honor = s.honor;
    }
    return true;
  }

  // ---------- Bucle principal ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!g.paused) {
      update(dt);
      checkTravel();
      if (!stationNear()) g.stationOpen = false;   // al alejarse, la venta se cierra
      if (!missionDeskNear()) g.missionDeskOpen = false;   // y el centro de misiones igual
    }
    if (!inBase()) g.hangar.open = false;   // el icono del hangar solo existe en la base
    draw();
    saveT += dt;
    if (saveT >= SAVE_EVERY) { saveT = 0; saveGame(); }
    requestAnimationFrame(frame);
  }

  // Sonido de entrada: solo lo oye este jugador, una vez. Se llama desde el clic de "Entrar",
  // así que el navegador ya permite reproducir audio
  function playLoginSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createBufferSource();
      src.buffer = makeTone(1.5, loginSample);
      src.connect(audioCtx.destination);
      src.start();
    } catch (err) {
      // Sin audio disponible: el juego sigue funcionando
    }
  }

  // Entrar es un clic del jugador: quita la pantalla de entrada, suena el sonido y empieza la partida
  function enterGame(entrada) {
    entrada.remove();
    playLoginSound();
    requestAnimationFrame(frame);
  }

  function loadExtras() {
    return fetch('extras.json')
      .then(r => r.json())
      .then(data => { EXTRAS = data; })
      .catch(() => {});   // Sin catálogo: el juego sigue, sin extras
  }

  // Sprites 2,5D: 32 frames de 11,25° por nave, en sprites/naves/<carpeta>. Sin ellos se dibuja el polígono de siempre
  let SPRITES = {};
  function loadSprite(ruta) {
    return fetch('sprites/' + ruta + '/frames.json')
      .then(r => r.json())
      .then(data => Promise.all(data.frames.map(f => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = 'sprites/' + ruta + '/' + f.file;
      }))).then(imgs => ({ frames: imgs, half: spriteHalf(imgs, data), pivot: data.pivot, count: imgs.length, tilt: data.tiltDeg * Math.PI / 180 })))
      .catch(() => null);
  }

  // Sprites 2,5D de los NPC que lo tienen (campo sprite de ALIEN), en sprites/npc/<carpeta>
  let NPC_SPRITES = {};
  function loadNpcSprites() {
    return Promise.all(Object.keys(ALIEN).filter(t => ALIEN[t].sprite).map(t => loadSprite('npc/' + ALIEN[t].sprite).then(sp => { if (sp) NPC_SPRITES[t] = sp; })));
  }

  // Naves, pasivas, láseres, generadores, munición y misiles: sin ellos no hay juego, así que un fallo se muestra como servidor no disponible
  function loadEquipo() {
    const cargar = archivo => fetch('datos/' + archivo).then(r => r.json());
    return Promise.all([cargar('naves.json'), cargar('pasivas-naves.json'), cargar('laseres.json'), cargar('generadores.json'), cargar('municion.json'), cargar('misiles.json')])
      .then(([naves, pasivas, laseres, generadores, municion, misiles]) => {
        SHIPS = naves; LOW_MAP_PASSIVES = pasivas; LASERS = laseres; GENERATORS = generadores; AMMO = municion; MISSILES = misiles;
        return Promise.all(Object.keys(SHIPS).filter(id => SHIPS[id].sprite).map(id => loadSprite('naves/' + SHIPS[id].sprite).then(sp => { if (sp) SPRITES[id] = sp; })));
      });
  }

  // Catálogo de misiones: sin misiones.json no hay misiones, pero el juego sigue
  function loadMissions() {
    return fetch('misiones.json')
      .then(r => r.json())
      .then(data => { MISSIONS = data; })
      .catch(() => {});
  }

  // El botón de entrar se activa cuando el progreso, el equipo y los catálogos de extras y misiones están cargados
  Promise.all([readSave(), loadEquipo(), loadNpcSprites(), loadExtras(), loadMissions()]).then(([d]) => {
    if (!loadGame(d)) reset();
    addEventListener('pagehide', saveGame);
    const entrar = document.getElementById('entrar');
    entrar.textContent = 'Entrar';
    entrar.disabled = false;
    entrar.addEventListener('click', () => enterGame(document.getElementById('entrada')), { once: true });
  }, showServerMissing);
})();
</script>
</body>
</html>
