    ctx.fillStyle = '#5ad1ff';
    ctx.fillText('ESTACIÓN DE VENTA', b.x + 12, b.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.x + 8, b.y + 30, b.w - 16, 1);
    ctx.fillText('Materia', b.x + 14, b.y + 50);
    ctx.textAlign = 'right';
    ctx.fillText('Cant.', b.x + 160, b.y + 50);
    ctx.fillText('Precio', b.x + 262, b.y + 50);
    // Botón de cerrar
    const c = b.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();
    // Una fila por materia: nombre, cantidad en bodega, precio por unidad y botón de venta
    for (const { m, btn } of b.rows) {
      const ty = btn.y + 13;
      ctx.textAlign = 'left';
      ctx.fillStyle = g.cargo[m.key] ? '#cfe8ff' : '#5f6e84';
      ctx.fillText(m.name, b.x + 14, ty);
      ctx.textAlign = 'right';
      ctx.fillText(`${g.cargo[m.key]} ud`, b.x + 160, ty);
      ctx.fillText(`${m.price} cr/ud`, b.x + 262, ty);
      ctx.fillStyle = '#1b2a44';
      ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
      ctx.strokeStyle = '#5ad1ff';
      ctx.strokeRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1);
      ctx.fillStyle = '#5ad1ff';
      ctx.textAlign = 'center';
      ctx.fillText('Vender', btn.x + btn.w / 2, ty);
    }
    ctx.restore();
  }

  // Ventana de misiones y mejoras: minimizada es un cuadrado arriba a la derecha; abierta, un panel de fondo sólido
  const MAX_MISSIONS = 5;   // misiones aceptadas a la vez
  function canAcceptMission() {
    return g.missions.length < MAX_MISSIONS && g.nextMission < MISSIONS.length;
  }

  function missionPanelGeom() {
    if (!g.missionOpen) return { x: W - 52, y: 16, w: 36, h: 36 };
    const w = 300, h = 190;
    // Por defecto arriba a la derecha; si se ha arrastrado, se queda en la posición elegida (dentro de la pantalla)
    const pos = g.missionPos || { x: W - w - 16, y: 64 };
    const x = clamp(pos.x, 0, W - w), y = clamp(pos.y, 0, H - h);
    // Bolas de misiones junto a la X, alineadas a la derecha; una por misión aceptada
    const n = g.missions.length;
    return {
      x, y, w, h,
      close: { x: x + w - 26, y: y + 6, w: 20, h: 20 },
      slots: g.missions.map((_, i) => ({ x: x + w - 48 - (n - 1 - i) * 16, y: y + 8, w: 16, h: 16 })),
      tabs: {
        description: { x: x + 8, y: y + 40, w: 96, h: 22 },
        summary: { x: x + 110, y: y + 40, w: 70, h: 22 },
        rewards: { x: x + 186, y: y + 40, w: 90, h: 22 },
      },
    };
  }

  // Divide un texto en líneas que no superen maxW (con la fuente actual del contexto)
  function wrapText(text, maxW) {
    const lines = [];
    let line = '';
    for (const word of text.split(' ')) {
      const test = line ? `${line} ${word}` : word;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // Etiqueta que aparece debajo de un icono al pasar el ratón
  function drawIconTooltip(b, label) {
    ctx.font = '13px Consolas, monospace';
    const tw = ctx.measureText(label).width;
    const bx = b.x + b.w / 2 - (tw + 16) / 2, by = b.y + b.h + 8;
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(bx, by, tw + 16, 22);
    ctx.strokeStyle = '#ffd166';
    ctx.strokeRect(bx + 0.5, by + 0.5, tw + 15, 21);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(label, bx + 8, by + 15);
  }

  // Icono minimizado: una exclamación dorada sobre un cuadro oscuro, con brillo y etiqueta al pasar el ratón
  function drawMissionIcon(b) {
    const hover = mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h;
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = hover ? 16 : 6;
    ctx.font = 'bold 24px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('!', b.x + b.w / 2, b.y + b.h / 2 + 1);
    ctx.shadowBlur = 0;
    if (hover) drawIconTooltip(b, 'Misiones');
  }

  function drawMissionPanel() {
    const b = missionPanelGeom();
    ctx.save();
    if (!g.missionOpen) { drawMissionIcon(b); ctx.restore(); return; }
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    // Icono de misiones (solo la exclamación) junto al nombre de la ventana
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 14px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('!', b.x + 18, b.y + 22);
    ctx.font = '13px Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('MISIONES', b.x + 30, b.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.x + 8, b.y + 30, b.w - 16, 1);
    // Botón de cerrar (vuelve a minimizarse)
    const c = b.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();

    // Una bola por misión aceptada: blanca la seleccionada, gris el resto
    b.slots.forEach((s, i) => {
      ctx.beginPath();
      ctx.arc(s.x + s.w / 2, s.y + s.h / 2, 4, 0, Math.PI * 2);
      ctx.fillStyle = i === g.missionSel ? '#ffffff' : '#5f6e84';
      ctx.fill();
    });

    // Pestañas: Resumen (objetivo) y Recompensa
    const tabs = [['description', 'Descripción'], ['summary', 'Resumen'], ['rewards', 'Recompensa']];
    for (const [id, label] of tabs) {
      const r = b.tabs[id];
      const active = g.missionTab === id;
      ctx.fillStyle = active ? '#ffd166' : '#5f6e84';
      ctx.fillText(label, r.x + 4, r.y + 15);
      if (active) ctx.fillRect(r.x, r.y + r.h, r.w, 2);
    }

    // Misión del slot seleccionado
    const entry = g.missions[g.missionSel];
    const m = entry ? MISSIONS[entry.id] : null;
    const allDone = !g.missions.length && g.nextMission >= MISSIONS.length;
    // Título de la misión, destacado sobre el resto de la información
    if (m) {
      ctx.font = 'bold 14px Consolas, monospace';
      ctx.fillStyle = '#ffd166';
      ctx.fillText(m.title, b.x + 12, b.y + 84);
      ctx.font = '13px Consolas, monospace';
    }
    ctx.fillStyle = '#cfe8ff';
    if (g.missionTab === 'description') {
      // Historia de la misión, con el mismo margen que los requisitos y ajustada al ancho disponible
      if (m) {
        wrapText(m.description, b.w - 40).forEach((line, i) => ctx.fillText(line, b.x + 28, b.y + 104 + i * 18));
      } else {
        ctx.fillText('No hay misiones activas', b.x + 12, b.y + 84);
      }
    } else if (g.missionTab === 'summary') {
      if (m) {
        // Requisitos de la misión, con margen izquierdo para diferenciarlos del título
        ctx.fillText(m.text, b.x + 28, b.y + 104);
        ctx.fillText(`${entry.progress} / ${m.count}`, b.x + 28, b.y + 122);
      } else {
        ctx.fillText(allDone ? 'Todas las misiones completadas' : 'No hay misiones activas', b.x + 12, b.y + 84);
      }
    } else if (m) {
      // Solo se listan las recompensas que da la misión
      REWARD_LABELS.filter(([k]) => m.rewards[k]).forEach(([k, label], i) => {
        ctx.fillText(`${label}: ${m.rewards[k]}`, b.x + 28, b.y + 104 + i * 18);
      });
    } else {
      ctx.fillText('No hay misiones activas', b.x + 12, b.y + 84);
    }
    ctx.restore();
  }

  function drawHUD() {
    const p = g.p;
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';

    // Izquierda arriba: solo el aviso de guardado. Casco, escudo y munición están en la ventana de nave
    if (!storageOk) {
      ctx.fillStyle = '#ff9f1a';
      ctx.fillText('Progreso no guardado: se ha perdido la conexión con el servidor', 16, 34);
    }

    ctx.textAlign = 'left';

  }

  // ---------- Hangar ----------
  // Icono del hangar, arriba a la derecha junto a los de nave, usuario y misiones
  function hangarIconGeom() { return { x: W - 184, y: 16, w: 36, h: 36 }; }

  function inBase() {
    const z = g.zone, p = g.p;
    return dist(p.x, p.y, z.base.x, z.base.y) < z.base.r;
  }

  // Icono del hangar: solo se abre dentro de la base; fuera aparece apagado
  function drawHangarIcon(b) {
    const hover = inBox(b, mouse.x, mouse.y);
    const on = inBase();
    const col = on ? '#ffd166' : '#5f6e84';
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover && on ? '#fff0b3' : col;
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    // Edificio del hangar: cubierta curva con puerta
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx - 9, cy + 7);
    ctx.lineTo(cx - 9, cy - 1);
    ctx.quadraticCurveTo(cx, cy - 10, cx + 9, cy - 1);
    ctx.lineTo(cx + 9, cy + 7);
    ctx.moveTo(cx - 4, cy + 7);
    ctx.lineTo(cx - 4, cy + 1);
    ctx.lineTo(cx + 4, cy + 1);
    ctx.lineTo(cx + 4, cy + 7);
    ctx.stroke();
    if (hover) drawIconTooltip(b, on ? 'Hangar' : 'Hangar (solo en la base)');
  }

  // Distribución del hangar: se adapta al número de naves, ranuras y láseres
  // Distribución del hangar: se adapta al número de naves, ranuras y opciones.
  // La lista de opciones muestra láseres o generadores según la ranura seleccionada.
  function hangarLayout() {
    const pw = 620;
    const shipIds = Object.keys(SHIPS);
    const laserOpts = [null, ...Object.keys(LASERS)];      // null = ranura vacía
    const genOpts = [null, ...Object.keys(GENERATORS)];
    const ship = SHIPS[g.shipId];
    const shipRows = Math.ceil(shipIds.length / 4);
    const optRows = Math.ceil(Math.max(laserOpts.length, genOpts.length) / 4);
    const n = ship.slots, gn = ship.genSlots;
    const slotW = Math.min(70, (pw - 40 - (n - 1) * 8) / n);
    const slotLabel = 50 + shipRows * 32 + 12;   // posiciones relativas al panel
    const slotY = slotLabel + 8;
    const genLabel = slotY + 70 + 22;
    const genY = genLabel + 8;
    const optLabel = genY + 70 + 22;
    const optY = optLabel + 12;
    const ph = optY + optRows * 50 + 30;
    const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
    const optType = g.hangar.sel.type;
    const ships = shipIds.map((id, i) => ({ id, x: px + 20 + (i % 4) * 150, y: py + 50 + Math.floor(i / 4) * 32, w: 140, h: 28 }));
    const slots = Array.from({ length: n }, (_, i) => ({ i, x: px + 20 + i * (slotW + 8), y: py + slotY, w: slotW, h: 70 }));
    const genSlots = Array.from({ length: gn }, (_, i) => ({ i, x: px + 20 + i * (slotW + 8), y: py + genY, w: slotW, h: 70 }));
    const options = (optType === 'gen' ? genOpts : laserOpts)
      .map((id, i) => ({ id, x: px + 20 + (i % 4) * 150, y: py + optY + Math.floor(i / 4) * 50, w: 140, h: 40 }));
    const close = { x: px + pw - 34, y: py + 10, w: 24, h: 24 };
    return {
      px, py, pw, ph, ships, slots, genSlots, options, close, optType,
      slotLabelY: py + slotLabel, genLabelY: py + genLabel, optLabelY: py + optLabel, instrY: py + ph - 16,
    };
  }

  // Cambia de nave en el hangar: la vida y la velocidad pasan a ser las de la nueva nave (vida completa)
  function applyShip(id) {
    if (id === g.shipId) return;
    const ship = SHIPS[id], p = g.p;
    g.shipId = id;
    p.maxHp = ship.hp; p.hp = ship.hp;
    p.speed = ship.speed;
    g.hangar.sel = { type: 'laser', i: 0 };
    refreshShield();
  }

  function hangarClick(x, y) {
    const L = hangarLayout();
    const hit = r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
    if (hit(L.close)) { g.hangar.open = false; return; }
    for (const s of L.ships) if (hit(s)) { applyShip(s.id); return; }
    for (const s of L.slots) if (hit(s)) { g.hangar.sel = { type: 'laser', i: s.i }; return; }
    for (const s of L.genSlots) if (hit(s)) { g.hangar.sel = { type: 'gen', i: s.i }; return; }
    for (const o of L.options) if (hit(o)) {
      if (L.optType === 'gen') genOf()[g.hangar.sel.i] = o.id;
      else equipOf()[g.hangar.sel.i] = o.id;
      refreshShield();
      return;
    }
  }

  function hangarButton(x, y, w, h, text, active) {
    ctx.fillStyle = active ? 'rgba(255,209,102,0.2)' : 'rgba(12,24,48,0.92)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = active ? '#ffd166' : 'rgba(150,200,255,0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = '#e6f2ff';
    ctx.font = '13px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }

  function drawHangar() {
    const L = hangarLayout();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(8,16,32,0.96)';
    ctx.fillRect(L.px, L.py, L.pw, L.ph);
    ctx.strokeStyle = 'rgba(150,200,255,0.75)';
    ctx.strokeRect(L.px + 0.5, L.py + 0.5, L.pw - 1, L.ph - 1);

    ctx.fillStyle = '#e6f2ff';
    ctx.font = '16px Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('HANGAR', L.px + 20, L.py + 30);
    hangarButton(L.close.x, L.close.y, L.close.w, L.close.h, 'X', false);

    for (const s of L.ships) {
      hangarButton(s.x, s.y, s.w, s.h, `${SHIPS[s.id].name} (${SHIPS[s.id].slots})`, s.id === g.shipId);
    }

    const sel = g.hangar.sel;
    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText('Ranuras de láser', L.px + 20, L.slotLabelY);
    for (const s of L.slots) {
      const id = equipOf()[s.i];
      hangarButton(s.x, s.y, s.w, s.h, id ? LASERS[id].name : '—', sel.type === 'laser' && s.i === sel.i);
      ctx.fillStyle = '#5f6e84';
      ctx.font = '11px Consolas, monospace';
      ctx.fillText(String(s.i + 1), s.x + 5, s.y + 13);
    }

    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText('Generadores', L.px + 20, L.genLabelY);
    for (const s of L.genSlots) {
      const id = genOf()[s.i];
      hangarButton(s.x, s.y, s.w, s.h, id ? GENERATORS[id].name : '—', sel.type === 'gen' && s.i === sel.i);
      ctx.fillStyle = '#5f6e84';
      ctx.font = '11px Consolas, monospace';
      ctx.fillText(String(s.i + 1), s.x + 5, s.y + 13);
    }

    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText(L.optType === 'gen' ? 'Generadores disponibles' : 'Láseres disponibles', L.px + 20, L.optLabelY);
    for (const o of L.options) {
      let name = 'Vacío';
      if (o.id) name = L.optType === 'gen' ? GENERATORS[o.id].name : LASERS[o.id].name;
      hangarButton(o.x, o.y, o.w, o.h, name, false);
    }

    ctx.fillStyle = '#5f6e84';
    ctx.fillText('Selecciona una ranura y luego una opción. Esc para cerrar.', L.px + 20, L.instrY);
  }

  function drawSafeMsg() {
    if (g.safeT <= 0) return;
    ctx.save();
    // Aparece en 0,6 s y se oculta poco a poco en el último segundo (dura 3 s)
    ctx.globalAlpha = Math.min(1, g.safeT, (3 - g.safeT) / 0.6);
    ctx.fillStyle = '#5dff8a';
    ctx.font = '18px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Zona de no ataques', W / 2, 72);
    ctx.restore();
  }

  function drawActionBar() {
    const x0 = barX0(), y0 = barY0();
    for (let i = 0; i < 10; i++) {
      const x = x0 + i * (SLOT + GAP);
      const item = BAR[i];
      const id = item && item.ammo;
      const a = id ? AMMO[id] : null;
      const mid = item && item.missile;
      const m = mid ? MISSILES[mid] : null;
      const selected = (a && g.p.ammo === id) || (m && g.p.missile === mid);
      ctx.fillStyle = 'rgba(12,24,48,0.92)';
      ctx.fillRect(x, y0, SLOT, SLOT);
      ctx.strokeStyle = selected ? '#ffd166' : 'rgba(150,200,255,0.75)';
      ctx.lineWidth = selected ? 2 : 1;
      ctx.strokeRect(x + 0.5, y0 + 0.5, SLOT - 1, SLOT - 1);
      ctx.fillStyle = '#9fb3c8';
      ctx.font = '11px Consolas, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(i === 9 ? '0' : String(i + 1), x + 5, y0 + 13);
      if (a) {
        ctx.fillStyle = a.color;
        ctx.fillRect(x + SLOT / 2 - 12, y0 + 20, 24, 4);
        ctx.fillStyle = '#e6f2ff';
        ctx.font = '11px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(a.name, x + SLOT / 2, y0 + 42);
      }
      if (m) {
        ctx.fillStyle = m.color;
        ctx.fillRect(x + SLOT / 2 - 12, y0 + 20, 24, 4);
        ctx.fillStyle = '#e6f2ff';
        ctx.font = '11px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(m.name, x + SLOT / 2, y0 + 42);
      }
    }
    ctx.textAlign = 'left';
  }

  // Geometría del minimapa (esquina inferior derecha), compartida por el dibujo y los clics
  function minimapGeom() {
    const mw = 200, mh = 130, mx = W - mw - 16, my = H - mh - 16, z = g.zone;
    const s = Math.min(mw / z.w, mh / z.h);
    const ox = mx + (mw - z.w * s) / 2, oy = my + (mh - z.h * s) / 2;
    return { mw, mh, mx, my, s, ox, oy };
  }

  function drawMinimap() {
    const { mw, mh, mx, my, s, ox, oy } = minimapGeom();
    const z = g.zone;
    // Fondo del mapa actual, con los mismos colores que el fondo principal
    const bg = ctx.createLinearGradient(0, my, 0, my + mh);
    bg.addColorStop(0, z.bgTop);
    bg.addColorStop(1, z.bgBottom);
    ctx.fillStyle = bg;
    ctx.fillRect(mx, my, mw, mh);
    // El planeta se dibuja a escala, sin parallax, recortado al recuadro del minimapa
    if (z.planet) {
      const pl = z.planet;
      ctx.save();
      ctx.beginPath();
      ctx.rect(mx, my, mw, mh);
      ctx.clip();
      drawPlanet({ r: pl.r * s, alpha: pl.alpha }, ox + pl.x * s, oy + pl.y * s);
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(120,160,255,0.5)';
    ctx.strokeRect(mx + 0.5, my + 0.5, mw - 1, mh - 1);
    ctx.strokeRect(ox, oy, z.w * s, z.h * s);
    // Todos los NPC se ven como un punto rojo, sin importar su tipo
    ctx.fillStyle = '#ff3b3b';
    for (const a of g.aliens) {
      ctx.beginPath();
      ctx.arc(ox + a.x * s, oy + a.y * s, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const b of g.allies) {
      if (b.zi !== g.zi || b.dead) continue;
      ctx.fillStyle = b.enemy ? '#ff5c5c' : '#4da6ff';
      ctx.beginPath();
      ctx.arc(ox + b.x * s, oy + b.y * s, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const portal of portalsOf(g.zi)) {
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(ox + portal.x * s - 2, oy + portal.y * s - 2, 4, 4);
    }
    const base = z.base;
    ctx.strokeStyle = 'rgba(140,255,170,0.8)';
    ctx.beginPath();
    ctx.arc(ox + base.x * s, oy + base.y * s, Math.max(2, base.r * s), 0, Math.PI * 2);
    ctx.stroke();

    // Líneas finas que marcan la posición del jugador; su cruce es la nave
    const px = ox + g.p.x * s, py = oy + g.p.y * s;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.moveTo(px + 0.5, my); ctx.lineTo(px + 0.5, my + mh);
    ctx.moveTo(mx, py + 0.5); ctx.lineTo(mx + mw, py + 0.5);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px - 2, py - 2, 4, 4);

    // Destino marcado desde el minimapa; desaparece al llegar o al dar otro destino.
    // La línea va de la nave al destino, así que se acorta según se avanza
    if (g.mmDest && g.p.tx === g.mmDest.x && g.p.ty === g.mmDest.y) {
      const dx = ox + g.p.tx * s, dy = oy + g.p.ty * s;
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(77,166,255,0.6)';
      ctx.beginPath();
      ctx.moveTo(px, py); ctx.lineTo(dx, dy);
      ctx.stroke();
      ctx.fillStyle = '#4da6ff';
      ctx.beginPath();
      ctx.arc(dx, dy, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Mapa actual a la izquierda y coordenadas de la nave a la derecha, en unidades
    ctx.fillStyle = '#cfe8ff';
    ctx.font = '12px Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(z.id, mx, my - 8);
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.floor(g.p.x / MINI_UNIT)} / ${Math.floor(g.p.y / MINI_UNIT)}`, mx + mw, my - 8);
  }

  function drawBackground() {
    const z = g.zone;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, z.bgTop);
    grad.addColorStop(1, z.bgBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    if (z.planet) drawPlanet(z.planet);
  }

  // Por defecto, el planeta de la vista principal: se mueve más despacio que la nave (parallax)
  function drawPlanet(pl, cx = W / 2 + (pl.x - g.p.x) * 0.25, cy = H / 2 + (pl.y - g.p.y) * 0.25) {
    ctx.save();
    ctx.globalAlpha = pl.alpha;

    // Atmósfera
    const halo = ctx.createRadialGradient(cx, cy, pl.r * 0.95, cx, cy, pl.r * 1.25);
    halo.addColorStop(0, 'rgba(160,255,150,0.45)');
    halo.addColorStop(1, 'rgba(160,255,150,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, pl.r * 1.25, 0, Math.PI * 2);
    ctx.fill();

    // Disco del planeta
    const body = ctx.createRadialGradient(cx - pl.r * 0.35, cy - pl.r * 0.35, pl.r * 0.1, cx, cy, pl.r);
    body.addColorStop(0, '#f2ffc8');
    body.addColorStop(0.5, '#b8d86a');
    body.addColorStop(1, '#4d7a32');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(cx, cy, pl.r, 0, Math.PI * 2);
    ctx.fill();

    // Bandas de nubes, recortadas al disco
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, pl.r, 0, Math.PI * 2);
    ctx.clip();
    for (let i = -3; i <= 3; i++) {
      ctx.fillStyle = i % 2 ? 'rgba(230,255,180,0.14)' : 'rgba(40,90,40,0.12)';
      ctx.fillRect(cx - pl.r, cy + i * pl.r * 0.22, pl.r * 2, pl.r * 0.14);
    }
    ctx.restore();

    ctx.restore();
  }

  function draw() {
    // Las coordenadas de dibujo siguen siendo píxeles CSS; la transformación las escala a la resolución real
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    drawStars();
    drawWorldBackground();
    drawStation();
    drawPickups();
    drawAliens();
    drawPems();
    drawAllies();
    drawProjectiles();
    drawParticles();
    drawTexts();
    drawMoveMarker();
    drawPlayer();

    if (g.p.dead) drawCenter(`Reapareciendo en ${Math.ceil(g.p.respawnT)}...`, '#ff6b6b', 22, 1, H * 0.3);
    if (g.hitFlash > 0) {
      ctx.fillStyle = `rgba(255,40,40,${g.hitFlash * 2})`;
      ctx.fillRect(0, 0, W, H);
    }

    drawHUD();
    drawMissionPanel();
    drawStationWindow();
    drawPlayerWindow();
    drawNaveWindow();
    drawHangarIcon(hangarIconGeom());
    drawActionBar();
    drawSafeMsg();
    drawMinimap();
    if (g.banner > 0) drawCenter(g.bannerText, '#9fe3ff', 26, 1, H * 0.25);
    // Recompensas de la última baja: entran con un deslizamiento suave y se ocultan poco a poco en el último segundo
    if (g.rewardT > 0) {
      const inT = Math.min(1, (3 - g.rewardT) / 0.3);
      const alpha = inT * Math.min(1, g.rewardT / 0.6);
      const slide = (1 - inT) * -10;
      g.rewardLines.forEach((line, i) => drawCenter(line, '#ffffff', 18, alpha, 18 + slide + i * 22));
    }
    if (g.paused) {
      drawCenter('PAUSA', '#ffffff', 36, 1, H / 2);
      drawCenter('P / Esc para continuar', '#9fb3c8', 16, 0.9, H / 2 + 40);
    }
    if (g.hangar.open) drawHangar();
    drawCursor();
  }

  // ---------- Entrada ----------
  const mouse = { x: 0, y: 0, holding: false, downAt: 0 };
  canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('mousedown', e => {
    if (g.hangar.open) { hangarClick(e.clientX, e.clientY); return; }
    // Icono del hangar: abre el hangar solo dentro de la base
    if (inBox(hangarIconGeom(), e.clientX, e.clientY)) {
      if (inBase()) g.hangar.open = true;
      return;
    }
    // Ventana de misiones: el cuadrado la abre; el botón X la minimiza. Un clic dentro no mueve la nave
    const mp = missionPanelGeom();
    if (e.clientX >= mp.x && e.clientX <= mp.x + mp.w && e.clientY >= mp.y && e.clientY <= mp.y + mp.h) {
      const inRect = r => e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h;
      if (!g.missionOpen) { g.missionOpen = true; g.missionTab = 'summary'; }
      else if (inRect(mp.close)) g.missionOpen = false;
      else if (inRect(mp.tabs.description)) g.missionTab = 'description';
      else if (inRect(mp.tabs.summary)) g.missionTab = 'summary';
      else if (inRect(mp.tabs.rewards)) g.missionTab = 'rewards';
      else {
        // Slot de misión: selecciona esa misión y vuelve a la pestaña Resumen
        const s = mp.slots.findIndex(inRect);
        if (s >= 0 && s < g.missions.length) { g.missionSel = s; g.missionTab = 'summary'; }
        // Barra superior: arrastra la ventana
        else if (e.clientY < mp.y + 30) g.drag = { key: 'missionPos', dx: e.clientX - mp.x, dy: e.clientY - mp.y };
      }
      return;
    }
    // Ventana de usuario: el icono la abre; la X la cierra; la barra superior la arrastra
    const pw = playerGeom();
    if (inBox(pw, e.clientX, e.clientY)) {
      if (!g.playerOpen) g.playerOpen = true;
      else if (inBox(pw.close, e.clientX, e.clientY)) g.playerOpen = false;
      else if (e.clientY < pw.y + 30) g.drag = { key: 'playerPos', dx: e.clientX - pw.x, dy: e.clientY - pw.y };
      return;
    }
    // Ventana de nave: el icono la abre; la X la cierra; la barra superior la arrastra
    const nw = naveGeom();
    if (inBox(nw, e.clientX, e.clientY)) {
      if (!g.naveOpen) g.naveOpen = true;
      else if (inBox(nw.close, e.clientX, e.clientY)) g.naveOpen = false;
      else if (e.clientY < nw.y + 30) g.drag = { key: 'navePos', dx: e.clientX - nw.x, dy: e.clientY - nw.y };
      return;
    }
    // Ventana de venta: la X la cierra y cada "Vender" vende esa materia; un clic dentro no mueve la nave
    if (g.stationOpen) {
      const sb = stationGeom();
      if (inBox(sb.close, e.clientX, e.clientY)) { g.stationOpen = false; return; }
      const row = sb.rows.find(r => inBox(r.btn, e.clientX, e.clientY));
      if (row) sellMaterial(row.m);
      if (inBox(sb, e.clientX, e.clientY)) return;
    }
    if (g.paused || g.p.dead) return;
    // Icono de teletransporte sobre la puerta: solo funciona al alcance
    const near = portalInRange();
    if (near && inBox(portalIconBox(near), e.clientX, e.clientY)) { teleport(near); return; }
    const slot = barSlotAt(e.clientX, e.clientY);
    if (slot >= 0) { useSlot(slot); return; }

    // Clic en el minimapa: la nave viaja al punto marcado. Cualquier otro clic lo cancela.
    const mm = minimapGeom();
    if (e.clientX >= mm.mx && e.clientX <= mm.mx + mm.mw && e.clientY >= mm.my && e.clientY <= mm.my + mm.mh) {
      g.p.tx = clamp((e.clientX - mm.ox) / mm.s, 0, g.zone.w);
      g.p.ty = clamp((e.clientY - mm.oy) / mm.s, 0, g.zone.h);
      g.mmDest = { x: g.p.tx, y: g.p.ty };
      return;
    }
    const wx = e.clientX - W / 2 + g.p.x;
    const wy = e.clientY - H / 2 + g.p.y;
    // Clic sobre la estación de venta: si la nave está cerca, abre la venta; si no, la nave se acerca
    const st = g.zone.station;
    if (e.button === 0 && st && dist(wx, wy, st.x, st.y) < STATION_CLICK) {
      if (stationNear()) g.stationOpen = true;
      else { g.p.tx = st.x; g.p.ty = st.y; }
      return;
    }
    // Clic sobre una caja de carga: la nave viaja hasta ella y la recoge al llegar
    const box = e.button === 0 ? g.pickups.find(k => k.type === 'cargo' && dist(k.x, k.y, wx, wy) < 18) : null;
    if (box) { box.want = true; g.p.tx = box.x; g.p.ty = box.y; return; }
    const a = e.button === 0 ? nearestFoe(wx, wy, 40) : null;
    if (a) {
      if (e.detail >= 2) startAttack(a);        // doble clic: inicia el ataque
      else if (a !== g.p.target) { g.p.target = a; g.p.attacking = false; }  // clic simple: cambia el objetivo fijado
      return;
    }
    g.p.tx = wx;
    g.p.ty = wy;
    mouse.holding = true;
    mouse.downAt = performance.now();
  });

  // Arrastre de la ventana de misiones: sigue al cursor hasta soltar el botón
  addEventListener('mousemove', e => {
    if (g.drag) g[g.drag.key] = { x: e.clientX - g.drag.dx, y: e.clientY - g.drag.dy };
  });

  addEventListener('mouseup', () => {
    g.drag = null;
    if (!mouse.holding) return;
    mouse.holding = false;
    // Un clic corto es un destino; si se mantuvo pulsado, la nave se detiene al soltar
    if (performance.now() - mouse.downAt > 200) g.p.tx = null;
  });

  function startAttack(a) {
    if (!hasLaser()) { showBanner('Sin láseres equipados'); return; }
    const p = g.p;
    p.target = a;
    p.attacking = true;
  }

  function useSlot(i) {
    const item = BAR[i];
    if (!item) return;
    if (item.ammo) g.p.ammo = item.ammo;
    if (item.missile) g.p.missile = item.missile;
    if (item.attack && g.p.target && g.p.target.hp > 0 && !g.p.dead) startAttack(g.p.target);
  }

  function barX0() { return W / 2 - (10 * SLOT + 9 * GAP) / 2; }
  function barY0() { return H - SLOT - 24; }

  function barSlotAt(x, y) {
    const i = Math.floor((x - barX0()) / (SLOT + GAP));
    if (i < 0 || i > 9) return -1;
    const rel = x - barX0() - i * (SLOT + GAP);
    return rel <= SLOT && y >= barY0() && y <= barY0() + SLOT ? i : -1;
  }

  function toggleAttack() {
    if (g.p.attacking) g.p.attacking = false;
    else if (g.p.target && g.p.target.hp > 0 && !g.p.dead) startAttack(g.p.target);
  }

  addEventListener('keydown', e => {
    if (g.hangar.open) {
      if (e.code === 'Escape') g.hangar.open = false;
      return;
    }
    if (e.code === 'ControlLeft' || e.code === 'ControlRight') {
      e.preventDefault();
      if (!e.repeat && !g.paused) toggleAttack();
      return;
    }
    if (e.code === 'KeyP' || e.code === 'Escape') { g.paused = !g.paused; return; }
    if (g.paused) return;
    if (e.code === 'KeyJ') teleport(portalInRange());
    const slot = BAR_KEYS.indexOf(e.code);
    if (slot >= 0) useSlot(slot);
    if (e.code === 'Space') { e.preventDefault(); fireMissile(); }
    const u = UPGRADES.find(x => x.key === e.code);
    if (u) buyUpgrade(u);
  });

  // ---------- Guardado ----------
  // El progreso se guarda en el servidor local (server.js), nunca en el navegador
  const SAVE_EVERY = 5;   // segundos entre guardados automáticos
  let saveT = 0;
  let storageOk = true;   // false si la última escritura en el servidor ha fallado

  function saveGame() {
    const p = g.p;
    const data = {
      zi: g.zi, x: p.x, y: p.y, hp: p.hp, maxHp: p.maxHp, shield: p.shield,
      damage: p.damage, speed: p.speed, ammo: p.ammo,
      up: g.up, credits: g.credits, uridium: g.uridium, exp: g.exp, honor: g.honor,
      cargo: g.cargo, refine: g.refine, missions: g.missions, nextMission: g.nextMission, missionPos: g.missionPos,
      playerId: g.playerId, playerPos: g.playerPos, navePos: g.navePos, teleportBonus: g.teleportBonus, lootKeys: g.lootKeys,
      shipId: g.shipId, equip: g.equip, generators: g.generators,
      bots: g.allies.map(b => ({ name: b.name, zi: b.zi, x: b.x, y: b.y, exp: b.exp, honor: b.honor })),
      world: { ...g.world, [g.zone.id]: saveAliens(g.aliens) },
    };
    fetch('/api/save', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data), keepalive: true })
      .then(r => { storageOk = r.ok; }, () => { storageOk = false; });
  }

  // Lee el progreso del servidor. Si no responde, rechaza: el juego no debe arrancar sin él
  function readSave() {
    return fetch('/api/save').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  // Devuelve false si no hay progreso guardado válido; entonces se empieza de cero
  function loadGame(d) {
    if (!d || !ZONES[d.zi] || !SHIPS[d.shipId]) return false;
    g = newState();
    g.zi = d.zi; g.zone = ZONES[d.zi];
    g.world = d.world || {};
    g.aliens = restoreAliens(g.world[g.zone.id]);
    g.shipId = d.shipId; g.equip = d.equip; g.generators = d.generators;
    g.up = d.up; g.credits = d.credits; g.uridium = d.uridium; g.exp = d.exp; g.honor = d.honor;
    g.cargo = { ...g.cargo, ...d.cargo };
    g.refine = { ...g.refine, ...d.refine };
    if (Array.isArray(d.missions)) { g.missions = d.missions; g.nextMission = d.nextMission; }
    if (d.missionPos) g.missionPos = d.missionPos;
    if (d.playerId) g.playerId = d.playerId;
    if (d.playerPos) g.playerPos = d.playerPos;
    if (d.navePos) g.navePos = d.navePos;
    g.teleportBonus = d.teleportBonus || 0;
    g.lootKeys = d.lootKeys || 0;
    const p = g.p;
    p.x = d.x; p.y = d.y; p.maxHp = d.maxHp; p.hp = d.hp > 0 ? d.hp : d.maxHp;
    p.damage = d.damage; p.speed = d.speed;
    if (AMMO[d.ammo]) p.ammo = d.ammo;
    // Escudo: la capacidad sale de los generadores equipados; la reserva se limita a ella
    const st = shieldStats();
    p.maxShield = st.max; p.absorb = st.absorb; p.shield = Math.min(d.shield, st.max);
    // Progreso de los bots, emparejado por nombre; los que no estén en el guardado empiezan de cero
    for (const s of Array.isArray(d.bots) ? d.bots : []) {
      const b = g.allies.find(x => x.name === s.name);
      if (!b || !ZONES[s.zi]) continue;
      b.zi = s.zi; b.x = b.tx = s.x; b.y = b.ty = s.y; b.exp = s.exp; b.honor = s.honor;
    }
    return true;
  }

  // ---------- Bucle principal ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!g.paused && !g.hangar.open) {
      update(dt);
      checkTravel();
      if (!stationNear()) g.stationOpen = false;   // al alejarse, la venta se cierra
    }
    draw();
    saveT += dt;
    if (saveT >= SAVE_EVERY) { saveT = 0; saveGame(); }
    requestAnimationFrame(frame);
  }

  // El bucle no arranca hasta tener el progreso cargado
  readSave().then(d => {
    if (!loadGame(d)) reset();
    addEventListener('pagehide', saveGame);
    requestAnimationFrame(frame);
  }, showServerMissing);
})();
</script>
</body>
</html>
