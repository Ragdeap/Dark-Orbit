<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Orbit Local</title>
<style>
  html, body { margin: 0; height: 100%; background: #03040a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  // Sin servidor local no se juega: todo el progreso se guarda en data/save.json
  const GAME_URL = 'http://localhost:3000/';
  function showServerMissing() {
    document.body.innerHTML = '<p style="margin:0;padding:24px;min-height:100vh;box-sizing:border-box;background:#0b1020;color:#d7e6ff;font:16px Consolas,monospace">'
      + 'Dark Orbit necesita el servidor local para guardar la partida. Arráncalo con Jugar.bat (o con "node server.js") y vuelve a abrir el juego.</p>';
  }
  if (location.protocol === 'file:') {
    // Con "no-cors" sólo se comprueba que el servidor responde, sin leer su contenido
    fetch(GAME_URL + 'api/save', { mode: 'no-cors', cache: 'no-store' })
      .then(() => location.replace(GAME_URL), showServerMissing);
    return;
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  // El canvas se dibuja con la resolución real de la pantalla (escalado de Windows) para que no salga borroso
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  addEventListener('resize', resize);
  resize();

  // ---------- Utilidades ----------
  const rnd = (a, b) => a + Math.random() * (b - a);
  const mod = (a, b) => ((a % b) + b) % b;
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Datos ----------
  // Dos capas de coordenadas. El mundo (motor) mide 25 200 x 15 600 unidades y 1 unidad = 1 px
  // en la vista principal. El minimapa muestra el mundo a escala 120:1 (210 x 130), como el mapa original.
  // Calibrado con una nave de 533 de velocidad: de la esquina 0, 0 a la 210, 130 tarda unos 56 s.
  // Todos los mapas usan este tamaño salvo que se indique otro en su entrada de ZONES. Los límites son duros.
  const MINI_UNIT = 120;
  const MAP_W = 25200, MAP_H = 15600;

  // Facciones: MMO (Marte, mapas 1-X), EIC (Tierra, 2-X) y VRU (Venus, 3-X).
  // Los mapas 1-X y 2-X se añadirán más adelante. El planeta se atenúa (alpha)
  // a medida que el mapa se aleja de la base de su facción.
  const ZONES = [
    {
      id: '3-1', name: '3-1 · VRU', faction: 'VRU', w: MAP_W, h: MAP_H,

      station: { x: 23472, y: 13816 },

      gates: { next: { x: 1800, y: 1733 } },

      id: '3-2', name: '3-2 · VRU', faction: 'VRU', w: MAP_W, h: MAP_H,

      station: { x: 1572, y: MAP_H / 2 - 90 },

      gates: { prev: { x: 1800, y: 1733 } },

  // Niveles del jugador (32). PE necesaria para el nivel N = 10000 * 2^(N - 2); el nivel 1 empieza en 0 PE.
  // unlock: lo que se desbloquea al alcanzar el nivel (los modificadores de la derecha aún no se implementan)

  const LEVEL_UNLOCKS = {
    1: 'Acceso a mapas base X-1 y X-2',
    2: 'Mapas X-3 y X-4',
    3: 'Salto directo entre X-3 y X-4',
    5: 'Acceso a mapas X-3 y X-4 enemigos',
    7: 'Restricción del 50 % de carga en base X-1',
    8: 'Mapas PvP (4-1, 4-2, 4-3)',
    9: 'Mapa PvP (4-4)',
    10: 'Mapa X-5',
    11: 'Mapas X-6 y X-7',

  // Nivel que corresponde a una cantidad de PE
  const levelFor = exp => {
    let n = 1;
    while (n < MAX_LEVEL && exp >= levelExp(n + 1)) n++;
    return n;
  };

    // Hostil como el Lordakia. Alcance, detección, cadencia, radio y disparos son provisionales

    mordon:   { name: 'Mordon',   sides: 8, r: 26, hp: 20000, shield: 10000, speed: 125, dmg: 390, range: 420, aggro: 520, cool: 2.2, shots: 3, rewards: { exp: 3200, honor: 16, credits: 6400, uridium: 8, cargo: { prometium: 80, terbium: 80, endurium: 80, prometid: 8, duranium: 8, promerium: 1 } }, maps: ['1-3', '2-3', '3-3', '1-4', '2-4', '3-4'], color: '#ff9f1c', slow: { chance: 0.2, time: 5, factor: 0.5, speed: 200 } },
    saimon:   { name: 'Saimon',   sides: 6, r: 30, hp: 6000, shield: 6000, speed: 320, dmg: 200, range: 480, aggro: 600, cool: 1.8, shots: 2, rewards: { exp: 1600, honor: 8, credits: 1600, uridium: 4, cargo: { prometium: 40, terbium: 40, endurium: 40, prometid: 2, duranium: 2 } }, maps: ['1-3', '2-3', '3-3', '1-4', '2-4', '3-4'], color: '#2ec4b6', flee: 0.2, pem: { hp: 0.2, chance: 0.3 } },

    // Valores provisionales (forma, radio, alcance, detección, cadencia y disparos aún no confirmados). Sin huida, PEM ni misil ralentizador
    sibelon: { name: 'Sibelon', sides: 6, r: 40, hp: 200000, shield: 200000, speed: 100, dmg: 2650, range: 420, aggro: 520, cool: 2.2, shots: 3, rewards: { exp: 12800, honor: 64, credits: 102400, uridium: 32, cargo: { prometium: 200, terbium: 200, endurium: 200, prometid: 32, duranium: 32, promerium: 4 } }, maps: ['1-4', '2-4', '3-4'], color: '#7d5fff' },
    // Valores provisionales (forma, radio, alcance, detección, cadencia y disparos aún no confirmados). Sin huida, PEM ni misil ralentizador
    bossSibelon: { name: 'Boss Sibelon', sides: 6, r: 52, hp: 800000, shield: 800000, speed: 175, dmg: 12350, range: 420, aggro: 520, cool: 2.2, shots: 3, rewards: { exp: 51000, honor: 1256, credits: 409600, uridium: 128, cargo: { prometium: 800, terbium: 800, endurium: 800, prometid: 128, duranium: 128, promerium: 16, xenomita: 32 } }, maps: ['1-4', '2-4', '3-4'], color: '#5b3fd9' },
  };

  // Bots (jugadores simulados) de VRU, aliados: no atacan ni son atacados. Solo están en 3-1 y 3-2. Los enemigos van aparte.
  // Empiezan de cero, igual que el jugador. Su exp y honor se guardan en data/save.json y el nivel se calcula con levelFor.
  const BOT_SIGHT = 900;          // distancia a la que el bot detecta un NPC
  const BOT_RANGE = 350;          // alcance de disparo del bot
  const BOT_COOL = 0.8;           // segundos entre disparos
  const BOT_LASER = 'LF1';        // láser equipado por los bots; de momento cualquiera, el de la Fénix por defecto
  const BOT_BULLET_SPEED = 900;
  const BOT_RESPAWN = 3;          // segundos hasta reaparecer en la base, igual que la nave
  const DEATH_HONOR_LOSS = 0.04;  // fracción del honor que se pierde al morir (bots y jugador)
  const BOT_RADIUS = 16;
  // Nave de los bots: deben ser naves reales del juego. De momento solo la Fénix (la de administrador no es legal)
  const BOT_SHIP = 'PHOENIX';

  const BOTS = [
    { name: 'Blade', zone: '3-1', x: 21600, y: 11556, company: 'VRU' },
    { name: 'Joker', zone: '3-1', x: 18000, y: 9244, company: 'VRU' },
    { name: 'Phantom', zone: '3-1', x: 20400, y: 12711, company: 'VRU' },
    { name: 'Black', zone: '3-2', x: 4800, y: 6933, company: 'VRU' },
    { name: 'Kaelith', zone: '3-2', x: 7200, y: 10400, company: 'VRU' },
    { name: 'Slider', zone: '3-1', x: 7200, y: 4622, company: 'MMO', enemy: true },
    { name: 'Poncho', zone: '3-1', x: 8400, y: 6356, company: 'MMO', enemy: true },
    { name: 'Chroma', zone: '3-1', x: 6000, y: 7511, company: 'EIC', enemy: true },

  // Base de datos de naves. Para añadir una nave basta con añadir una entrada aquí;
  // sus ranuras de láser se crean automáticamente.
  const SHIPS = {
    PHOENIX: { name: 'Phoenix', hp: 104000, speed: 320, slots: 1, genSlots: 1, cargo: 100 },
    // Nave de pruebas del entorno de desarrollo, no es una nave oficial
    ADMINISTRADOR: { name: 'Administrador', hp: 500000, speed: 800, slots: 20, genSlots: 20, cargo: 5000 },
  };
  // Base de datos de láseres. Son distintos de la munición.
  const LASERS = {
    LF1: { name: 'LF-1', damage: 65 },
    LF2: { name: 'LF-2', damage: 140 },
    LF3: { name: 'LF-3', damage: 175 },
    LF4: { name: 'LF-4', damage: 200 },
    // Daño variable: en cada disparo tira un valor entre min y damage (el máximo)

    // Cada láser de este tipo equipado sube la vida máxima un 0,5 %
    LF4H: { name: 'LF-4 Hyperplasmoid', damage: 225, hpBonus: 0.005 },
    // Cada láser de este tipo suma 5 de daño extra contra jugadores (no contra NPC)

    // Cada láser de este tipo suma 5 de daño extra contra NPC (no contra jugadores)

  };

  // Base de datos de generadores de escudo. Absorben un porcentaje de cada golpe
  // mientras les quede reserva de escudo.
  const GENERATORS = {
    SG3N_A01: { name: 'SG3N-A01', shield: 1000, absorb: 0.4 },
    SG3N_A02: { name: 'SG3N-A02', shield: 2000, absorb: 0.5 },
    SG3N_A03: { name: 'SG3N-A03', shield: 5000, absorb: 0.6 },

    SG3N_B01: { name: 'SG3N-B01', shield: 9500, absorb: 0.7 },

  // Munición: el daño es el daño base del láser multiplicado por mult
  const AMMO = {
    LCB10:  { name: 'LCB-10',  mult: 1, cool: 0.25, speed: 900, life: 1.0, shots: 1, spread: 0, color: '#ff4d4d' },
    MCB25:  { name: 'MCB-25',  mult: 2, cool: 0.25, speed: 900, life: 1.0, shots: 1, spread: 0, color: '#4da6ff' },

  };
  // Misiles: se seleccionan con su casilla y se disparan con Espacio. Daño fijo, sin dispersión.
  // Velocidad, tiempo de vida y color son provisionales.
  const MISSILES = {
    R310:    { name: 'R310',     dmg: 1000, cool: 1, speed: 700, life: 2.5, color: '#9be7ff' },
    PLT2026: { name: 'PLT-2026', dmg: 2000, cool: 1, speed: 700, life: 2.5, color: '#7dd3fc' },

  // Barra de acción: 10 casillas. Las 5 primeras son láseres (munición); las 4 siguientes son misiles.
  // attack: la casilla inicia el ataque si hay un NPC fijado (en el futuro habrá casillas sin ataque)

    { ammo: 'LCB10', attack: true }, { ammo: 'MCB25', attack: true }, { ammo: 'MCB50', attack: true },
    { ammo: 'UCB100', attack: true }, { ammo: 'RSB75', attack: true },
    { missile: 'R310' }, { missile: 'PLT2026' }, { missile: 'PLT2021' }, { missile: 'PLT3030' }, null,
  ];
  const BAR_KEYS = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0'];
  const SLOT = 60, GAP = 8;

  const RANGE = 480;

    { key: 'F2', label: 'Casco',     lvl: 'hp', apply: p => { p.maxHp += 25; p.hp += 25; } },

  // Misiones en orden: cada una pide matar cierta cantidad de un tipo de NPC.
  // rewards: solo las que da la misión; las que no existen no se muestran
  // Materias primas en el orden de la base de datos; price: precio de venta por unidad (créditos)

  // title: nombre destacado; description: historia de la misión (textos provisionales)

    { title: 'Cazador de Streuner', description: 'Los Streuner de esta zona llevan días atacando a los convoyes que cruzan el sector. Elimina a ocho de ellos para asegurar la ruta hacia la base.', text: 'Elimina 8 Streuner', type: 'streuner', count: 8, rewards: { credits: 200 } },

  // ---------- Estado ----------
  let g;
  function newState() {
    return {
      p: {
        x: 0, y: 0, vx: 0, vy: 0, angle: 0, speed: SHIPS.PHOENIX.speed,
        hp: SHIPS.PHOENIX.hp, maxHp: SHIPS.PHOENIX.hp,
        shield: 0, maxShield: 0, absorb: 0,
        damage: 0, cool: 0, ammo: 'LCB10', missile: null, missCool: 0,  // damage: bonus de las mejoras, se suma al de los láseres
        target: null, tx: null, ty: null, dead: false, respawnT: 0,
        attacking: false, rank: null, company: 'VRU', slowT: 0, slowF: 1,
      },
      up: { dmg: 0, hp: 0, spd: 0 },
      zi: 0, zone: ZONES[0],
      aliens: [], world: {}, bullets: [], enemyShots: [], pickups: [], parts: [], texts: [], pems: [],
      stars: Array.from({ length: 260 }, () => ({ x: Math.random(), y: Math.random(), z: rnd(0.2, 1) })),
      credits: 0, uridium: 0, exp: 0, honor: 0, cargo: Object.fromEntries(MATERIALS.map(m => [m.key, 0])),
      refine: Object.fromEntries(REFINE_MATERIALS.map(m => [m.key, 0])),
      missions: [{ id: 0, progress: 0 }, { id: 1, progress: 0 }], nextMission: 2, missionSel: 0,
      banner: 0, bannerText: '', rewardT: 0, rewardLines: [], hitFlash: 0, paused: false,
      missionOpen: false, missionTab: 'summary', stationOpen: false,
      naveOpen: false, navePos: null,
      playerOpen: false, playerPos: null, playerId: String(Math.floor(10000000 + Math.random() * 90000000)),
      teleportBonus: 0, lootKeys: 0,
      safeT: 0, wasSafe: false,
      shipId: 'PHOENIX',
      equip: { PHOENIX: ['LF1'] },
      generators: {},
      hangar: { open: false, sel: { type: 'laser', i: 0 } },
      allies: BOTS.map((b, i) => ({
        id: i, name: b.name, zi: ZONES.findIndex(z => z.id === b.zone), exp: 0, honor: 0,
        x: b.x, y: b.y, angle: 0, tx: b.x, ty: b.y, portal: false, target: null, cool: 0, wait: 0, hopT: rnd(30, 90),
        hp: SHIPS[BOT_SHIP].hp, maxHp: SHIPS[BOT_SHIP].hp, speed: SHIPS[BOT_SHIP].speed, dead: false, respawnT: 0,
        // isPlayer: los bonus de láser contra jugadores (LF-4 Magmadrill) también les afectan
        isBot: true, isPlayer: true, enemy: !!b.enemy, hostile: !!b.enemy, rank: null, company: b.company,
      })),
    };
  }

  function reset() {
    g = newState();
    setZone(0);
  }

  // NPC de un mapa para guardar (sólo lo que hace falta para volver a encontrarlos) y para restaurarlos
  function saveAliens(list) {
    return list.map(a => ({ type: a.type, x: a.x, y: a.y, home: a.home, hp: a.hp, shield: a.shield, pemDone: a.pemDone }));
  }
  function restoreAliens(list) {
    return (list || []).filter(a => ALIEN[a.type]).map(a => ({
      ...a, vx: 0, vy: 0, aggro: false, cool: rnd(0.5, 1.5), wa: 0, wt: 0, hit: 0,
    }));
  }

  // Cambia de mapa. Sin "spawn" la nave aparece en la base; si se cruza una puerta, junto a su enlace
  function setZone(i, spawn) {
    if (g.zone) g.world[g.zone.id] = saveAliens(g.aliens);
    g.zi = i;
    g.zone = ZONES[i];
    g.aliens = restoreAliens(g.world[g.zone.id]); g.bullets = []; g.enemyShots = []; g.pickups = []; g.parts = []; g.pems = [];
    const p = g.p;
    const at = spawn || g.zone.base;
    p.x = at.x; p.y = at.y;
    p.tx = null; p.ty = null; p.target = null; p.attacking = false;
    showBanner(g.zone.name);
  }

  // Zona segura: la base y la zona alrededor del portal (su radio es mayor que el de cambio de mapa)
  function inSafeZone() {
    const p = g.p, z = g.zone;
    if (dist(p.x, p.y, z.base.x, z.base.y) < z.base.r) return true;
    return !!portalInRange();
  }

  function showBanner(text) {
    g.banner = 2.5;
    g.bannerText = text;
  }

  // Puertas de la zona actual (gates.next lleva a la zona siguiente, gates.prev a la anterior).
  // La nave aparece a 120 px de la puerta de enlace del destino, dentro de su zona segura.
  function portalsOf(zi) {
    const z = ZONES[zi], list = [];
    if (z.gates.next) {
      const to = ZONES[zi + 1];
      list.push({ ...z.gates.next, to: zi + 1, spawn: { x: to.gates.prev.x + 120, y: to.gates.prev.y } });
    }
    if (z.gates.prev) {
      const to = ZONES[zi - 1];
      list.push({ ...z.gates.prev, to: zi - 1, spawn: { x: to.gates.next.x + 120, y: to.gates.next.y } });
    }
    return list;
  }

  // Teletransporte: solo disponible a esta distancia de la puerta (la misma que la zona segura).
  // Se activa con el icono sobre la puerta o con la tecla J; no ocurre al pasar por encima.
  const PORTAL_RANGE = 200;

  function portalInRange() {
    const p = g.p;
    return portalsOf(g.zi).find(pt => dist(p.x, p.y, pt.x, pt.y) < PORTAL_RANGE) || null;
  }

  function teleport(pt) {
    if (pt) setZone(pt.to, pt.spawn);
  }

  // Icono de teletransporte sobre la puerta, en coordenadas de pantalla
  function portalIconBox(pt) {
    return { x: sx(pt.x) - 15, y: sy(pt.y) - 95, w: 30, h: 30 };
  }

  function drawPortalIcon(b) {
    const hover = inBox(b, mouse.x, mouse.y);
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    // Rayo: el mismo símbolo que los bonos de teletransporte
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    [[0.3, -1], [-0.6, 0.15], [0, 0.15], [-0.3, 1], [0.6, -0.2], [0, -0.2]].forEach(([x, y], i) => {
      if (i === 0) ctx.moveTo(cx + x * 9, cy + y * 9);
      else ctx.lineTo(cx + x * 9, cy + y * 9);
    });
    ctx.closePath();
    ctx.fill();
    if (hover) drawIconTooltip(b, 'Teletransporte (J)');
  }

  // ---------- Entidades ----------
  // Tipos de NPC que pueden aparecer en un mapa: los que lo listan en su campo `maps`
  function zoneTypes(z) {
    return Object.keys(ALIEN).filter(k => ALIEN[k].maps && ALIEN[k].maps.includes(z.id));
  }

  function spawnAlien(types) {
    const z = g.zone;
    const type = types[Math.floor(Math.random() * types.length)];
    let x, y, tries = 0;
    do {
      x = rnd(200, z.w - 200);
      y = rnd(200, z.h - 200);
      tries++;
    } while (dist(x, y, z.base.x, z.base.y) < SPAWN_SAFE && tries < 20);
    const t = ALIEN[type];
    g.aliens.push({
      type, x, y, home: { x, y }, vx: 0, vy: 0,
      hp: t.hp, shield: t.shield, aggro: false, cool: rnd(0.5, 1.5),
      wa: 0, wt: 0, hit: 0,
    });
  }

  function nearestAlien(x, y, r) {
    let best = null, bd = r;
    for (const a of g.aliens) {
      const d = dist(x, y, a.x, a.y);
      if (d < bd) { bd = d; best = a; }
    }
    return best;
  }

  function spark(x, y, color, n = 6) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), s = rnd(40, 200);
      g.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.2, 0.5), max: 0.5, color, size: rnd(1, 3) });
    }
  }

  function explode(x, y, r, color) {
    for (let i = 0; i < 26; i++) {
      const a = rnd(0, Math.PI * 2), s = rnd(60, 260);
      g.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.4, 0.9), max: 0.9, color, size: rnd(2, Math.max(3, r * 0.25)) });
    }
  }

  // Números de daño flotantes. onPlayer: x/y son relativos a la nave y no a la zona
  function spawnText(x, y, text, color, onPlayer = false) {
    g.texts.push({ x, y, text, color, onPlayer, life: 0.9, max: 0.9, vy: -40 });
  }

  function updateTexts(dt) {
    for (const t of g.texts) { t.life -= dt; t.y += t.vy * dt; }
    g.texts = g.texts.filter(t => t.life > 0);
  }

  // Solo las bajas del jugador dan recompensas, cargo y progreso de misiones; las de un bot solo hacen explotar al NPC
  function killAlien(a, by = g.p) {
    const t = ALIEN[a.type];
    explode(a.x, a.y, t.r, t.color);
    soundAt(a.x, a.y, playExplosionSound);
    if (g.p.target === a) { g.p.target = null; g.p.attacking = false; }
    if (by !== g.p) {
      // Los bots ganan lo mismo que el jugador por cada NPC destruido
      if (by.isBot) { by.exp += t.rewards.exp; by.honor += t.rewards.honor; }
      return;
    }
    const r = t.rewards;
    g.credits += r.credits;
    g.uridium += r.uridium;
    g.exp += r.exp;
    g.honor += r.honor;
    // Texto con las recompensas de esta baja (se omiten las que valen 0)
    g.rewardLines = [
      [r.credits, 'créditos'], [r.uridium, 'uridium'], [r.honor, 'puntos de honor'], [r.exp, 'puntos de experiencia'],
    ].filter(([n]) => n > 0).map(([n, what]) => `Has recibido ${n} ${what}`);
    g.rewardT = 3;
    if (r.cargo) g.pickups.push({ x: a.x, y: a.y, type: 'cargo', cargo: r.cargo, life: 60 });
    if (Math.random() < 0.10) g.pickups.push({ x: a.x, y: a.y, type: 'repair', life: 20 });
    checkMission(a.type);
  }

  // Cada baja cuenta para las misiones activas de ese tipo
  function checkMission(type) {
    for (const e of g.missions) {
      const m = MISSIONS[e.id];
      if (m.type === type && e.progress < m.count) e.progress++;
    }
    completeMissions();
  }

  // Las misiones de viaje avanzan al llegar al punto marcado
  function checkTravel() {
    for (const e of g.missions) {
      const m = MISSIONS[e.id];
      if (m.type === 'travel' && e.progress < m.count && dist(g.p.x, g.p.y, m.to.x, m.to.y) < m.radius) e.progress++;
    }
    completeMissions();
  }

  // Las misiones completadas entregan su recompensa y salen de la lista
  function completeMissions() {
    const done = g.missions.filter(e => e.progress >= MISSIONS[e.id].count);
    if (!done.length) return;
    for (const e of done) {
      const m = MISSIONS[e.id];
      for (const [k] of REWARD_LABELS) if (m.rewards[k]) g[k] += m.rewards[k];
    }
    g.missions = g.missions.filter(e => e.progress < MISSIONS[e.id].count);
    g.missionSel = Math.min(g.missionSel, Math.max(0, g.missions.length - 1));
    showBanner('Misión completada');
  }

  // Acepta la siguiente misión de la lista si queda hueco (máximo MAX_MISSIONS a la vez)
  function acceptMission() {
    if (!canAcceptMission()) return;
    g.missions.push({ id: g.nextMission, progress: 0 });
    g.nextMission++;
    g.missionSel = g.missions.length - 1;
  }

  function hitAlien(a, dmg, by = g.p) {
    // Con escudo, el 80 % del daño va al escudo y el 20 % a la vida; si el escudo no alcanza, el resto pasa a la vida.
    // Sin escudo, todo el daño va a la vida.
    const toShield = a.shield > 0 ? Math.min(a.shield, Math.floor(dmg * 0.8)) : 0;
    a.shield -= toShield;
    a.hp -= dmg - toShield;
    spawnText(a.x, a.y - ALIEN[a.type].r - 6, Math.round(dmg), '#ff4d4d');
    // El NPC ataca a quien le dispara, sea la nave o un bot
    a.aggro = true;
    a.victim = by;
    a.hit = 0.1;
    const t = ALIEN[a.type];
    if (t.flee && a.hp > 0 && a.hp <= t.hp * t.flee) a.fleeing = true;
    // PEM: una sola tirada al bajar al umbral. Si sale, quita el objetivo fijado por la nave
    if (t.pem && !a.pemDone && a.hp > 0 && a.hp <= t.hp * t.pem.hp) {
      a.pemDone = true;
      if (Math.random() < t.pem.chance) emitPem(a);
    }
    if (a.hp <= 0) { a.hp = 0; killAlien(a, by); }
  }

  // Pulso electromagnético: la nave pierde el objetivo y tiene que volver a seleccionar al NPC
  function emitPem(a) {
    if (g.p.target === a) { g.p.target = null; g.p.attacking = false; }
    g.pems.push({ x: a.x, y: a.y, life: 0.7, max: 0.7 });
    spawnText(a.x, a.y - ALIEN[a.type].r - 22, 'PEM', '#7fe7ff');
  }

  function updatePems(dt) {
    for (const q of g.pems) q.life -= dt;
    g.pems = g.pems.filter(q => q.life > 0);
  }

  function hurt(d) {
    const p = g.p;
    if (p.dead) return;
    g.hitFlash = 0.12;
    spawnText(0, -30, Math.round(d), '#b07cff', true);
    // El escudo absorbe su porcentaje del golpe mientras le quede reserva; el resto va a la vida
    const absorbed = Math.min(p.shield, Math.floor(d * p.absorb));
    p.shield -= absorbed;
    p.hp -= d - absorbed;
    if (p.hp <= 0) {
      p.hp = 0;
      p.dead = true;
      p.respawnT = 3;
      p.target = null; p.tx = null; p.attacking = false;
      g.honor -= Math.floor(g.honor * DEATH_HONOR_LOSS);
      explode(p.x, p.y, 22, '#7fd6ff');
    }
  }

  // Generadores de una nave. Mismo criterio que las ranuras de láser.
  function genOf(id = g.shipId) {
    if (!g.generators[id]) g.generators[id] = Array(SHIPS[id].genSlots).fill(null);
    return g.generators[id];
  }

  // Escudo total de los generadores equipados y su porcentaje de absorción (se toma el mayor)
  function shieldStats() {
    return genOf().reduce((s, id) => {
      if (!id) return s;
      s.max += GENERATORS[id].shield;
      s.absorb = Math.max(s.absorb, GENERATORS[id].absorb);
      return s;
    }, { max: 0, absorb: 0 });
  }

  // Tras cambiar generadores: la capacidad nueva se llena al equipar y la reserva se ajusta al máximo
  function refreshShield() {
    const p = g.p, st = shieldStats();
    const gained = Math.max(0, st.max - p.maxShield);
    p.maxShield = st.max;
    p.shield = Math.min(st.max, p.shield + gained);
    p.absorb = st.absorb;
  }

  // Ranuras de láser de una nave. Las naves nuevas empiezan con todas vacías.
  function equipOf(id = g.shipId) {
    if (!g.equip[id]) g.equip[id] = Array(SHIPS[id].slots).fill(null);
    return g.equip[id];
  }

  // Vida máxima con el bonus de los láseres equipados (p. ej. LF-4 Hyperplasmoid: +0,5 % cada uno)
  function maxHpNow() {
    const bonus = equipOf().reduce((sum, id) => sum + (id && LASERS[id].hpBonus ? LASERS[id].hpBonus : 0), 0);
    return Math.floor(g.p.maxHp * (1 + bonus));
  }

  // Hay al menos un láser equipado en la nave activa (las ranuras pueden quedar vacías)
  function hasLaser() {
    return equipOf().some(id => id);
  }

  // Daño base del disparo: suma de los láseres equipados en la nave activa
  // Cada láser puede tener bonus contra jugadores (playerBonus) o contra NPC (npcBonus)
  function laserDamage(target) {
    const vsPlayer = !!target.isPlayer;
    return equipOf().reduce((sum, id) => {
      if (!id) return sum;
      const l = LASERS[id];
      const base = l.min ? Math.floor(rnd(l.min, l.damage + 1)) : l.damage;
      const bonus = vsPlayer ? (l.playerBonus || 0) : (l.npcBonus || 0);
      return sum + base + bonus;
    }, 0);
  }

  // Sonido de disparo generado con Web Audio (no necesita archivos). Mismo sonido para todos los láseres.
  let audioCtx = null;
  // Los sonidos de combate de otras naves (bots y sus objetivos) solo se oyen si la nave está a SOUND_RANGE o menos
  const SOUND_RANGE = 900;
  function soundAt(x, y, play) {
    if (dist(x, y, g.p.x, g.p.y) <= SOUND_RANGE) play();
  }

  function playLaserSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1400, t);
      osc.frequency.exponentialRampToValueAtTime(300, t + 0.15);
      gain.gain.setValueAtTime(0.06, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.16);
    } catch (e) {
      // Sin audio disponible: el juego sigue funcionando
    }
  }

  // Lanzamiento de misil: silbido de ruido filtrado que sube de tono (igual para todos los misiles)
  function playMissileLaunchSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const ctx = audioCtx, t = ctx.currentTime;
      const len = Math.floor(ctx.sampleRate * 0.5);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 1.5;
      filter.frequency.setValueAtTime(300, t);
      filter.frequency.exponentialRampToValueAtTime(2200, t + 0.4);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(t);
      src.stop(t + 0.5);
    } catch (e) {
      // Sin audio disponible: el juego sigue funcionando
    }
  }

  // Impacto de misil: estallido corto de ruido que se cierra en graves, con un golpe grave debajo
  function playMissileImpactSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const ctx = audioCtx, t = ctx.currentTime;
      const len = Math.floor(ctx.sampleRate * 0.6);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1800, t);
      filter.frequency.exponentialRampToValueAtTime(150, t + 0.5);
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.5, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      src.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      src.start(t);
      src.stop(t + 0.6);

      const thump = ctx.createOscillator();
      const thumpGain = ctx.createGain();
      thump.type = 'sine';
      thump.frequency.setValueAtTime(90, t);
      thump.frequency.exponentialRampToValueAtTime(40, t + 0.4);
      thumpGain.gain.setValueAtTime(0.4, t);
      thumpGain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      thump.connect(thumpGain);
      thumpGain.connect(ctx.destination);
      thump.start(t);
      thump.stop(t + 0.4);
    } catch (e) {
      // Sin audio disponible: el juego sigue funcionando
    }
  }

  // Explosión de un NPC en el espacio: sin aire no hay soplido, así que se combina
  // un chasquido seco al inicio con un retumbo grave que se apaga despacio
  function playExplosionSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const ctx = audioCtx, t = ctx.currentTime;

      // 1. Chasquido: ruido corto y agudo
      const crackLen = Math.floor(ctx.sampleRate * 0.08);
      const crackBuf = ctx.createBuffer(1, crackLen, ctx.sampleRate);
      const crackData = crackBuf.getChannelData(0);
      for (let i = 0; i < crackLen; i++) crackData[i] = (Math.random() * 2 - 1) * (1 - i / crackLen);
      const crack = ctx.createBufferSource();
      crack.buffer = crackBuf;
      const crackGain = ctx.createGain();
      crackGain.gain.setValueAtTime(0.6, t);
      crack.connect(crackGain);
      crackGain.connect(ctx.destination);
      crack.start(t);

      // 2. Retumbo: tono grave que baja y se apaga
      const boom = ctx.createOscillator();
      const boomGain = ctx.createGain();
      boom.type = 'sine';
      boom.frequency.setValueAtTime(90, t);
      boom.frequency.exponentialRampToValueAtTime(35, t + 1.2);
      boomGain.gain.setValueAtTime(0.7, t);
      boomGain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
      boom.connect(boomGain);
      boomGain.connect(ctx.destination);
      boom.start(t);
      boom.stop(t + 1.25);

      // 3. Cola: ruido grave que se va apagando, como el casco al romperse
      const tailLen = Math.floor(ctx.sampleRate * 1.5);
      const tailBuf = ctx.createBuffer(1, tailLen, ctx.sampleRate);
      const tailData = tailBuf.getChannelData(0);
      for (let i = 0; i < tailLen; i++) tailData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / tailLen, 2);
      const tail = ctx.createBufferSource();
      tail.buffer = tailBuf;
      const tailFilter = ctx.createBiquadFilter();
      tailFilter.type = 'lowpass';
      tailFilter.frequency.setValueAtTime(600, t);
      tailFilter.frequency.exponentialRampToValueAtTime(80, t + 1.5);
      const tailGain = ctx.createGain();
      tailGain.gain.setValueAtTime(0.35, t);
      tail.connect(tailFilter);
      tailFilter.connect(tailGain);
      tailGain.connect(ctx.destination);
      tail.start(t);
    } catch (e) {
      // Sin audio disponible: el juego sigue funcionando
    }
  }

  function fire(target) {
    if (!hasLaser()) return;
    playLaserSound();
    const p = g.p, a = AMMO[p.ammo];
    const base = Math.atan2(target.y - p.y, target.x - p.x);
    p.cool = a.cool;
    for (let i = 0; i < a.shots; i++) {
      const ang = base + (i - (a.shots - 1) / 2) * a.spread;
      g.bullets.push({
        x: p.x + Math.cos(ang) * 18, y: p.y + Math.sin(ang) * 18,
        vx: Math.cos(ang) * a.speed, vy: Math.sin(ang) * a.speed,
        life: a.life, dmg: Math.floor(laserDamage(target) * rnd(0.9, 1) * a.mult), color: a.color,
        target,
      });
    }
  }

  // Dispara el misil seleccionado contra el NPC fijado (teledirigido). Igual que los láseres, necesita
  // objetivo fijado y que esté dentro del alcance (RANGE).
  function fireMissile() {
    const p = g.p;
    const t = p.target && p.target.hp > 0 ? p.target : null;
    if (!p.missile || p.dead || p.missCool > 0 || !t) return;
    if (dist(p.x, p.y, t.x, t.y) > RANGE) return;
    const m = MISSILES[p.missile];
    const ang = Math.atan2(t.y - p.y, t.x - p.x);
    p.missCool = m.cool;
    playMissileLaunchSound();
    g.bullets.push({
      x: p.x + Math.cos(ang) * 18, y: p.y + Math.sin(ang) * 18,
      vx: Math.cos(ang) * m.speed, vy: Math.sin(ang) * m.speed,
      life: m.life, dmg: m.dmg, color: m.color, missile: true,
      homing: true, turn: 5, target: t,
    });
  }

  function buyUpgrade(u) {
    const cost = upgradeCost(g.up[u.lvl]);
    if (g.credits < cost) { showBanner('Créditos insuficientes'); return; }
    g.credits -= cost;
    g.up[u.lvl]++;
    u.apply(g.p);
    showBanner(`${u.label} mejorado`);
  }

  // ---------- Actualización ----------
  function update(dt) {
    const p = g.p;
    // Si se desequipa un láser que daba vida, la vida actual no puede superar el nuevo máximo
    p.hp = Math.min(p.hp, maxHpNow());
    updateRanks();
    const types = zoneTypes(g.zone);
    while (g.aliens.length < ALIEN_CAP && types.length) spawnAlien(types);

    if (p.dead) {
      p.respawnT -= dt;
      if (p.respawnT <= 0) {
        p.dead = false;
        p.hp = maxHpNow();
        p.x = g.zone.base.x; p.y = g.zone.base.y; p.vx = 0; p.vy = 0;
      }
    } else {
      updatePlayer(dt);
    }

    updateAliens(dt);
    updateAllies(dt);
    updateBullets(dt);
    updateEnemyShots(dt);
    updatePickups(dt);
    updateParticles(dt);
    updatePems(dt);
    updateTexts(dt);

    // Aviso al entrar en una zona segura; se desvanece tras unos segundos
    const safe = inSafeZone();
    if (safe && !g.wasSafe) g.safeT = 3;
    g.wasSafe = safe;
    g.safeT = Math.max(0, g.safeT - dt);

    if (g.banner > 0) g.banner -= dt;
    if (g.rewardT > 0) g.rewardT -= dt;
    g.hitFlash = Math.max(0, g.hitFlash - dt);
  }

  function updatePlayer(dt) {
    const p = g.p, z = g.zone;
    if (p.target && (p.target.hp <= 0 || (p.target.isBot && !targetable(p.target)))) { p.target = null; p.attacking = false; }
    p.cool -= dt;
    p.missCool = Math.max(0, p.missCool - dt);
    p.slowT = Math.max(0, p.slowT - dt);

    // Con el botón pulsado, el destino sigue al cursor
    if (mouse.holding) { p.tx = mouse.x - W / 2 + p.x; p.ty = mouse.y - H / 2 + p.y; }

    // Movimiento libre hacia el punto de clic, también mientras se ataca
    // Con el efecto del misil ralentizador, la velocidad baja durante unos segundos
    const sp = p.slowT > 0 ? p.speed * p.slowF : p.speed;
    let wx = 0, wy = 0;
    if (p.tx !== null) {
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (d > 4) { wx = dx / d * sp; wy = dy / d * sp; }
      else { p.tx = null; p.ty = null; }
    }
    const k = 1 - Math.exp(-6 * dt);
    p.vx += (wx - p.vx) * k;
    p.vy += (wy - p.vy) * k;
    p.x = clamp(p.x + p.vx * dt, 0, z.w);
    p.y = clamp(p.y + p.vy * dt, 0, z.h);

    if (p.attacking) p.angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
    else if (Math.hypot(p.vx, p.vy) > 5) p.angle = Math.atan2(p.vy, p.vx);

    // Disparo automático mientras se ataca
    if (p.attacking && p.cool <= 0 && dist(p.x, p.y, p.target.x, p.target.y) <= RANGE) {
      fire(p.target);
    }

    // Portal a la siguiente zona
  }

  // Un objetivo es la nave o un bot. Solo se persigue o se dispara a objetivos vivos y en este mapa
  function targetable(v) {
    if (v === g.p) return !g.p.dead;
    return v.zi === g.zi && !v.dead;
  }

  // Objetivo más cercano dentro de r: la nave (si no está en base) o un bot vivo de este mapa
  function nearestVictim(x, y, r, atBase) {
    let best = null, bd = r;
    if (!atBase && targetable(g.p)) {
      const d = dist(x, y, g.p.x, g.p.y);
      if (d < bd) { bd = d; best = g.p; }
    }
    for (const b of g.allies) {
      if (!targetable(b)) continue;
      const d = dist(x, y, b.x, b.y);
      if (d < bd) { bd = d; best = b; }
    }
    return best;
  }

  // Objetivo que el ratón puede fijar: un NPC o un bot vivo de este mapa
  function nearestFoe(x, y, r) {
    let best = nearestAlien(x, y, r), bd = best ? dist(x, y, best.x, best.y) : r;
    for (const b of g.allies) {
      if (!targetable(b)) continue;
      const d = dist(x, y, b.x, b.y);
      if (d < bd) { bd = d; best = b; }
    }
    return best;
  }

  // NPC de la lista ESCORT_TYPES más cercano a `a` en 600 px, o null
  function escortOf(a) {
    let best = null, bd = 600;
    for (const e of g.aliens) {
      if (!ESCORT_TYPES.includes(e.type)) continue;
      const d = dist(a.x, a.y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  // Escolta que el Aider cura con su rayo: el más dañado dentro de su alcance, o null
  function healTarget(a) {
    let best = null, bf = 1;
    for (const e of g.aliens) {
      if (!ESCORT_TYPES.includes(e.type) || dist(a.x, a.y, e.x, e.y) > ALIEN.aider.range) continue;
      const f = e.hp / ALIEN[e.type].hp;
      if (f < bf) { bf = f; best = e; }
    }
    return best;
  }

  // Rayo verde del Aider hacia el escolta que está curando
  function drawAiderBeams() {
    for (const a of g.aliens) {
      if (!ALIEN[a.type].escort) continue;
      const link = healTarget(a);
      if (!link) continue;
      ctx.beginPath();
      ctx.moveTo(sx(a.x), sy(a.y));
      ctx.lineTo(sx(link.x), sy(link.y));
      ctx.strokeStyle = 'rgba(111,227,154,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // Velocidad de un NPC. El Aider iguala la de su escolta; sin escolta se queda quieto
  function speedOf(a) {
    const t = ALIEN[a.type];
    if (!t.escort) return t.speed;
    const e = escortOf(a);
    return e ? ALIEN[e.type].speed : 0;
  }

  function updateAliens(dt) {
    const p = g.p, z = g.zone;
    const atBase = dist(p.x, p.y, z.base.x, z.base.y) < z.base.r;
    for (const a of g.aliens) {
      const t = ALIEN[a.type];
      // Persiguen a su objetivo hasta que muere o, si es la nave, llega a la base (un portal cambia de mapa y limpia todo)
      if (a.victim && (!targetable(a.victim) || (a.victim === p && atBase))) a.victim = null;
      // Al terminar el combate, el misil ralentizador vuelve a poder tirarse en el siguiente
      if (!a.victim) { a.aggro = false; a.fleeing = false; a.slowRolled = false; }
      if (t.escort) {
        // El Aider se une al combate cuando un escolta lucha contra el jugador, y lo deja cuando termina
        const joining = g.aliens.some(e => ESCORT_TYPES.includes(e.type) && e.aggro && e.victim === p && dist(a.x, a.y, e.x, e.y) < 600);
        if (joining && !a.aggro) { a.aggro = true; a.victim = p; a.joined = true; }
        else if (!joining && a.joined) { a.aggro = false; a.victim = null; a.joined = false; }
        // Rayo de asistencia: cura al escolta más dañado de su alcance
        const link = healTarget(a);
        if (link) link.hp = Math.min(ALIEN[link.type].hp, link.hp + ALIEN[link.type].hp * AIDER_HEAL * dt);
      }
      // Los pasivos solo atacan si se les dispara; el resto detecta un objetivo en su radio
      if (!a.aggro && !t.passive) {
        const c = nearestVictim(a.x, a.y, t.aggro, atBase);
        if (c) { a.aggro = true; a.victim = c; }
      }

      const v = a.aggro ? a.victim : null;
      let wx = 0, wy = 0;
      if (v) {
        const dx = v.x - a.x, dy = v.y - a.y, d = Math.hypot(dx, dy) || 1;
        const nx = dx / d, ny = dy / d;
        let ux, uy;
        if (a.fleeing) { ux = -nx; uy = -ny; }
        else if (d > t.range * 0.8) { ux = nx; uy = ny; }
        else if (d < t.range * 0.5) { ux = -nx; uy = -ny; }
        else { ux = -ny * 0.4; uy = nx * 0.4; }
        const base = speedOf(a);
        const sp = a.fleeing ? base * 1.2 : base;
        wx = ux * sp; wy = uy * sp;

        a.cool -= dt;
        if (a.cool <= 0 && d <= t.range) {
          a.cool = t.cool;
          const base = Math.atan2(dy, dx);
          // Tirada del misil ralentizador: una sola vez por combate. Si sale, un solo misil en lugar del abanico, sin daño
          const slowShot = !!t.slow && !a.slowRolled && Math.random() < t.slow.chance;
          if (t.slow) a.slowRolled = true;
          const count = slowShot ? 1 : t.shots;
          const speed = slowShot ? t.slow.speed : 300;
          for (let i = 0; i < count; i++) {
            const ang = base + (i - (count - 1) / 2) * 0.22;
            // Daño entre el 75 % y el 100 % del máximo del NPC; puede fallar. El misil ralentizador no hace daño
            const dmg = slowShot ? 0 : Math.floor(t.dmg * rnd(0.75, 1));
            const miss = Math.random() < MISS_CHANCE;
            g.enemyShots.push({ x: a.x, y: a.y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, life: 3, dmg, miss, slow: slowShot ? t.slow : null });
          }
        }
      } else if (t.escort && escortOf(a)) {
        // Escolta: se acerca a su nave y, ya cerca, se mueve a su alrededor a la velocidad de la nave sin alejarse
        const e = escortOf(a);
        const ex = e.x - a.x, ey = e.y - a.y, ed = Math.hypot(ex, ey) || 1;
        const sp = speedOf(a);
        if (ed > 120) { wx = ex / ed * sp; wy = ey / ed * sp; }
        else {
          const pull = (ed - 100) * 2;
          wx = -ey / ed * sp * 0.5 + ex / ed * pull;
          wy = ex / ed * sp * 0.5 + ey / ed * pull;
        }
      } else {
        a.wt -= dt;
        if (a.wt <= 0) { a.wa = rnd(0, Math.PI * 2); a.wt = rnd(2, 4); }
        const hx = a.home.x - a.x, hy = a.home.y - a.y, hd = Math.hypot(hx, hy) || 1;
        wx = Math.cos(a.wa) * 25; wy = Math.sin(a.wa) * 25;
        if (hd > 200) { wx += hx / hd * 60; wy += hy / hd * 60; }
      }

      const k = 1 - Math.exp(-3 * dt);
      a.vx += (wx - a.vx) * k;
      a.vy += (wy - a.vy) * k;
      a.x = clamp(a.x + a.vx * dt, 20, z.w - 20);
      a.y = clamp(a.y + a.vy * dt, 20, z.h - 20);
      a.hit = Math.max(0, a.hit - dt);
    }
    g.aliens = g.aliens.filter(a => a.hp > 0);
  }

  // Distancia de un punto (x, y) al segmento (x1, y1)-(x2, y2)
  function segDist(x, y, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    const t = len2 ? clamp(((x - x1) * dx + (y - y1) * dy) / len2, 0, 1) : 0;
    return Math.hypot(x1 + dx * t - x, y1 + dy * t - y);
  }

  // Bots: cazan NPC, recorren el mapa y cambian de mapa por sus puertas. Solo actúan en el mapa de la nave,
  // porque solo ahí existen NPC; en los demás mapas solo cuentan los segundos hasta su próximo salto.
  function updateAllies(dt) {
    for (const b of g.allies) {
      // El combate termina cuando muere uno de los dos: si la nave muere, el bot olvida la pelea
      if (g.p.dead && !b.enemy) b.hostile = false;
      if (b.dead) {
        b.respawnT -= dt;
        if (b.respawnT <= 0) respawnBot(b);
        continue;
      }
      if (b.zi === g.zi) {
        updateBotActive(b, dt);
      } else if (!b.enemy) {
        b.hopT -= dt;
        if (b.hopT <= 0) crossBotPortal(b);
      }
    }
  }

  function updateBotActive(b, dt) {
    // Si la nave le ha atacado, le devuelve el ataque como a un jugador hostil, sin atender a los NPC
    if (b.hostile && !g.p.dead) {
      const d = dist(b.x, b.y, g.p.x, g.p.y);
      b.angle = Math.atan2(g.p.y - b.y, g.p.x - b.x);
      if (d > BOT_RANGE * 0.7) botMoveTo(b, g.p.x, g.p.y, dt);
      b.cool -= dt;
      if (b.cool <= 0 && d <= BOT_RANGE) botFire(b, g.p);
      return;
    }
    if (!b.target || !g.aliens.includes(b.target)) b.target = nearestAlien(b.x, b.y, BOT_SIGHT);
    const t = b.target;
    if (t) {
      const d = dist(b.x, b.y, t.x, t.y);
      b.angle = Math.atan2(t.y - b.y, t.x - b.x);
      if (d > BOT_RANGE * 0.7) botMoveTo(b, t.x, t.y, dt);
      b.cool -= dt;
      if (b.cool <= 0 && d <= BOT_RANGE) botFire(b, t);
      return;
    }
    // Sin objetivo: espera un momento y, al llegar, elige el siguiente punto o puerta
    if (b.wait > 0) { b.wait -= dt; return; }
    if (botMoveTo(b, b.tx, b.ty, dt)) {
      if (b.portal) { crossBotPortal(b); return; }
      chooseBotGoal(b);
      b.wait = rnd(2, 5);
    }
  }

  // Daño a un bot: igual que a la nave, pero sin escudo. Al morir explota y reaparece en la base de su mapa
  function hurtBot(b, d) {
    if (b.dead) return;
    spawnText(b.x, b.y - 30, Math.round(d), '#b07cff');
    b.hp -= d;
    if (b.hp <= 0) {
      b.hp = 0; b.dead = true; b.respawnT = BOT_RESPAWN;
      b.target = null; b.portal = false; b.hostile = false;
      b.honor -= Math.floor(b.honor * DEATH_HONOR_LOSS);
      explode(b.x, b.y, 22, '#6fe39a');
    }
  }

  function respawnBot(b) {
    const base = ZONES[b.zi].base;
    b.dead = false; b.hp = b.maxHp;
    b.x = base.x; b.y = base.y; b.tx = b.x; b.ty = b.y;
    b.wait = 0; b.target = null; b.portal = false; b.hostile = !!b.enemy;
  }

  // Mueve al bot hacia (x, y) a su velocidad; devuelve true al llegar
  function botMoveTo(b, x, y, dt) {
    const d = dist(b.x, b.y, x, y);
    if (d < 4) return true;
    const s = Math.min(b.speed * dt, d);
    b.angle = Math.atan2(y - b.y, x - b.x);
    b.x += Math.cos(b.angle) * s;
    b.y += Math.sin(b.angle) * s;
    return false;
  }

  // Un punto aleatorio del mapa o, una de cada cinco veces, la puerta del mapa
  function chooseBotGoal(b) {
    const z = ZONES[b.zi], pts = portalsOf(b.zi);
    b.portal = !b.enemy && pts.length > 0 && Math.random() < 0.2;
    if (b.portal) {
      b.tx = pts[0].x; b.ty = pts[0].y;
    } else {
      b.tx = rnd(600, z.w - 600); b.ty = rnd(600, z.h - 600);
    }
  }

  // El bot cruza la puerta de su mapa y aparece junto a la del destino, igual que la nave
  function crossBotPortal(b) {
    const pt = portalsOf(b.zi)[0];
    b.zi = pt.to; b.x = pt.spawn.x; b.y = pt.spawn.y;
    b.tx = b.x; b.ty = b.y; b.portal = false; b.target = null;
    b.wait = rnd(2, 5); b.hopT = rnd(30, 90);
  }

  // Disparo de bot. Contra un NPC es un proyectil verde, que no da recompensa al jugador.
  // Contra la nave es un disparo como el de un NPC, que no puede alcanzar al propio bot
  function botFire(b, t) {
    const ang = Math.atan2(t.y - b.y, t.x - b.x);
    b.cool = BOT_COOL;
    soundAt(b.x, b.y, playLaserSound);
    if (t === g.p) {
      g.enemyShots.push({
        x: b.x, y: b.y, vx: Math.cos(ang) * 300, vy: Math.sin(ang) * 300,
        life: BOT_RANGE / 300, dmg: LASERS[BOT_LASER].damage, miss: Math.random() < MISS_CHANCE, from: b,
      });
      return;
    }
    g.bullets.push({
      x: b.x + Math.cos(ang) * 18, y: b.y + Math.sin(ang) * 18,
      vx: Math.cos(ang) * BOT_BULLET_SPEED, vy: Math.sin(ang) * BOT_BULLET_SPEED,
      life: BOT_RANGE / BOT_BULLET_SPEED, dmg: LASERS[BOT_LASER].damage, color: '#6fe39a', bot: b,
    });
  }

  function updateBullets(dt) {
    for (const b of g.bullets) {
      if (b.homing && b.target && b.target.hp > 0) {
        const ang = Math.atan2(b.target.y - b.y, b.target.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        const diff = Math.atan2(Math.sin(ang - cur), Math.cos(ang - cur));
        const na = cur + clamp(diff, -b.turn * dt, b.turn * dt);
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
      const px = b.x, py = b.y;
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) continue;
      // Se comprueba el tramo recorrido en el frame, para que un proyectil rápido no atraviese al NPC
      // Un proyectil del jugador también puede dar al bot que tiene fijado; los de un bot solo dan a NPC
      const foes = b.bot ? g.aliens : [...g.aliens, ...g.allies.filter(x => x === b.target)];
      for (const a of foes) {
        if (a.hp > 0 && segDist(a.x, a.y, px, py, b.x, b.y) < (a.isBot ? BOT_RADIUS : ALIEN[a.type].r)) {
          if (a.isBot) { a.hostile = true; hurtBot(a, b.dmg); }
          else hitAlien(a, b.dmg, b.bot || g.p);
          if (b.missile) {
            soundAt(b.x, b.y, playMissileImpactSound);
            explode(b.x, b.y, 16, b.color);
          } else {
            spark(b.x, b.y, b.color);
          }
          b.life = 0;
          break;
        }
      }
    }
    g.bullets = g.bullets.filter(b => b.life > 0);
  }

  function updateEnemyShots(dt) {
    for (const s of g.enemyShots) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      // Un disparo fallado sigue de largo; el resto impacta en la primera nave que toca (la del jugador o un bot)
      if (s.miss || s.life <= 0) continue;
      // El misil ralentizador sólo afecta a la nave: atraviesa a los bots
      const hit = [g.p, ...(s.slow ? [] : g.allies)].find(v => v !== s.from && targetable(v) && dist(s.x, s.y, v.x, v.y) < 14);
      if (!hit) continue;
      if (s.slow) {
        // Un misil ralentizador no hace daño: sólo frena la nave durante su tiempo; volver a impactar lo renueva
        g.p.slowT = s.slow.time; g.p.slowF = s.slow.factor;
      } else if (hit === g.p) hurt(s.dmg);
      else hurtBot(hit, s.dmg);
      s.life = 0;
    }
    g.enemyShots = g.enemyShots.filter(s => s.life > 0);
  }

  function updatePickups(dt) {
    const p = g.p;
    for (const k of g.pickups) {
      k.life -= dt;
      const d = dist(k.x, k.y, p.x, p.y);
      if (k.type !== 'cargo' && !p.dead && d < 120) { k.x += (p.x - k.x) * 4 * dt; k.y += (p.y - k.y) * 4 * dt; }
      // Las cajas de carga solo se recogen si se ha hecho clic sobre ellas (k.want)
      const collect = k.type !== 'cargo' || k.want;
      if (!p.dead && d < 22 && k.life > 0 && collect) {
        if (k.type === 'repair') p.hp = Math.min(maxHpNow(), p.hp + 25);
        else if (k.type === 'cargo') {
          // Cada materia va a su almacén: las de bodega ocupan espacio, las de refinamiento no
          for (const [key, n] of Object.entries(k.cargo)) {
            if (key in g.cargo) g.cargo[key] += n;
            else g.refine[key] += n;
          }
          showBanner('Caja de carga recogida');
        }
        k.life = 0;
      }
    }
    g.pickups = g.pickups.filter(k => k.life > 0);
  }

  function updateParticles(dt) {
    for (const q of g.parts) {
      q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
      q.vx *= Math.exp(-3 * dt); q.vy *= Math.exp(-3 * dt);
    }
    g.parts = g.parts.filter(q => q.life > 0);
  }

  // ---------- Dibujo ----------
  const sx = x => x - g.p.x + W / 2;
  const sy = y => y - g.p.y + H / 2;

  function polyPts(sides, r) {
    return Array.from({ length: sides }, (_, i) => {
      const a = i / sides * Math.PI * 2;
      return [Math.cos(a) * r, Math.sin(a) * r];
    });
  }

  function drawPoly(x, y, rot, pts, fill, stroke) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    pts.forEach((pt, i) => i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1]));
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function bar(x, y, w, h, ratio, color) {
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * clamp(ratio, 0, 1), h);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.strokeRect(x + 0.5, y + 0.5, w, h);
  }

  function drawStars() {
    const camX = g.p.x - W / 2, camY = g.p.y - H / 2;
    for (const s of g.stars) {
      const x = mod(s.x * W - camX * s.z * 0.25, W);
      const y = mod(s.y * H - camY * s.z * 0.25, H);
      ctx.fillStyle = `rgba(200,220,255,${0.3 + s.z * 0.6})`;
      ctx.fillRect(x, y, s.z * 1.8, s.z * 1.8);
    }
  }

  function drawWorldBackground() {
    const z = g.zone;
    ctx.strokeStyle = 'rgba(120,160,255,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx(0), sy(0), z.w, z.h);
    const bx = sx(z.base.x), by = sy(z.base.y);
    ctx.beginPath();
    ctx.arc(bx, by, z.base.r, 0, Math.PI * 2);
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = 'rgba(93,255,138,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#5dff8a';
    ctx.font = '12px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BASE', bx, by - z.base.r - 8);
    ctx.textAlign = 'left';
    for (const portal of portalsOf(g.zi)) {
      const x = sx(portal.x), y = sy(portal.y);
      ctx.save();
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.arc(x, y, 40, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#ffd166';
      ctx.font = '13px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PORTAL', x, y - 50);
      ctx.textAlign = 'left';
      // El icono de teletransporte solo aparece al alcance de la puerta
      if (dist(g.p.x, g.p.y, portal.x, portal.y) < PORTAL_RANGE) drawPortalIcon(portalIconBox(portal));
    }
  }

  function drawAliens() {
    const p = g.p;
    drawAiderBeams();
    for (const a of g.aliens) {
      const t = ALIEN[a.type];
      const x = sx(a.x), y = sy(a.y);
      const rot = Math.atan2(p.y - a.y, p.x - a.x);
      const flash = a.hit > 0;
      drawPoly(x, y, rot, polyPts(t.sides, t.r), flash ? '#ffffff' : t.color, '#ffffff22');
      if (a.hp < t.hp || a.aggro) bar(x - 18, y - t.r - 10, 36, 4, a.hp / t.hp, '#5dff8a');
      if (a.shield > 0 && a.shield < t.shield) bar(x - 18, y - t.r - 15, 36, 3, a.shield / t.shield, '#5ac8ff');
      if (g.p.target === a) {
        ctx.beginPath();
        ctx.arc(x, y, t.r + 8, 0, Math.PI * 2);
        ctx.strokeStyle = g.p.attacking ? '#ff4d6d' : '#ffd166';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      // Nombre del NPC siempre visible, bajo el NPC
      ctx.fillStyle = '#ff3b3b';
      ctx.font = '11px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`..::{ ${t.name} }::..`, x, y + t.r + 22);
      ctx.textAlign = 'left';
    }
  }

  // Bots aliados: triángulo verde con su nombre y nivel. No están en g.aliens, así que no son objetivos
  function drawAllies() {
    for (const b of g.allies) {
      if (b.zi !== g.zi || b.dead) continue;
      const x = sx(b.x), y = sy(b.y);
      const color = b.enemy ? '#ff5c5c' : '#6fe39a';
      drawPoly(x, y, b.angle, polyPts(3, 16), color, '#ffffff22');
      if (b.hp < b.maxHp) bar(x - 18, y - 26, 36, 4, b.hp / b.maxHp, '#ff5c5c');
      if (g.p.target === b) {
        ctx.beginPath();
        ctx.arc(x, y, 24, 0, Math.PI * 2);
        ctx.strokeStyle = g.p.attacking ? '#ff4d6d' : '#ffd166';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.textAlign = 'center';
      if (b.enemy || b.company === g.p.company) {
        // Enemigos en rojo y aliados de la empresa del jugador en azul (aliados, no de otra empresa).
        // Ambos con el mismo estilo que el nombre del jugador: negrita y borde negro
        ctx.font = 'bold 15px Consolas, monospace';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000000';
        ctx.strokeText(b.name, x, y + 16 + 22);
        ctx.fillStyle = b.enemy ? '#ff5c5c' : '#4da6ff';
      } else {
        ctx.fillStyle = color;
        ctx.font = '13px Consolas, monospace';
      }
      ctx.fillText(b.name, x, y + 16 + 22);
      const nameW = ctx.measureText(b.name).width;
      if (b.rank != null) drawRank(b.rank, x - nameW / 2 - 4, y + 16 + 22 - 6);
      drawCompany(b.company, x + nameW / 2 + 4, y + 16 + 22 - 6);
      ctx.textAlign = 'left';
    }
  }

  function drawPickups() {
    for (const k of g.pickups) {
      const x = sx(k.x), y = sy(k.y);
      if (k.type === 'repair') {
        ctx.fillStyle = '#5dff8a';
        ctx.fillRect(x - 6, y - 2, 12, 4);
        ctx.fillRect(x - 2, y - 6, 4, 12);
      } else if (k.type === 'cargo') {
        ctx.fillStyle = '#9fe3ff';
        ctx.fillRect(x - 7, y - 7, 14, 14);
      }
    }
  }

  function drawProjectiles() {
    for (const b of g.bullets) {
      const x = sx(b.x), y = sy(b.y);
      if (b.homing) {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
      } else {
        const len = 14, m = Math.hypot(b.vx, b.vy) || 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - b.vx / m * len, y - b.vy / m * len);
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
    for (const s of g.enemyShots) {
      ctx.beginPath();
      if (s.slow) {
        // Misil ralentizador: punto azul más grande y con brillo
        ctx.fillStyle = '#7fe7ff';
        ctx.shadowColor = '#7fe7ff';
        ctx.shadowBlur = 10;
        ctx.arc(sx(s.x), sy(s.y), 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = '#ff7a7a';
        ctx.arc(sx(s.x), sy(s.y), 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawTexts() {
    ctx.save();
    ctx.font = 'bold 14px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    for (const t of g.texts) {
      const x = t.onPlayer ? W / 2 + t.x : sx(t.x);
      const y = t.onPlayer ? H / 2 + t.y : sy(t.y);
      ctx.globalAlpha = Math.max(0, t.life / t.max);
      ctx.strokeText(t.text, x, y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, x, y);
    }
    ctx.restore();
  }

  // Descarga eléctrica del PEM: anillo que se expande desde el NPC con arcos en zigzag que chisporrotean
  function drawPems() {
    for (const q of g.pems) {
      const k = 1 - q.life / q.max;
      const x = sx(q.x), y = sy(q.y), r = 30 + k * 150;
      ctx.save();
      ctx.globalAlpha = q.life / q.max;
      ctx.strokeStyle = '#7fe7ff';
      ctx.shadowColor = '#7fe7ff';
      ctx.shadowBlur = 12;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 + k * 2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * r * 0.4, y + Math.sin(a) * r * 0.4);
        for (let s = 1; s <= 4; s++) {
          const d = r * (0.4 + 0.15 * s), j = rnd(-8, 8);
          ctx.lineTo(x + Math.cos(a) * d - Math.sin(a) * j, y + Math.sin(a) * d + Math.cos(a) * j);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const q of g.parts) {
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.color;
      ctx.fillRect(sx(q.x), sy(q.y), q.size, q.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawMoveMarker() {
    const p = g.p;
    if (p.target || p.tx === null) return;
    const x = sx(p.tx), y = sy(p.ty);
    ctx.strokeStyle = 'rgba(93,255,138,0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y);
    ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10);
    ctx.stroke();
  }

  // Nombre fijo del jugador (de momento no tiene nomenclatura propia)
  const PLAYER_NAME = 'Ragdeap';

  // Rangos de menor a mayor; el índice es el valor de `rank` (null = sin rango)
  const RANKS = [
    '01-cadete-espacial', '02-piloto-espacial', '03-piloto-mayor', '04-cabo', '05-sargento',
    '06-sargento-primero', '07-subteniente', '08-teniente', '09-teniente-primero', '10-subcapitan',
    '11-capitan', '12-capitan-primero', '13-comandante-subalterno', '14-comandante', '15-comandante-jefe',
    '16-subcoronel', '17-coronel', '18-coronel-mayor', '19-general-de-brigada', '20-general', '21-general-supremo',
  ];
  const rankImgs = RANKS.map(f => {
    const img = new Image();
    img.src = 'rangos/' + f + '.svg';
    return img;
  });

  // Dibuja el icono de rango con su borde derecho en `right`, centrado en `cy`. Mantiene la proporción del SVG
  function drawRank(rank, right, cy) {
    const img = rankImgs[rank];
    if (!img || !img.complete || !img.naturalWidth) return;
    const h = 18, w = h * img.naturalWidth / img.naturalHeight;
    ctx.drawImage(img, right - w, cy - h / 2, w, h);
  }

  // Logo de cada empresa, a la derecha del nombre
  const logoImgs = {};
  for (const [company, file] of Object.entries({ VRU: 'vru', EIC: 'eic', MMO: 'mmo' })) {
    const img = new Image();
    img.src = 'empresas/' + file + '.svg';
    logoImgs[company] = img;
  }

  // Dibuja el logo de la empresa con su borde izquierdo en `left`, centrado en `cy`, con la misma altura que el icono de rango
  function drawCompany(company, left, cy) {
    const img = logoImgs[company];
    if (!img || !img.complete || !img.naturalWidth) return;
    const h = 18, w = h * img.naturalWidth / img.naturalHeight;
    ctx.drawImage(img, left, cy - h / 2, w, h);
  }

  // Reparto de rangos por empresa, de mayor a menor. `n` = jugadores fijos; `pct` = % de la empresa (mínimo 1).
  // `rank` es el índice en RANKS
  const RANK_TABLE = [
    { n: 1, rank: 20 }, { n: 2, rank: 19 }, { n: 3, rank: 18 }, { n: 5, rank: 17 }, { n: 20, rank: 16 },
    { pct: 1, rank: 15 }, { pct: 1.5, rank: 14 }, { pct: 2, rank: 13 }, { pct: 2.5, rank: 12 }, { pct: 3, rank: 11 },
    { pct: 3.5, rank: 10 }, { pct: 4, rank: 9 }, { pct: 4.5, rank: 8 }, { pct: 5, rank: 7 }, { pct: 6, rank: 6 },
    { pct: 7, rank: 5 }, { pct: 8, rank: 4 }, { pct: 9, rank: 3 }, { pct: 10, rank: 2 }, { pct: 12.9, rank: 1 }, { pct: 20, rank: 0 },
  ];

  // Puntos de rango. De momento sólo PE, honor y nivel: el resto de términos de la fórmula aún no existe en el juego
  const rankPoints = c => c.exp / 100000 + c.honor / 100 + levelFor(c.exp) * 100;

  // Ordena a cada empresa por puntos de rango y reparte los rangos según RANK_TABLE
  function updateRanks() {
    const byCompany = {};
    for (const c of [g.p, ...g.allies]) (byCompany[c.company] ||= []).push(c);
    for (const list of Object.values(byCompany)) {
      list.sort((a, b) => rankPoints(b) - rankPoints(a));
      let pos = 0;
      for (const row of RANK_TABLE) {
        const slots = row.n ?? Math.max(1, Math.round(list.length * row.pct / 100));
        for (let i = 0; i < slots && pos < list.length; i++) list[pos++].rank = row.rank;
      }
      for (; pos < list.length; pos++) list[pos].rank = null;
    }
  }

  function drawPlayer() {
    const p = g.p;
    if (p.dead) return;
    const cx = W / 2, cy = H / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(p.angle);
    if (Math.hypot(p.vx, p.vy) > 20) {
      ctx.fillStyle = '#ffb347';
      ctx.beginPath();
      ctx.moveTo(-10, -4); ctx.lineTo(-22 - rnd(0, 6), 0); ctx.lineTo(-10, 4);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(14, 0); ctx.lineTo(-10, 8); ctx.lineTo(-6, 0); ctx.lineTo(-10, -8); ctx.closePath();
    ctx.fillStyle = '#d7e6ff';
    ctx.fill();
    ctx.strokeStyle = '#5aa8ff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
    // Barras sobre la nave: la vida siempre; el escudo sólo si hay escudo equipado y le queda carga
    const bw = 40, bx = cx - bw / 2;
    bar(bx, cy - 30, bw, 4, p.hp / p.maxHp, '#5dff8a');
    if (p.maxShield > 0 && p.shield > 0) bar(bx, cy - 36, bw, 3, p.shield / p.maxShield, '#5ac8ff');
    // Aviso mientras dura el efecto del misil ralentizador
    if (p.slowT > 0) {
      ctx.save();
      ctx.font = 'bold 11px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#7fe7ff';
      ctx.fillText(`RALENTIZADO ${Math.ceil(p.slowT)} s`, cx, cy - 46);
      ctx.restore();
    }
    // Nombre del jugador debajo de la nave: blanco y grueso, con borde negro
    ctx.save();
    ctx.font = 'bold 15px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#000000';
    ctx.strokeText(PLAYER_NAME, cx, cy + 36);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(PLAYER_NAME, cx, cy + 36);
    const nameW = ctx.measureText(PLAYER_NAME).width;
    if (p.rank != null) drawRank(p.rank, cx - nameW / 2 - 4, cy + 36 - 6);
    drawCompany(p.company, cx + nameW / 2 + 4, cy + 36 - 6);
    ctx.restore();
  }

  function drawCursor() {
    ctx.strokeStyle = 'rgba(127,214,255,0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2);
    ctx.moveTo(mouse.x - 12, mouse.y); ctx.lineTo(mouse.x - 4, mouse.y);
    ctx.moveTo(mouse.x + 4, mouse.y); ctx.lineTo(mouse.x + 12, mouse.y);
    ctx.stroke();
  }

  function drawCenter(text, color, size, alpha, y) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.font = `${size}px Consolas, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, W / 2, y);
    ctx.restore();
  }

  // ---------- Ventana de usuario ----------
  const PLAYER_W = 340, PLAYER_H = 116;
  const formatNum = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

  // Minimizada es un icono abajo a la izquierda; abierta, una ventana arrastrable
  function playerGeom() {
    if (!g.playerOpen) return { x: W - 96, y: 16, w: 36, h: 36 };
    const pos = g.playerPos || { x: 16, y: H - PLAYER_H - 60 };
    const x = clamp(pos.x, 0, W - PLAYER_W), y = clamp(pos.y, 0, H - PLAYER_H);
    return { x, y, w: PLAYER_W, h: PLAYER_H, close: { x: x + PLAYER_W - 26, y: y + 6, w: 20, h: 20 } };
  }

  // Busto de usuario: cabeza y hombros, sin detalle. Centrado en (cx, cy) con tamaño de referencia "size"
  function drawBustIcon(cx, cy, size) {
    ctx.beginPath();
    ctx.arc(cx, cy - size * 0.22, size * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy + size * 0.45, size * 0.4, Math.PI, 0);
    ctx.fill();
  }

  function drawPlayerIcon(b) {
    const hover = inBox(b, mouse.x, mouse.y);
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = hover ? 16 : 6;
    drawBustIcon(b.x + b.w / 2, b.y + b.h / 2, 26);
    ctx.shadowBlur = 0;
    if (hover) drawIconTooltip(b, 'Usuario');
  }

  // Iconos de las filas de la ventana de usuario (dibujados con trazos, sin texto). Centrados en (cx, cy), tamaño 12 px
  function drawDataIcon(kind, cx, cy) {
    const r = 6;
    ctx.fillStyle = '#ffd166';
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (kind === 'id') {
      // Tarjeta de identificación: marco, cabeza y líneas de datos
      ctx.strokeRect(cx - 6, cy - 4.5, 12, 9);
      ctx.arc(cx - 2.5, cy - 0.5, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(cx + 1, cy - 2, 3.5, 1);
      ctx.fillRect(cx + 1, cy + 1, 3.5, 1);
    } else if (kind === 'exp') {
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const d = i % 2 ? r * 0.45 : r;
        ctx.lineTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
      }
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'level') {
      [0.4, 0.7, 1].forEach((k, i) => ctx.rect(cx - r + i * 4.5, cy + r - r * 2 * k, 3, r * 2 * k));
      ctx.fill();
    } else if (kind === 'honor') {
      ctx.arc(cx, cy - 2, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - 3, cy + 1);
      ctx.lineTo(cx - 4, cy + r);
      ctx.lineTo(cx - 1, cy + r - 1.5);
      ctx.lineTo(cx + 1, cy + r);
      ctx.lineTo(cx + 3, cy + 1);
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'credits') {
      // Logo de créditos: una "C" de trazos rectos con los extremos superior e inferior hacia la derecha, como la "U" de uridium
      ctx.strokeStyle = '#ffd166';
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 4;
      ctx.lineWidth = 2;
      ctx.moveTo(cx + 4, cy - 5);
      ctx.lineTo(cx - 3, cy - 5);
      ctx.lineTo(cx - 3, cy + 5);
      ctx.lineTo(cx + 4, cy + 5);
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (kind === 'uridium') {
      // Logo de uridium: una "U" luminosa con un pequeño trazo hacia la derecha en el brazo derecho
      ctx.strokeStyle = '#ffd166';
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 4;
      ctx.lineWidth = 2;
      ctx.moveTo(cx - 4, cy - 5);
      ctx.lineTo(cx - 4, cy + 4);
      ctx.lineTo(cx + 3, cy + 4);
      ctx.lineTo(cx + 3, cy - 5);
      ctx.moveTo(cx + 3, cy - 2);
      ctx.lineTo(cx + 6, cy - 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (kind === 'teleport') {
      [[0.3, -1], [-0.6, 0.15], [0, 0.15], [-0.3, 1], [0.6, -0.2], [0, -0.2]].forEach(([x, y], i) => {
        if (i === 0) ctx.moveTo(cx + x * r, cy + y * r);
        else ctx.lineTo(cx + x * r, cy + y * r);
      });
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'keys') {
      ctx.arc(cx - 3.5, cy, 2.5, 0, Math.PI * 2);
      ctx.moveTo(cx - 1, cy);
      ctx.lineTo(cx + r, cy);
      ctx.moveTo(cx + 3.5, cy);
      ctx.lineTo(cx + 3.5, cy + 3);
      ctx.moveTo(cx + r, cy);
      ctx.lineTo(cx + r, cy + 2);
      ctx.stroke();
    }
  }

  // Etiqueta de una fila: cada dato se identifica solo con su icono
  function drawDataLabel(kind, x, y) {
    drawDataIcon(kind, x + 6, y - 4);
  }

  function drawPlayerWindow() {
    const b = playerGeom();
    ctx.save();
    if (!g.playerOpen) { drawPlayerIcon(b); ctx.restore(); return; }
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd166';
    drawBustIcon(b.x + 18, b.y + 17, 14);
    ctx.fillText('USUARIO', b.x + 30, b.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.x + 8, b.y + 30, b.w - 16, 1);
    ctx.fillRect(b.x + 172, b.y + 38, 1, b.h - 48);
    // Botón de cerrar
    const c = b.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();
    // Columna izquierda: identificador, experiencia, nivel y honor
    const left = [['id', g.playerId], ['exp', formatNum(g.exp)], ['level', levelFor(g.exp)],['honor', formatNum(g.honor)]];
    // Columna derecha: créditos, uridium, bonos de teleportación y llaves de botín
    const right = [['credits', formatNum(g.credits)], ['uridium', formatNum(g.uridium)], ['teleport', formatNum(g.teleportBonus)], ['keys', formatNum(g.lootKeys)]];
    const rowY = i => b.y + 48 + i * 20;
    left.forEach(([kind, value], i) => {
      drawDataLabel(kind, b.x + 14, rowY(i));
      ctx.fillStyle = '#cfe8ff';
      ctx.textAlign = 'right';
      ctx.fillText(String(value), b.x + 160, rowY(i));
    });
    right.forEach(([kind, value], i) => {
      drawDataLabel(kind, b.x + 184, rowY(i));
      ctx.fillStyle = '#cfe8ff';
      ctx.textAlign = 'right';
      ctx.fillText(String(value), b.x + b.w - 14, rowY(i));
    });
    ctx.restore();
  }

  // ---------- Ventana de nave ----------
  // Seis datos en dos columnas de tres: izquierda casco, escudo y nanocasco; derecha configuración, tonelaje y velocidad
  const NAVE_W = 340, NAVE_H = 114;

  // Minimizada es un icono junto a los de usuario y misiones; abierta, una ventana arrastrable
  function naveGeom() {
    if (!g.naveOpen) return { x: W - 140, y: 16, w: 36, h: 36 };
    const pos = g.navePos || { x: 16, y: 190 };
    const x = clamp(pos.x, 0, W - NAVE_W), y = clamp(pos.y, 0, H - NAVE_H);
    return { x, y, w: NAVE_W, h: NAVE_H, close: { x: x + NAVE_W - 26, y: y + 6, w: 20, h: 20 } };
  }

  // Silueta de nave: triángulo apuntando hacia arriba
  function drawShipIcon(cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - s);
    ctx.lineTo(cx + s * 0.7, cy + s * 0.8);
    ctx.lineTo(cx, cy + s * 0.4);
    ctx.lineTo(cx - s * 0.7, cy + s * 0.8);
    ctx.closePath();
    ctx.fill();
  }

  function drawNaveIcon(b) {
    const hover = inBox(b, mouse.x, mouse.y);
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = hover ? 16 : 6;
    drawShipIcon(b.x + b.w / 2, b.y + b.h / 2, 11);
    ctx.shadowBlur = 0;
    if (hover) drawIconTooltip(b, 'Nave');
  }

  // Iconos de las filas de la ventana de nave, con el mismo trazo dorado que la de usuario
  function drawNaveRowIcon(kind, cx, cy) {
    ctx.fillStyle = '#ffd166';
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (kind === 'hull') {
      // Cruz: casco
      ctx.fillRect(cx - 1.5, cy - 5, 3, 10);
      ctx.fillRect(cx - 5, cy - 1.5, 10, 3);
    } else if (kind === 'shield') {
      // Escudo
      ctx.moveTo(cx, cy - 6);
      ctx.lineTo(cx + 5, cy - 3.5);
      ctx.lineTo(cx + 5, cy + 1);
      ctx.quadraticCurveTo(cx + 5, cy + 5, cx, cy + 6);
      ctx.quadraticCurveTo(cx - 5, cy + 5, cx - 5, cy + 1);
      ctx.lineTo(cx - 5, cy - 3.5);
      ctx.closePath();
      ctx.stroke();
    } else if (kind === 'nano') {
      // Hexágono: nanocasco
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        ctx.lineTo(cx + Math.cos(a) * 5, cy + Math.sin(a) * 5);
      }
      ctx.closePath();
      ctx.stroke();
    } else if (kind === 'config') {
      // Engranaje: configuración
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        ctx.moveTo(cx + Math.cos(a) * 3.5, cy + Math.sin(a) * 3.5);
        ctx.lineTo(cx + Math.cos(a) * 5.5, cy + Math.sin(a) * 5.5);
      }
      ctx.stroke();
    } else if (kind === 'cargo') {
      // Caja: tonelaje
      ctx.strokeRect(cx - 5, cy - 4, 10, 8);
      ctx.moveTo(cx - 5, cy);
      ctx.lineTo(cx + 5, cy);
      ctx.stroke();
    } else if (kind === 'speed') {
      // Doble flecha: velocidad
      ctx.moveTo(cx - 4, cy - 4);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx - 4, cy + 4);
      ctx.moveTo(cx, cy - 4);
      ctx.lineTo(cx + 4, cy);
      ctx.lineTo(cx, cy + 4);
      ctx.stroke();
    }
  }

  // Barra de segmentos: cuánto de "frac" (0 a 1) está lleno
  function drawSegBar(x, y, w, h, frac) {
    const n = 10, gap = 2, segW = (w - gap * (n - 1)) / n;
    const on = Math.round(clamp(frac, 0, 1) * n);
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = i < on ? '#ffd166' : '#1e2c44';
      ctx.fillRect(x + i * (segW + gap), y, segW, h);
    }
  }

  function drawNaveWindow() {
    const b = naveGeom();
    ctx.save();
    if (!g.naveOpen) { drawNaveIcon(b); ctx.restore(); return; }
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd166';
    drawShipIcon(b.x + 18, b.y + 17, 8);
    ctx.fillText('NAVE', b.x + 30, b.y + 22);
    ctx.fillStyle = '#5f6e84';
    ctx.fillRect(b.x + 8, b.y + 30, b.w - 16, 1);
    ctx.fillRect(b.x + 170, b.y + 38, 1, b.h - 48);
    // Botón de cerrar
    const c = b.close;
    ctx.strokeStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.moveTo(c.x + 5, c.y + 5); ctx.lineTo(c.x + c.w - 5, c.y + c.h - 5);
    ctx.moveTo(c.x + c.w - 5, c.y + 5); ctx.lineTo(c.x + 5, c.y + c.h - 5);
    ctx.stroke();

    const p = g.p;
    const cargo = Object.values(g.cargo).reduce((sum, n) => sum + n, 0);
    const cap = SHIPS[g.shipId].cargo;
    const nano = 0;   // nanocasco actual: sin implementar, siempre 0
    // Columna izquierda: casco, escudo y nanocasco (todavía sin implementar: 0)
    const left = [
      { kind: 'hull', frac: p.hp / p.maxHp, value: formatNum(Math.ceil(p.hp)) },
      { kind: 'shield', frac: p.maxShield ? p.shield / p.maxShield : 0, value: formatNum(Math.ceil(p.shield)) },
      // Nanocasco: su máximo es igual al casco de la nave. Sin implementar, siempre está a 0
      { kind: 'nano', frac: nano / p.maxHp, value: formatNum(nano) },
    ];
    // Columna derecha: tonelaje, velocidad máxima y configuración (sin implementar: 1)
    const right = [
      { kind: 'cargo', frac: cargo / cap, value: `${formatNum(cargo)} / ${formatNum(cap)}` },
      { kind: 'speed', frac: null, value: formatNum(Math.round(p.speed)) },
      { kind: 'config', frac: null, value: '1' },
    ];
    const rowY = i => b.y + 50 + i * 21;
    ctx.font = '12px Consolas, monospace';
    left.forEach((r, i) => {
      drawNaveRowIcon(r.kind, b.x + 20, rowY(i) - 4);
      if (r.frac !== null) drawSegBar(b.x + 32, rowY(i) - 8, 64, 7, r.frac);
      ctx.fillStyle = '#cfe8ff';
      ctx.textAlign = 'right';
      ctx.fillText(r.value, b.x + 160, rowY(i));
    });
    right.forEach((r, i) => {
      drawNaveRowIcon(r.kind, b.x + 190, rowY(i) - 4);
      if (r.frac !== null) drawSegBar(b.x + 202, rowY(i) - 8, 60, 7, r.frac);
      ctx.fillStyle = '#cfe8ff';
      ctx.textAlign = 'right';
      ctx.fillText(r.value, b.x + b.w - 14, rowY(i));
    });
    ctx.restore();
  }

  // ---------- Estación de venta ----------
  const STATION_RANGE = 110;   // distancia máxima a la estación para abrir la venta
  const STATION_CLICK = 40;    // radio del clic sobre la estación

  const inBox = (r, px, py) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;

  function stationNear() {
    const st = g.zone.station;
    return !!st && dist(g.p.x, g.p.y, st.x, st.y) < STATION_RANGE;
  }

  function sellMaterial(m) {
    const qty = g.cargo[m.key];
    if (!qty) return;
    const total = qty * m.price;
    g.credits += total;
    g.cargo[m.key] = 0;
    showBanner(`Vendido: ${qty} ${m.name} por ${total} créditos`);
  }

  function stationGeom() {
    const w = 360, h = 210, x = Math.round((W - w) / 2), y = Math.round((H - h) / 2);
    return {
      x, y, w, h,
      close: { x: x + w - 26, y: y + 6, w: 20, h: 20 },
      rows: MATERIALS.map((m, i) => ({ m, btn: { x: x + 276, y: y + 60 + i * 24, w: 70, h: 18 } })),
    };
  }

  function drawStation() {
    const st = g.zone.station;
    if (!st) return;
    const x = sx(st.x), y = sy(st.y);
    ctx.save();
    ctx.fillStyle = 'rgba(90,209,255,0.15)';
    ctx.fillRect(x - 18, y - 18, 36, 36);
    ctx.strokeStyle = '#5ad1ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 18, y - 18, 36, 36);
    ctx.fillStyle = '#5ad1ff';
    ctx.font = '12px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('VENTA', x, y - 26);
    if (stationNear() && !g.stationOpen) ctx.fillText('Clic para vender', x, y + 36);
    ctx.restore();
  }

  function drawStationWindow() {
    if (!g.stationOpen) return;
    const b = stationGeom();
    ctx.save();
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#5ad1ff';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    ctx.font = '13px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
