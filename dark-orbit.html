<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Orbit Local</title>
<style>
  html, body { margin: 0; height: 100%; background: #03040a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="entrada" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#05080f;color:#d7e6ff;font:16px Consolas,monospace">
  <div style="font-size:28px;letter-spacing:4px;color:#ffd166">DARK ORBIT</div>
  <button id="entrar" disabled style="padding:10px 40px;background:#1b2a44;border:1px solid #ffd166;color:#ffd166;font:16px Consolas,monospace;cursor:pointer">Cargando...</button>
</div>
<script>
(() => {
  // Sin servidor local no se juega: todo el progreso se guarda en data/save.json
  const GAME_URL = 'http://localhost:3000/';
  function showServerMissing() {
    document.body.innerHTML = '<p style="margin:0;padding:24px;min-height:100vh;box-sizing:border-box;background:#0b1020;color:#d7e6ff;font:16px Consolas,monospace">'
      + 'Dark Orbit necesita el servidor local para guardar la partida. Arráncalo con Jugar.bat (o con "node server.js") y vuelve a abrir el juego.</p>';
  }
  if (location.protocol === 'file:') {
    // Con "no-cors" sólo se comprueba que el servidor responde, sin leer su contenido
    fetch(GAME_URL + 'api/save', { mode: 'no-cors', cache: 'no-store' })
      .then(() => location.replace(GAME_URL), showServerMissing);
    return;
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  // El canvas se dibuja con la resolución real de la pantalla (escalado de Windows) para que no salga borroso
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  addEventListener('resize', resize);
  resize();

  // ---------- Utilidades ----------
  const rnd = (a, b) => a + Math.random() * (b - a);
  const mod = (a, b) => ((a % b) + b) % b;
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const MAIN_BASE = ZONES[MAIN_ZI].base;
  const respawnPoint = () => g.zone.base || MAIN_BASE;

  const HOME_ZONE = { MMO: '1-1', EIC: '2-1', VRU: '3-1' };
  // Zona de una misión: 'home' es la zona de la empresa del jugador (X-1); el resto son fijas
  function missionZone(m) { return m.zone === 'home' ? HOME_ZONE[g.p.company] : m.zone; }
  // Sustituye {zone} por la zona de la misión en sus textos
  function missionText(m, text) { return text.replace('{zone}', missionZone(m)); }

  // unlock: lo que se desbloquea al alcanzar el nivel (los modificadores de la derecha aún no se implementan)

  const LEVEL_UNLOCKS = {
    1: 'Acceso a mapas base X-1 y X-2',
    2: 'Mapas X-3 y X-4',
    3: 'Salto directo entre X-3 y X-4',
    5: 'Acceso a mapas X-3 y X-4 enemigos',
    7: 'Restricción del 50 % de carga en base X-1',
    8: 'Mapas PvP (4-1, 4-2, 4-3)',
    9: 'Mapa PvP (4-4)',
    10: 'Mapa X-5',
    11: 'Mapas X-6 y X-7',
    12: 'Mapa X-8 (propia empresa)',
    13: 'Mapas X-2 enemigos',
    14: 'Mapas X-5 enemigos',
    15: 'Mapas X-6 y X-7 enemigos',
    16: 'Mapas X-1 enemigos',
    17: 'Mapas X-8 enemigos (todos los mapas clásicos desbloqueados)',
    24: 'Mapas Black Light (BL) / acceso total al contenido actual del juego',
  };

  // Nivel que corresponde a una cantidad de PE

    let n = 1;
    while (n < MAX_LEVEL && exp >= levelExp(n + 1)) n++;
    return n;
  };

  // NPC de un mapa para guardar (sólo lo que hace falta para volver a encontrarlos) y para restaurarlos
  function saveAliens(list) {
    return list.map(a => ({ type: a.type, x: a.x, y: a.y, home: a.home, pack: a.pack, off: a.off, hp: a.hp, shield: a.shield, pemDone: a.pemDone }));
  }
  function restoreAliens(list) {
    const homes = {};
    return (list || []).filter(a => ALIEN[a.type]).map(a => {
      let home = a.home;
      if (a.pack) {
        homes[a.pack] = homes[a.pack] || { x: a.home.x, y: a.home.y, loiter: false, wt: 0 };
        home = homes[a.pack];
      }
      return { ...a, home, vx: 0, vy: 0, aggro: false, cool: rnd(0.5, 1.5), wa: 0, wt: 0, hit: 0 };
    });
  }

  // Cambia de mapa. Sin "spawn" la nave aparece en la base; si se cruza una puerta, junto a su enlace
  function setZone(i, spawn) {
    if (g.zone) g.world[g.zone.id] = saveAliens(g.aliens);
    g.zi = i;
    g.zone = ZONES[i];
    g.aliens = restoreAliens(g.world[g.zone.id]); g.bullets = []; g.enemyShots = []; g.pickups = []; g.parts = []; g.pems = [];
    const p = g.p;
    const at = spawn || respawnPoint();
    p.x = at.x; p.y = at.y;
    p.tx = null; p.ty = null; p.target = null; p.attacking = false;
    refreshShield();
    p.hp = Math.min(p.hp, maxHpNow());
    p.spawnT = SPAWN_PROTECT; p.combatT = 0; p.nazBroken = false;
    showBanner(g.zone.name);
  }

  function showBanner(text) {
    g.banner = 2.5;
    g.bannerText = text;
  }

  // Puertas de la zona actual. Cada una lleva a la zona indicada en `to` (si todavía no existe, no se muestra).
  // La nave aparece a 120 px de la puerta que lleva de vuelta a esta zona, dentro de su zona segura.
  function portalsOf(zi) {
    const here = ZONES[zi].id, list = [];
    for (const pt of ZONES[zi].portals) {
      const to = ZONES.findIndex(z => z.id === pt.to);
      if (to < 0) continue;
      const back = ZONES[to].portals.find(b => b.to === here);
      const b0 = ZONES[to].base || MAIN_BASE;
      const spawn = back ? { x: back.x + 120, y: back.y } : { x: b0.x, y: b0.y };
      list.push({ x: pt.x, y: pt.y, to, spawn });
    }
    return list;
  }

  // Teletransporte: solo disponible a esta distancia de la puerta (la misma que la zona segura).
  // Se activa con el icono sobre la puerta o con la tecla J; no ocurre al pasar por encima.
  const PORTAL_RANGE = 200;   // alcance del teletransporte (tecla J o icono)
  const NAZ_RANGE = 720;      // radio de la zona de no ataque: 6 celdas del minimapa (120 unidades por celda)
  const SPAWN_PROTECT = 15;   // segundos de protección tras cruzar un portal
  const COMBAT_TIME = 8;      // segundos de combate tras una acción hostil o un golpe recibido
  const REPAIR_GRACE = 10;    // segundos sin recibir daño ni atacar antes de poder usar un robot de reparación
  // Reaparición tras morir: base (gratis), portal más cercano o lugar de la muerte
  const REVIVE_PORTAL_COST = 500, REVIVE_SPOT_COST = 1500;
  const REVIVE_STREAK = 300;  // segundos: repetir la reaparición en el lugar de la muerte dentro de este plazo duplica su coste
  const REVIVE_INVULN = 15;   // segundos de invulnerabilidad tras reaparecer en un portal o en el lugar de la muerte
  const REVIVE_HP = 0.1;      // fracción de la vida máxima con la que se reaparece; el escudo siempre nace a 0

  function portalInRange() {
    const p = g.p;
    return portalsOf(g.zi).find(pt => dist(p.x, p.y, pt.x, pt.y) < PORTAL_RANGE) || null;
  }

  // Dentro de la zona de no ataque de algún portal de este mapa
  function inNaz() {
    const p = g.p;
    return portalsOf(g.zi).some(pt => dist(p.x, p.y, pt.x, pt.y) < NAZ_RANGE);
  }

  // Zona de no ataque: la base siempre protege; el anillo del portal, mientras la nave no haya roto la protección
  function nazProtected() {
    const p = g.p, z = g.zone;
    if (z.base && dist(p.x, p.y, z.base.x, z.base.y) < z.base.r) return true;
    if (!inNaz()) return false;
    return p.spawnT > 0 || (!p.nazBroken && p.combatT <= 0);
  }

  // Acción hostil del jugador: cancela la protección de llegada y, dentro del anillo, la rompe
  function markHostile() {
    const p = g.p;
    p.spawnT = 0;
    p.combatT = COMBAT_TIME;
    p.calmT = REPAIR_GRACE;
    p.invulT = 0;
    if (inNaz()) p.nazBroken = true;
  }

  // Menú de reaparición: tres opciones, en este orden. Las que no se pueden pagar o no existen quedan apagadas
  function reviveOptions() {
    const p = g.p;
    const near = portalsOf(g.zi).sort((a, b) => dist(p.x, p.y, a.x, a.y) - dist(p.x, p.y, b.x, b.y))[0] || null;
    const spotCost = g.clock - g.lastSpot < REVIVE_STREAK ? REVIVE_SPOT_COST * 2 : REVIVE_SPOT_COST;
    return [
      { id: 'base', label: 'Base', cost: 0, ok: true },
      { id: 'portal', label: 'Portal más cercano', cost: REVIVE_PORTAL_COST, ok: !!near && g.uridium >= REVIVE_PORTAL_COST, near },
      { id: 'spot', label: 'Lugar de la muerte', cost: spotCost, ok: g.uridium >= spotCost },
    ];
  }

  const REVIVE_W = 200, REVIVE_H = 64, REVIVE_GAP = 16;
  function reviveGeom(i) {
    const x0 = W / 2 - (3 * REVIVE_W + 2 * REVIVE_GAP) / 2;
    return { x: x0 + i * (REVIVE_W + REVIVE_GAP), y: H * 0.42, w: REVIVE_W, h: REVIVE_H };
  }

  function reviveIndexAt(x, y) {
    for (let i = 0; i < 3; i++) if (inBox(reviveGeom(i), x, y)) return i;
    return -1;
  }

  function drawReviveMenu() {
    drawCenter('Nave destruida', '#ff6b6b', 22, 1, H * 0.3);
    ctx.save();
    ctx.textAlign = 'center';
    reviveOptions().forEach((o, i) => {
      const b = reviveGeom(i), hover = o.ok && inBox(b, mouse.x, mouse.y);
      ctx.fillStyle = o.ok ? (hover ? 'rgba(127,214,255,0.35)' : 'rgba(127,214,255,0.18)') : 'rgba(255,255,255,0.05)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = o.ok ? '#7fd6ff' : '#4a5a6a';
      ctx.lineWidth = 1;
      ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w, b.h);
      ctx.fillStyle = o.ok ? '#ffffff' : '#6b7a88';
      ctx.font = 'bold 14px Consolas, monospace';
      ctx.fillText(o.label, b.x + b.w / 2, b.y + 26);
      ctx.fillStyle = o.ok ? '#9fe3ff' : '#6b7a88';
      ctx.font = '13px Consolas, monospace';
      ctx.fillText(o.cost ? `${formatNum(o.cost)} Uridium` : 'Gratis', b.x + b.w / 2, b.y + 48);
    });
    ctx.restore();
  }

  // Reaparece con la opción elegida. La base no da protección: ya es zona segura
  function revive(id) {
    const p = g.p;
    const o = reviveOptions().find(x => x.id === id);
    if (!p.dead || !o || !o.ok) return;
    g.uridium -= o.cost;
    p.dead = false;
    p.hp = maxHpNow() * REVIVE_HP;
    p.shield = 0;
    p.vx = 0; p.vy = 0;
    p.invulT = 0;
    if (id === 'base') {
      // Sin base en este mapa, se vuelve a la de 3-1 cambiando de mapa
      if (g.zone.base) { p.x = g.zone.base.x; p.y = g.zone.base.y; }
      else setZone(MAIN_ZI, MAIN_BASE);
    } else if (id === 'portal') {
      // En el centro exacto de la puerta, para quedar siempre dentro de su zona de invulnerabilidad
      p.x = o.near.x; p.y = o.near.y;
      p.invulT = REVIVE_INVULN;
    } else {
      // Se queda donde murió; la nave no se mueve mientras estaba destruida
      g.lastSpot = g.clock;
      p.invulT = REVIVE_INVULN;
    }
    saveGame();
  }

  function teleport(pt) {
    if (pt) setZone(pt.to, pt.spawn);
  }

  // Icono de teletransporte sobre la puerta, en coordenadas de pantalla
  function portalIconBox(pt) {
    return { x: sx(pt.x) - 15, y: sy(pt.y) - 95, w: 30, h: 30 };
  }

  function drawPortalIcon(b) {
    const hover = inBox(b, mouse.x, mouse.y);
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070d18');
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? '#fff0b3' : '#ffd166';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    // Rayo: el mismo símbolo que los bonos de teletransporte
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    [[0.3, -1], [-0.6, 0.15], [0, 0.15], [-0.3, 1], [0.6, -0.2], [0, -0.2]].forEach(([x, y], i) => {
      if (i === 0) ctx.moveTo(cx + x * 9, cy + y * 9);
      else ctx.lineTo(cx + x * 9, cy + y * 9);
    });
    ctx.closePath();
    ctx.fill();
    if (hover) drawIconTooltip(b, 'Teletransporte (J)');
  }

  // ---------- Entidades ----------
  // Tipos de NPC que pueden aparecer en un mapa: los que lo listan en su campo `maps`
  function zoneTypes(z) {
    return Object.keys(ALIEN).filter(k => ALIEN[k].maps && ALIEN[k].maps.includes(z.id));
  }

  // Punto libre del mapa, lejos de la base
  // Siguiente punto de paseo, dentro del 80 % central: lo normal es uno cercano; a veces, uno lejano
  function nextRoamPoint(x, y, far = ROAM_FAR_CHANCE) {
    const z = g.zone;
    if (Math.random() < far) return { x: rnd(z.w * 0.1, z.w * 0.9), y: rnd(z.h * 0.1, z.h * 0.9) };
    const ang = rnd(0, Math.PI * 2), d = rnd(200, ROAM_NEAR);
    return { x: clamp(x + Math.cos(ang) * d, z.w * 0.1, z.w * 0.9), y: clamp(y + Math.sin(ang) * d, z.h * 0.1, z.h * 0.9) };
  }

  // Velocidad hacia un punto; parado si ya está muy cerca
  function headTo(a, x, y, speed) {
    const dx = x - a.x, dy = y - a.y, d = Math.hypot(dx, dy);
    if (d < 10) return { wx: 0, wy: 0 };
    return { wx: dx / d * speed, wy: dy / d * speed };
  }

  // Punto de una manada: camina despacio hacia su siguiente punto y, al llegar, se queda rondando
  function moveHome(h, dt) {
    if (h.tx === undefined) { const p = nextRoamPoint(h.x, h.y); h.tx = p.x; h.ty = p.y; }
    if (h.loiter) {
      h.wt -= dt;
      if (h.wt <= 0) { const p = nextRoamPoint(h.x, h.y); h.tx = p.x; h.ty = p.y; h.loiter = false; }
      return;
    }
    if (dist(h.x, h.y, h.tx, h.ty) < 40) { h.loiter = true; h.wt = rnd(LOITER[0], LOITER[1]); return; }
    const dx = h.tx - h.x, dy = h.ty - h.y, d = Math.hypot(dx, dy) || 1;
    h.x += dx / d * IDLE_SPEED * 0.5 * dt;
    h.y += dy / d * IDLE_SPEED * 0.5 * dt;
  }

  // Movimiento sin combate: un NPC solo va de punto en punto y ronda cada uno; un miembro de manada sigue a su punto común
  function idleMove(a, dt) {
    if (a.pack) {
      moveHome(a.home, dt);
      return headTo(a, a.home.x + a.off.x, a.home.y + a.off.y, IDLE_SPEED);
    }
    const rt = ALIEN[a.type].roam || {};
    if (a.tx === undefined) { const p = nextRoamPoint(a.x, a.y, rt.far); a.tx = p.x; a.ty = p.y; }
    if (a.loiter) {
      a.wt -= dt;
      if (a.wt <= 0) { const p = nextRoamPoint(a.x, a.y, rt.far); a.tx = p.x; a.ty = p.y; a.loiter = false; }
      return { wx: 0, wy: 0 };
    }
    if (dist(a.x, a.y, a.tx, a.ty) < 40) {
      a.loiter = true;
      const lo = ALIEN[a.type].loiter || LOITER;
      a.wt = rnd(lo[0], lo[1]);
      return { wx: 0, wy: 0 };
    }
    return headTo(a, a.tx, a.ty, rt.speed || IDLE_SPEED);
  }

  function freeSpot() {
    const z = g.zone;
    let x, y, tries = 0;
    do {
      x = rnd(z.w * 0.1, z.w * 0.9);
      y = rnd(z.h * 0.1, z.h * 0.9);
      tries++;
    } while (z.base && dist(x, y, z.base.x, z.base.y) < Math.max(SPAWN_SAFE, z.base.r) && tries < 20);
    return { x, y };
  }

  // home: punto al que vuelve el NPC cuando no tiene objetivo. Por defecto, el de su aparición
  // pack: id de la manada (0 si va solo). home: punto de la manada o de su aparición
  function addAlien(type, x, y, home = { x, y }, pack = 0) {
    const t = ALIEN[type];
    const a = {
      type, x, y, home, pack, vx: 0, vy: 0,
      hp: t.hp, shield: t.shield, aggro: false, cool: rnd(0.5, 1.5),
      wa: 0, wt: 0, hit: 0,
    };
    g.aliens.push(a);
    return a;
  }

  // Peso de un tipo al aparecer en un mapa: en los X-2 se usa weightX2 (ahí domina el Lordakia)
  function spawnWeight(k, z) {
    return (z.id.endsWith('-2') && ALIEN[k].weightX2) || ALIEN[k].weight || 1;
  }

  function spawnAlien(types) {
    // Al azar, ponderado por spawnWeight (1 si no tiene peso): fuera de los X-2 el Streuner sale tres veces más
    const z = g.zone;
    let r = Math.random() * types.reduce((sum, k) => sum + spawnWeight(k, z), 0);
    const type = types.find(k => (r -= spawnWeight(k, z)) < 0) || types[types.length - 1];
    const at = freeSpot();
    addAlien(type, at.x, at.y);
  }

  // Manada: un miembro de PACK por cada tipo que el mapa permite. Comparten un punto (su casa) que va
  // recorriendo el mapa; cada miembro mantiene su distancia a ese punto, así que sin combate siguen juntos
  function spawnPack(types) {
    const c = freeSpot();
    const id = Math.floor(Math.random() * 1e9) + 1;
    const home = { x: c.x, y: c.y, loiter: false, wt: 0 };
    for (const type of PACK) {
      if (!types.includes(type)) continue;
      const a = rnd(0, Math.PI * 2), d = rnd(20, PACK_SPREAD);
      const m = addAlien(type, c.x + Math.cos(a) * d, c.y + Math.sin(a) * d, home, id);
      m.off = { x: Math.cos(a) * d, y: Math.sin(a) * d };
    }
  }

  function nearestAlien(x, y, r) {
    let best = null, bd = r;
    for (const a of g.aliens) {
      const d = dist(x, y, a.x, a.y);
      if (d < bd) { bd = d; best = a; }
    }
    return best;
  }

  function spark(x, y, color, n = 6) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), s = rnd(40, 200);
      g.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.2, 0.5), max: 0.5, color, size: rnd(1, 3) });
    }
  }

  function explode(x, y, r, color) {
    for (let i = 0; i < 26; i++) {
      const a = rnd(0, Math.PI * 2), s = rnd(60, 260);
      g.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.4, 0.9), max: 0.9, color, size: rnd(2, Math.max(3, r * 0.25)) });
    }
  }

  // Números de daño flotantes. onPlayer: x/y son relativos a la nave y no a la zona
  function spawnText(x, y, text, color, onPlayer = false) {
    g.texts.push({ x, y, text, color, onPlayer, life: 0.9, max: 0.9, vy: -40 });
  }

  function updateTexts(dt) {
    for (const t of g.texts) { t.life -= dt; t.y += t.vy * dt; }
    g.texts = g.texts.filter(t => t.life > 0);
  }

  // Solo las bajas del jugador dan recompensas, cargo y progreso de misiones; las de un bot solo hacen explotar al NPC
  function killAlien(a, by = g.p) {
    const t = ALIEN[a.type];
    explode(a.x, a.y, t.r, t.color);
    soundAt(a.x, a.y, playExplosionSound);
    if (g.p.target === a) { g.p.target = null; g.p.attacking = false; }
    if (by !== g.p) {
      // Los bots ganan lo mismo que el jugador por cada NPC destruido
      if (by.isBot) { by.exp += t.rewards.exp; by.honor += t.rewards.honor; }
      return;
    }
    const r = t.rewards;
    g.credits += r.credits;
    g.uridium += r.uridium;
    g.exp += r.exp;
    g.honor += r.honor;
    // Texto con las recompensas de esta baja (se omiten las que valen 0)
    g.rewardLines = [
      [r.credits, 'créditos'], [r.uridium, 'uridium'], [r.honor, 'puntos de honor'], [r.exp, 'puntos de experiencia'],
    ].filter(([n]) => n > 0).map(([n, what]) => `Has recibido ${n} ${what}`);
    g.rewardT = 3;
    if (r.cargo) g.pickups.push({ x: a.x, y: a.y, type: 'cargo', cargo: r.cargo, life: 60 });
    if (Math.random() < 0.10) g.pickups.push({ x: a.x, y: a.y, type: 'repair', life: 20 });
    checkMission(a.type);
  }

  // Cada baja cuenta para las misiones activas de ese tipo
  function checkMission(type) {
    for (const e of g.missions) {
      const m = MISSIONS[e.id];
      // Las misiones con zona solo cuentan las bajas dentro de ella
      if (m.zone && missionZone(m) !== g.zone.id) continue;
      if (m.type === type) advanceMission(e);
    }
  }

  // Las misiones de viaje avanzan al llegar al punto marcado
  function checkTravel() {
    for (const e of g.missions) {
      const m = MISSIONS[e.id];
      if (m.type === 'travel' && dist(g.p.x, g.p.y, m.to.x, m.to.y) < m.radius) advanceMission(e);
    }
  }

  // Suma progreso; al llegar al total la misión queda completada hasta reclamarla en el centro de misiones
  function advanceMission(e) {
    const m = MISSIONS[e.id];
    if (e.progress >= m.count) return;
    e.progress++;
    if (e.progress === m.count) {
      g.completed.push(e.id);   // el histórico sigue el orden en que se completan
      showBanner('Misión completada: recoge la recompensa en la base');
    }
  }

  // Cancela una misión activa: pierde su progreso y vuelve a estar disponible
  function cancelMission(id) {
    const i = g.missions.findIndex(e => e.id === id);
    if (i < 0) return;
    g.missions.splice(i, 1);
    g.taken = g.taken.filter(t => t !== id);
    g.missionSel = Math.min(g.missionSel, Math.max(0, g.missions.length - 1));
    showBanner('Misión cancelada');
  }

  // Reclama la recompensa de una misión completada y la quita de la lista
  function claimMission(i) {
    const e = g.missions[i];
    if (!e || e.progress < MISSIONS[e.id].count) return;
    const m = MISSIONS[e.id];
    for (const [k] of REWARD_LABELS) if (m.rewards[k]) g[k] += m.rewards[k];
    g.missions.splice(i, 1);
    g.missionSel = Math.min(g.missionSel, Math.max(0, g.missions.length - 1));
    showBanner('Recompensa recibida');
  }

  // Acepta una misión disponible si queda hueco (máximo MAX_MISSIONS a la vez)
  function acceptMission(id) {
    if (!canAcceptMission() || !availableMissionIds().includes(id)) return;
    g.missions.push({ id, progress: 0 });
    g.taken.push(id);
    g.missionSel = g.missions.length - 1;
  }

  function hitAlien(a, dmg, by = g.p) {
    // Con escudo, el 80 % del daño va al escudo y el 20 % a la vida; si el escudo no alcanza, el resto pasa a la vida.
    // Sin escudo, todo el daño va a la vida.
    const toShield = a.shield > 0 ? Math.min(a.shield, Math.floor(dmg * 0.8)) : 0;
    a.shield -= toShield;
    a.hp -= dmg - toShield;
    spawnText(a.x, a.y - ALIEN[a.type].r - 6, Math.round(dmg), '#ff4d4d');
    // El NPC ataca a quien le dispara, sea la nave o un bot
    a.aggro = true;
    a.victim = by;
    a.hit = 0.1;
    a.calm = 0;
    const t = ALIEN[a.type];
    if (t.flee && a.hp > 0 && a.hp <= t.hp * t.flee) a.fleeing = true;
    // PEM: una sola tirada al bajar al umbral. Si sale, quita el objetivo fijado por la nave
    if (t.pem && !a.pemDone && a.hp > 0 && a.hp <= t.hp * t.pem.hp) {
      a.pemDone = true;
      if (Math.random() < t.pem.chance) emitPem(a);
    }
    if (a.hp <= 0) { a.hp = 0; killAlien(a, by); }
  }

  // Pulso electromagnético: la nave pierde el objetivo y tiene que volver a seleccionar al NPC
  function emitPem(a) {
    if (g.p.target === a) { g.p.target = null; g.p.attacking = false; }
    g.pems.push({ x: a.x, y: a.y, life: 0.7, max: 0.7 });
    spawnText(a.x, a.y - ALIEN[a.type].r - 22, 'PEM', '#7fe7ff');
  }

  function updatePems(dt) {
    for (const q of g.pems) q.life -= dt;
    g.pems = g.pems.filter(q => q.life > 0);
  }

  // La radiación (radiation) no cuenta como combate ni muestra números: sería un texto por fotograma
  function hurt(d, radiation = false) {
    const p = g.p;
    if (p.dead || p.invulT > 0) return;
    p.calmT = REPAIR_GRACE;
    if (!radiation) {
      p.combatT = COMBAT_TIME;
      g.hitFlash = 0.12;
      spawnText(0, -30, Math.round(d), '#b07cff', true);
    }
    // El escudo absorbe su porcentaje del golpe mientras le quede reserva; el resto va a la vida
    const absorbed = Math.min(p.shield, Math.floor(d * p.absorb));
    p.shield -= absorbed;
    p.hp -= d - absorbed;
    if (p.hp <= 0) {
      p.hp = 0;
      p.dead = true;
      p.target = null; p.tx = null; p.attacking = false;
      g.honor -= Math.floor(g.honor * DEATH_HONOR_LOSS);
      explode(p.x, p.y, 22, '#7fd6ff');
    }
  }

  // Activa un robot de reparación equipado: solo fuera de combate y con la vida no completa.
  // Cura el total de la vida en "seconds" segundos
  function startRepair(id) {
    const ex = EXTRAS[id];
    if (!ex || !ex.repair || !extraOf().includes(id)) return false;
    if (g.p.dead || g.p.calmT > 0 || g.p.hp >= maxHpNow()) return false;
    g.repairId = id;
    return true;
  }

  // Sonido del motor: un rugido grave de ruido marrón filtrado, en bucle, mientras la nave se mueve de verdad
  let engineBuf = null, engineNode = null;
  function startEngineSound() {
    if (engineNode || !audioCtx) return;
    if (!engineBuf) {
      let last = 0;
      engineBuf = makeTone(2, () => { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; return last * 3.5; });
    }
    const src = audioCtx.createBufferSource(), filter = audioCtx.createBiquadFilter(), gain = audioCtx.createGain();
    src.buffer = engineBuf;
    src.loop = true;
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    gain.gain.value = 0;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();
    gain.gain.setTargetAtTime(0.25, audioCtx.currentTime, 0.2);
    engineNode = { src, gain };
  }
  function stopEngineSound() {
    if (!engineNode || !audioCtx) return;
    const { src, gain } = engineNode;
    engineNode = null;
    gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
    src.stop(audioCtx.currentTime + 0.5);
  }
    // Mismo umbral que la llama de propulsión: suena cuando la velocidad supera 20
  function updateEngineSound() {
    const moving = !g.p.dead && Math.hypot(g.p.vx, g.p.vy) > 20;
    if (moving) startEngineSound(); else stopEngineSound();
  }

  // Sonido de reparación: un tono suave que pulsa en cada tick (REPAIR_POP) mientras el robot cura, y calla al terminar
  let repairNode = null;
  function startRepairSound() {
    if (repairNode || !audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 440;
    gain.gain.value = 0;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    repairNode = { osc, gain };
  }
  function stopRepairSound() {
    if (!repairNode || !audioCtx) return;
    const { osc, gain } = repairNode;
    repairNode = null;
    gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
    osc.stop(audioCtx.currentTime + 0.3);
  }
  function repairPulse() {
    if (!repairNode) return;
    const t = audioCtx.currentTime, gain = repairNode.gain.gain;
    gain.cancelScheduledValues(t);
    gain.setValueAtTime(0, t);
    gain.linearRampToValueAtTime(0.015, t + 0.15);
    gain.linearRampToValueAtTime(0, t + 0.5);
  }

  // Cura mientras el robot esté activo. Cualquier daño o ataque lo corta
  // Cada tick (REPAIR_POP) sale un número verde con lo curado en ese tiempo
  const REPAIR_POP = 2;     // segundos entre números verdes
  let repairClock = 0, repairAcc = 0;
  let repairActive = false;   // true mientras el robot está curando, para dibujarlo junto a la nave
  function updateRepair(dt) {
    const p = g.p;
    if (!g.repairId) { repairClock = 0; repairAcc = 0; repairActive = false; stopRepairSound(); return; }
    const ex = EXTRAS[g.repairId];
    if (!ex || !ex.repair || !extraOf().includes(g.repairId) || p.dead || p.calmT > 0 || p.hp >= maxHpNow()) {
      g.repairId = null;
      repairClock = 0; repairAcc = 0;
      repairActive = false;
      stopRepairSound();
      return;
    }
    repairActive = true;
    startRepairSound();
    const heal = Math.min(maxHpNow() - p.hp, maxHpNow() * dt / ex.repair.seconds);
    p.hp += heal;
    repairAcc += heal;
    repairClock += dt;
    if (repairClock < REPAIR_POP) return;
    repairClock -= REPAIR_POP;
    spawnText(0, -30, '+' + Math.round(repairAcc), '#5dff8a', true);
    repairPulse();
    repairAcc = 0;
  }

  // Porcentaje de vida máxima que quita cada pulso de radiación (tick número "tick", desde 1): 1 % al inicio,
  // se duplica cada 10 pulsos, tope 100 %
  function radiationPct(tick) { return Math.min(1, 0.01 * 2 ** ((tick - 1) / 10)); }

  // Aviso mientras la nave está fuera del mapa: tinte rojo y el daño por segundo actual
  function drawRadiationWarning() {
    if (!(g.radT > 0) || g.p.dead) return;
    ctx.save();
    ctx.fillStyle = 'rgba(255,40,40,0.12)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 16px Consolas, monospace';
    ctx.fillStyle = '#ff6b6b';
    ctx.fillText('ZONA DE RADIACIÓN: vuelve al mapa', W / 2, 60);
    ctx.font = '13px Consolas, monospace';
    ctx.fillText(`Próximo pulso: ${(radiationPct(Math.max(1, g.radTicks)) * 100).toFixed(1)}% de la vida máxima`, W / 2, 80);
    ctx.restore();
  }

  // Tiempo acumulado hasta el siguiente pulso de radiación
  let radClock = 0;

  // Fuera de los límites del mapa la nave recibe un pulso de daño cada segundo. Al volver, todo se reinicia
  function updateRadiation(dt) {
    const p = g.p, z = g.zone;
    const out = p.x < 0 || p.x > z.w || p.y < 0 || p.y > z.h;
    if (!out || p.dead) { g.radT = 0; g.radTicks = 0; radClock = 0; stopWarning(); return; }
    g.radT += dt;
    startWarning();
    radClock += dt;
    if (radClock < 1) return;
    radClock -= 1;
    g.radTicks++;
    const d = maxHpNow() * radiationPct(g.radTicks);
    hurt(d, true);
    spawnText(0, -30, Math.round(d), '#b07cff', true);
  }

  // Sonido de aviso: suena, hace una pausa y vuelve a sonar mientras la nave esté en la zona de radiación
  const WARNING_GAP = 1500;   // ms de silencio entre una reproducción y la siguiente
  // Sonidos generados en el propio juego. makeTone crea un buffer de "seconds" segundos a partir de sample(t)
  function makeTone(seconds, sample) {
    const rate = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, Math.floor(rate * seconds), rate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = sample(i / rate);
    return buf;
  }

  // Inicio de sesión: tres notas suaves de campanilla, una tras otra
  function loginSample(t) {
    let v = 0;
    [[523.25, 0], [659.25, 0.18], [783.99, 0.36]].forEach(([f, t0]) => {
      const dt = t - t0;
      if (dt >= 0) v += Math.sin(2 * Math.PI * f * dt) * Math.exp(-dt * 5) * 0.18;
    });
    return v;
  }

  // Alerta de zona de peligro: dos pitidos suaves, con subida y bajada progresivas
  function warningSample(t) {
    const beep = (t0) => {
      const dt = t - t0;
      return dt >= 0 && dt < 0.25 ? Math.sin(2 * Math.PI * 740 * dt) * Math.sin(Math.PI * dt / 0.25) ** 2 * 0.15 : 0;
    };
    return beep(0) + beep(0.45);
  }

  let warnBuf = null, warnSrc = null, warnTimer = null, warnActive = false;
  function playWarning() {
    if (warnSrc || !warnBuf || !audioCtx) return;
    const src = audioCtx.createBufferSource();
    src.buffer = warnBuf;
    src.connect(audioCtx.destination);
    src.onended = () => {
      warnSrc = null;
      // Si ya se ha salido de la zona, el sonido termina sin repetirse
      if (warnActive) warnTimer = setTimeout(() => { warnTimer = null; playWarning(); }, WARNING_GAP);
    };
    src.start();
    warnSrc = src;
  }

  function startWarning() {
    warnActive = true;
    if (warnSrc || warnTimer || !audioCtx) return;
    if (!warnBuf) warnBuf = makeTone(0.7, warningSample);
    playWarning();
  }

  // Al salir de la zona no se corta el sonido que está sonando: solo se cancela la siguiente repetición
  function stopWarning() {
    warnActive = false;
    clearTimeout(warnTimer);
    warnTimer = null;
  }

  // Lanzamisiles de una nave. Mismo criterio que las ranuras de láser y de generadores.
  function missileOf(id = g.shipId) {
    if (!g.missiles[id]) g.missiles[id] = Array(SHIPS[id].missSlots).fill(null);
    return g.missiles[id];
  }

  // Array de piezas equipadas de la nave actual según el tipo de ranura: láser, lanzamisiles o generador
  function slotArr(type) { return ({ gen: genOf, miss: missileOf, extra: extraOf }[type] || equipOf)(); }

  // Extras de una nave. Mismo criterio que el resto de ranuras.
  function extraOf(id = g.shipId) {
    if (!g.extras[id]) g.extras[id] = Array(SHIPS[id].extraSlots).fill(null);
    return g.extras[id];
  }

  // Generadores de una nave. Mismo criterio que las ranuras de láser.
  function genOf(id = g.shipId) {
    if (!g.generators[id]) g.generators[id] = Array(SHIPS[id].genSlots).fill(null);
    return g.generators[id];
  }

  // Escudo total de los generadores equipados y su porcentaje de absorción (se toma el mayor)
  function shieldStats() {
    const st = genOf().reduce((s, id) => {
      if (!id) return s;
      s.max += GENERATORS[id].shield;
      s.absorb = Math.max(s.absorb, GENERATORS[id].absorb);
      return s;
    }, { max: 0, absorb: 0 });
    return { max: st.max * (1 + boostBonus('shield') + (passives().shield || 0)), absorb: st.absorb };
  }

  // Tras cambiar generadores: la capacidad nueva se llena al equipar y la reserva se ajusta al máximo
  function refreshShield() {
    const p = g.p, st = shieldStats();
    const gained = Math.max(0, st.max - p.maxShield);
    p.maxShield = st.max;
    p.shield = Math.min(st.max, p.shield + gained);
    p.absorb = st.absorb;
  }

  // Ranuras de láser de una nave. Las naves nuevas empiezan con todas vacías.
  function equipOf(id = g.shipId) {
    if (!g.equip[id]) g.equip[id] = Array(SHIPS[id].slots).fill(null);
    return g.equip[id];
  }

  // Almacén del jugador: cuántas unidades tiene de cada pieza, estén equipadas o no
  const invOf = kind => g.inv[{ gen: 'generators', miss: 'missiles', extra: 'extras' }[kind] || 'lasers'];

  // Unidades de una pieza que están equipadas en alguna nave
  function inUse(kind, id) {
    const all = { gen: g.generators, miss: g.missiles, extra: g.extras }[kind] || g.equip;
    return Object.values(all).reduce((s, arr) => s + arr.filter(x => x === id).length, 0);
  }

  // Unidades libres de una pieza. La que ya está en la ranura que se edita (cur) cuenta como libre
  function freeOf(kind, id, cur) {
    return (invOf(kind)[id] || 0) - inUse(kind, id) + (cur === id ? 1 : 0);
  }

  // Partidas anteriores al almacén: lo que ya estaba equipado, y la nave activa, pasan a ser del jugador
  function inventoryFrom(equip, generators, shipId, missiles = {}, extras = {}) {
    const inv = { lasers: {}, generators: {}, missiles: {}, extras: {}, ships: {} };
    for (const id of [shipId, ...Object.keys(equip).filter(id => equip[id].some(Boolean))]) inv.ships[id] = 1;
    for (const arr of Object.values(equip)) for (const id of arr) if (id) inv.lasers[id] = (inv.lasers[id] || 0) + 1;
    for (const arr of Object.values(generators)) for (const id of arr) if (id) inv.generators[id] = (inv.generators[id] || 0) + 1;
    for (const arr of Object.values(missiles)) for (const id of arr) if (id) inv.missiles[id] = (inv.missiles[id] || 0) + 1;
    for (const arr of Object.values(extras)) for (const id of arr) if (id) inv.extras[id] = (inv.extras[id] || 0) + 1;
    return inv;
  }

  // Mapas bajos: los de X-1 a X-4 (el segundo número del identificador del mapa)
  function inLowMap() {
    const n = Number(g.zone.id.split('-')[1]);
    return n >= 1 && n <= 4;
  }

  // Pasivas de la nave activa en el mapa actual; vacío si no aplican
  function passives() {
    const pas = LOW_MAP_PASSIVES[g.shipId];
    return pas && inLowMap() ? pas : {};
  }

  // Capacidad de carga de la bodega con las pasivas activas
  function cargoCap() {
    return SHIPS[g.shipId].cargo + (passives().cargo || 0);
  }

  // Vida máxima con el bonus de los láseres equipados (p. ej. LF-4 Hyperplasmoid: +0,5 % cada uno)
  function maxHpNow() {
    const bonus = equipOf().reduce((sum, id) => sum + (id && LASERS[id].hpBonus ? LASERS[id].hpBonus : 0), 0);
    return Math.floor((g.p.maxHp + (passives().hp || 0)) * (1 + bonus));
  }

  // Hay al menos un láser equipado en la nave activa (las ranuras pueden quedar vacías)
  function hasLaser() {
    return equipOf().some(id => id);
  }

  // Daño base del disparo: suma de los láseres equipados en la nave activa
  // Cada láser puede tener bonus contra jugadores (playerBonus) o contra NPC (npcBonus)
  function laserDamage(target) {
    const vsPlayer = !!target.isPlayer;
    return equipOf().reduce((sum, id) => {
      if (!id) return sum;
      const l = LASERS[id];
      const base = l.min ? Math.floor(rnd(l.min, l.damage + 1)) : l.damage;
      const bonus = vsPlayer ? (l.playerBonus || 0) : (l.npcBonus || 0);
      return sum + base + bonus;
    }, 0);
  }

  // Sonido de disparo generado con Web Audio (no necesita archivos). Mismo sonido para todos los láseres.
  let audioCtx = null;
  // Los sonidos de combate de otras naves (bots y sus objetivos) solo se oyen si la nave está a SOUND_RANGE o menos
  const SOUND_RANGE = 900;
  function soundAt(x, y, play) {
    if (dist(x, y, g.p.x, g.p.y) <= SOUND_RANGE) play();
  }

  function playLaserSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1400, t);
      osc.frequency.exponentialRampToValueAtTime(300, t + 0.15);
      gain.gain.setValueAtTime(0.06, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.16);
    } catch (e) {
      // Sin audio disponible: el juego sigue funcionando
    }
  }

  // Lanzamiento de misil: silbido de ruido filtrado que sube de tono (igual para todos los misiles)
  function playMissileLaunchSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const ctx = audioCtx, t = ctx.currentTime;
      const len = Math.floor(ctx.sampleRate * 0.5);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 1.5;
      filter.frequency.setValueAtTime(300, t);
      filter.frequency.exponentialRampToValueAtTime(2200, t + 0.4);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(t);
      src.stop(t + 0.5);
    } catch (e) {
      // Sin audio disponible: el juego sigue funcionando
    }
  }

  // Impacto de misil: estallido corto de ruido que se cierra en graves, con un golpe grave debajo
  function playMissileImpactSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const ctx = audioCtx, t = ctx.currentTime;
      const len = Math.floor(ctx.sampleRate * 0.6);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1800, t);
      filter.frequency.exponentialRampToValueAtTime(150, t + 0.5);
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.5, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      src.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      src.start(t);
      src.stop(t + 0.6);

      const thump = ctx.createOscillator();
      const thumpGain = ctx.createGain();
      thump.type = 'sine';
      thump.frequency.setValueAtTime(90, t);
      thump.frequency.exponentialRampToValueAtTime(40, t + 0.4);
      thumpGain.gain.setValueAtTime(0.4, t);
      thumpGain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      thump.connect(thumpGain);
      thumpGain.connect(ctx.destination);
      thump.start(t);
      thump.stop(t + 0.4);
    } catch (e) {
      // Sin audio disponible: el juego sigue funcionando
    }
  }

  // Disparo de mucosa de los Lordakia: un gorgoteo grave que baja de tono y un chorro húmedo de ruido filtrado.
  // size (1 o más) baja el tono y el filtro, así que el Boss Lordakia suena más grave
  function playMucusSound(size = 1) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const ctx = audioCtx, t = ctx.currentTime;

      // 1. Gorgoteo: tono que sube y baja deprisa, como una burbuja que se suelta
      const bub = ctx.createOscillator();
      const bubGain = ctx.createGain();
      bub.type = 'sine';
      bub.frequency.setValueAtTime(220 / size, t);
      bub.frequency.exponentialRampToValueAtTime(420 / size, t + 0.08);
      bub.frequency.exponentialRampToValueAtTime(120 / size, t + 0.3);
      bubGain.gain.setValueAtTime(0.2, t);
      bubGain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      bub.connect(bubGain);
      bubGain.connect(ctx.destination);
      bub.start(t);
      bub.stop(t + 0.32);

      // 2. Chorro húmedo: ruido filtrado en medios que se apaga deprisa
      const len = Math.floor(ctx.sampleRate * 0.25);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 3;
      filter.frequency.setValueAtTime(500 / size, t);
      const wetGain = ctx.createGain();
      wetGain.gain.setValueAtTime(0.15, t);
      wetGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      src.connect(filter);
      filter.connect(wetGain);
      wetGain.connect(ctx.destination);
      src.start(t);
      src.stop(t + 0.25);
    } catch (e) {
      // Sin audio disponible: el juego sigue funcionando
    }
  }

  // Explosión de un NPC en el espacio: sin aire no hay soplido, así que se combina
  // un chasquido seco al inicio con un retumbo grave que se apaga despacio
  function playExplosionSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const ctx = audioCtx, t = ctx.currentTime;

      // 1. Chasquido: ruido corto y agudo
      const crackLen = Math.floor(ctx.sampleRate * 0.08);
      const crackBuf = ctx.createBuffer(1, crackLen, ctx.sampleRate);
      const crackData = crackBuf.getChannelData(0);
      for (let i = 0; i < crackLen; i++) crackData[i] = (Math.random() * 2 - 1) * (1 - i / crackLen);
      const crack = ctx.createBufferSource();
      crack.buffer = crackBuf;
      const crackGain = ctx.createGain();
      crackGain.gain.setValueAtTime(0.6, t);
      crack.connect(crackGain);
      crackGain.connect(ctx.destination);
      crack.start(t);

      // 2. Retumbo: tono grave que baja y se apaga
      const boom = ctx.createOscillator();
      const boomGain = ctx.createGain();
      boom.type = 'sine';
      boom.frequency.setValueAtTime(90, t);
      boom.frequency.exponentialRampToValueAtTime(35, t + 1.2);
      boomGain.gain.setValueAtTime(0.7, t);
      boomGain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
      boom.connect(boomGain);
      boomGain.connect(ctx.destination);
      boom.start(t);
      boom.stop(t + 1.25);

      // 3. Cola: ruido grave que se va apagando, como el casco al romperse
      const tailLen = Math.floor(ctx.sampleRate * 1.5);
      const tailBuf = ctx.createBuffer(1, tailLen, ctx.sampleRate);
      const tailData = tailBuf.getChannelData(0);
      for (let i = 0; i < tailLen; i++) tailData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / tailLen, 2);
      const tail = ctx.createBufferSource();
      tail.buffer = tailBuf;
      const tailFilter = ctx.createBiquadFilter();
      tailFilter.type = 'lowpass';
      tailFilter.frequency.setValueAtTime(600, t);
      tailFilter.frequency.exponentialRampToValueAtTime(80, t + 1.5);
      const tailGain = ctx.createGain();
      tailGain.gain.setValueAtTime(0.35, t);
      tail.connect(tailFilter);
      tailFilter.connect(tailGain);
      tailGain.connect(ctx.destination);
      tail.start(t);
    } catch (e) {
      // Sin audio disponible: el juego sigue funcionando
    }
  }

  function fire(target) {
    if (!hasLaser()) return;
    markHostile();
    playLaserSound();
    const p = g.p, a = AMMO[p.ammo];
    const base = Math.atan2(target.y - p.y, target.x - p.x);
    p.cool = a.cool;
    for (let i = 0; i < a.shots; i++) {
      const ang = base + (i - (a.shots - 1) / 2) * a.spread;
      g.bullets.push({
        x: p.x + Math.cos(ang) * 18, y: p.y + Math.sin(ang) * 18,
        vx: Math.cos(ang) * a.speed, vy: Math.sin(ang) * a.speed,
        life: a.life, dmg: Math.floor(laserDamage(target) * rnd(0.9, 1) * a.mult * (1 + boostBonus('lasers')) * (1 + (passives().dmg || 0))), color: a.color,
        target,
      });
    }
    spendBoost('lasers', 1);
  }

  // Dispara el misil seleccionado contra el NPC fijado (teledirigido). Igual que los láseres, necesita
  // objetivo fijado y que esté dentro del alcance (RANGE).
  function fireMissile() {
    const p = g.p;
    const t = p.target && p.target.hp > 0 ? p.target : null;
    if (!p.missile || p.dead || p.missCool > 0 || !t) return;
    if (dist(p.x, p.y, t.x, t.y) > RANGE) return;
    const m = MISSILES[p.missile];
    const ang = Math.atan2(t.y - p.y, t.x - p.x);
    p.missCool = m.cool;
    markHostile();
    playMissileLaunchSound();
    g.bullets.push({
      x: p.x + Math.cos(ang) * 18, y: p.y + Math.sin(ang) * 18,
      vx: Math.cos(ang) * m.speed, vy: Math.sin(ang) * m.speed,
      life: m.life, dmg: Math.floor(m.dmg * (1 + boostBonus('missiles') + (passives().dmg || 0) + (passives().missileDmg || 0))), color: m.color, missile: true,
      homing: true, turn: 5, target: t,
    });
    spendBoost('missiles', 1);
  }

  function buyUpgrade(u) {
    const cost = upgradeCost(g.up[u.lvl]);
    if (g.credits < cost) { showBanner('Créditos insuficientes'); return; }
    g.credits -= cost;
    g.up[u.lvl]++;
    u.apply(g.p);
    showBanner(`${u.label} mejorado`);
  }

  // ---------- Actualización ----------
  function update(dt) {
    const p = g.p;
    // Si se desequipa un láser que daba vida, la vida actual no puede superar el nuevo máximo
    p.hp = Math.min(p.hp, maxHpNow());
    updateRanks();
    const types = zoneTypes(g.zone);
    // En los X-2 no hay manadas: traen tres Streuner y taparían al Lordakia
    const canPack = !g.zone.id.endsWith('-2') && PACK.some(k => types.includes(k));
    const cap = alienCap(g.zone);
    while (g.aliens.length < cap && types.length) {
      if (canPack && Math.random() < PACK_CHANCE && g.aliens.length + PACK.length <= cap) spawnPack(types);
      else spawnAlien(types);
    }

    if (!p.dead) updatePlayer(dt);
    tickBoosts(dt);
    updateRadiation(dt);
    updateRepair(dt);
    updateEngineSound();

    // Protección de llegada: se corta al salir del anillo. El combate se agota solo y devuelve la protección
    if (p.spawnT > 0 && !inNaz()) p.spawnT = 0;
    p.spawnT = Math.max(0, p.spawnT - dt);
    p.combatT = Math.max(0, p.combatT - dt);
    p.calmT = Math.max(0, p.calmT - dt);
    if (p.combatT <= 0) p.nazBroken = false;
    p.invulT = Math.max(0, p.invulT - dt);

    updateAliens(dt);
    updateAllies(dt);
    updateBullets(dt);
    updateEnemyShots(dt);
    updatePickups(dt);
    updateParticles(dt);
    updatePems(dt);
    updateBarFade(dt);
    updateTexts(dt);

    // Aviso al entrar en zona de no ataque efectiva (no mientras dure un combate); se desvanece tras unos segundos
    const safe = nazProtected();
    if (safe && !g.wasSafe) g.safeT = 3;
    g.wasSafe = safe;
    g.safeT = Math.max(0, g.safeT - dt);

    if (g.banner > 0) g.banner -= dt;
    if (g.rewardT > 0) g.rewardT -= dt;
    g.hitFlash = Math.max(0, g.hitFlash - dt);
    g.clock += dt;
  }

  // Radio de la base de una zona: solo entra la empresa dueña (su facción). NPC y naves ajenas quedan fuera del círculo
  function pushOutOfBase(o, company, z) {
    if (!z.base || company === z.faction) return;
    const dx = o.x - z.base.x, dy = o.y - z.base.y, d = Math.hypot(dx, dy);
    if (d >= z.base.r) return;
    const ux = d ? dx / d : 1, uy = d ? dy / d : 0;
    o.x = z.base.x + ux * z.base.r;
    o.y = z.base.y + uy * z.base.r;
  }

  function updatePlayer(dt) {
    const p = g.p, z = g.zone;
    if (p.target && (p.target.hp <= 0 || (p.target.isBot && !targetable(p.target)))) { p.target = null; p.attacking = false; }
    p.cool -= dt;
    p.missCool = Math.max(0, p.missCool - dt);
    p.slowT = Math.max(0, p.slowT - dt);

    // Con el botón pulsado, el destino sigue al cursor
    if (mouse.holding) { p.tx = mouse.x - W / 2 + p.x; p.ty = mouse.y - H / 2 + p.y; }

    // Movimiento libre hacia el punto de clic, también mientras se ataca
    // Con el efecto del misil ralentizador, la velocidad baja durante unos segundos
    const spd = p.speed + (passives().speed || 0);
    const sp = (p.slowT > 0 ? spd * p.slowF : spd) * (1 + boostBonus('engine'));
    let wx = 0, wy = 0;
    if (p.tx !== null) {
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (d > 4) { wx = dx / d * sp; wy = dy / d * sp; }
      else { p.tx = null; p.ty = null; }
    }
    const k = 1 - Math.exp(-6 * dt);
    p.vx += (wx - p.vx) * k;
    p.vy += (wy - p.vy) * k;
    // Sin muro: el espacio sigue más allá del mapa; lo que frena a la nave es la radiación
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    pushOutOfBase(p, p.company, z);

    if (p.attacking) p.angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
    else if (Math.hypot(p.vx, p.vy) > 5) p.angle = Math.atan2(p.vy, p.vx);

    // Disparo automático mientras se ataca
    if (p.attacking && p.cool <= 0 && dist(p.x, p.y, p.target.x, p.target.y) <= RANGE) {
      fire(p.target);
    }

    // Portal a la siguiente zona
  }

  // Un objetivo es la nave o un bot. Solo se persigue o se dispara a objetivos vivos y en este mapa
  function targetable(v) {
    if (v === g.p) return !g.p.dead && !nazProtected();
    return v.zi === g.zi && !v.dead;
  }

  // Objetivo más cercano dentro de r: la nave (si no está en base) o un bot vivo de este mapa
  function nearestVictim(x, y, r) {
    let best = null, bd = r;
    if (targetable(g.p)) {
      const d = dist(x, y, g.p.x, g.p.y);
      if (d < bd) { bd = d; best = g.p; }
    }
    for (const b of g.allies) {
      if (!targetable(b)) continue;
      const d = dist(x, y, b.x, b.y);
      if (d < bd) { bd = d; best = b; }
    }
    return best;
  }

  // Objetivo que el ratón puede fijar: un NPC o un bot vivo de este mapa
  function nearestFoe(x, y, r) {
    let best = nearestAlien(x, y, r), bd = best ? dist(x, y, best.x, best.y) : r;
    for (const b of g.allies) {
      if (!targetable(b)) continue;
      const d = dist(x, y, b.x, b.y);
      if (d < bd) { bd = d; best = b; }
    }
    return best;
  }

  // NPC de la lista ESCORT_TYPES más cercano a `a` en 600 px, o null
  function escortOf(a) {
    let best = null, bd = 600;
    for (const e of g.aliens) {
      if (!ESCORT_TYPES.includes(e.type)) continue;
      const d = dist(a.x, a.y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  // Escolta que el Aider cura con su rayo: el más dañado dentro de su alcance, o null
  function healTarget(a) {
    // Un NPC muerto sigue en la lista hasta el final del frame: ni se cura ni cura
    if (a.hp <= 0) return null;
    let best = null, bf = 1;
    for (const e of g.aliens) {
      if (e.hp <= 0 || !ESCORT_TYPES.includes(e.type) || dist(a.x, a.y, e.x, e.y) > ALIEN.aider.range) continue;
      const f = e.hp / ALIEN[e.type].hp;
      if (f < bf) { bf = f; best = e; }
    }
    return best;
  }

  // Rayo verde del Aider hacia el escolta que está curando
  function drawAiderBeams() {
    ctx.save();
    for (const a of g.aliens) {
      if (!ALIEN[a.type].escort) continue;
      const link = healTarget(a);
      if (!link) continue;
      ctx.beginPath();
      ctx.moveTo(sx(a.x), sy(a.y));
      ctx.lineTo(sx(link.x), sy(link.y));
      ctx.strokeStyle = 'rgba(111,227,154,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Velocidad de un NPC. El Aider iguala la de su escolta; sin escolta se queda quieto
  function speedOf(a) {
    const t = ALIEN[a.type];
    if (!t.escort) return t.speed;
    const e = escortOf(a);
    return e ? ALIEN[e.type].speed : 0;
  }

  function updateAliens(dt) {
    const p = g.p, z = g.zone;
    for (const a of g.aliens) {
      const t = ALIEN[a.type];
      // Persiguen a su objetivo hasta que muere o deja de ser objetivo (la nave, si está en zona de no ataque)
      if (a.victim && !targetable(a.victim)) a.victim = null;
      // Al terminar el combate, el misil ralentizador vuelve a poder tirarse en el siguiente
      if (!a.victim) { a.aggro = false; a.fleeing = false; a.slowRolled = false; }
      if (t.escort) {
        // El Aider se une al combate cuando un escolta lucha contra el jugador, y lo deja cuando termina
        const joining = g.aliens.some(e => ESCORT_TYPES.includes(e.type) && e.aggro && e.victim === p && dist(a.x, a.y, e.x, e.y) < 600);
        if (joining && !a.aggro) { a.aggro = true; a.victim = p; a.joined = true; }
        else if (!joining && a.joined) { a.aggro = false; a.victim = null; a.joined = false; }
        // Rayo de asistencia: cura al escolta más dañado de su alcance
        const link = healTarget(a);
        if (link) link.hp = Math.min(ALIEN[link.type].hp, link.hp + ALIEN[link.type].hp * AIDER_HEAL * dt);
      }
      // Los pasivos solo atacan si se les dispara; el resto detecta un objetivo en su radio
      if (!a.aggro && !t.passive) {
        const c = nearestVictim(a.x, a.y, t.aggro);
        if (c) { a.aggro = true; a.victim = c; }
      }

      const v = a.aggro ? a.victim : null;
      let wx = 0, wy = 0;
      if (v) {
        const dx = v.x - a.x, dy = v.y - a.y, d = Math.hypot(dx, dy) || 1;
        const nx = dx / d, ny = dy / d;
        let ux, uy;
        if (a.fleeing) { ux = -nx; uy = -ny; }
        else if (d > t.range * 0.8) { ux = nx; uy = ny; }
        else if (d < t.range * 0.5) { ux = -nx; uy = -ny; }
        else { ux = -ny * 0.4; uy = nx * 0.4; }
        const base = speedOf(a);
        const sp = a.fleeing ? base * 1.2 : base;
        wx = ux * sp; wy = uy * sp;

        a.cool -= dt;
        if (a.cool <= 0 && d <= t.range) {
          a.cool = t.cool;
          const base = Math.atan2(dy, dx);
          // Tirada del misil ralentizador: una sola vez por combate. Si sale, un solo misil en lugar del abanico, sin daño
          const slowShot = !!t.slow && !a.slowRolled && Math.random() < t.slow.chance;
          if (t.slow) a.slowRolled = true;
          const count = slowShot ? 1 : t.shots;
          const speed = slowShot ? t.slow.speed : 300;
          if (t.mucus) soundAt(a.x, a.y, () => playMucusSound(t.mucus));
          for (let i = 0; i < count; i++) {
            const ang = base + (i - (count - 1) / 2) * 0.22;
            // Daño entre el 75 % y el 100 % del máximo del NPC; puede fallar. El misil ralentizador no hace daño
            const dmg = slowShot ? 0 : Math.floor(t.dmg * rnd(0.75, 1));
            const miss = Math.random() < MISS_CHANCE;
            g.enemyShots.push({ x: a.x, y: a.y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, life: 3, dmg, miss, slow: slowShot ? t.slow : null, mucus: t.mucus || 0 });
          }
        }
      } else if (t.escort && escortOf(a)) {
        // Escolta: se acerca a su nave y, ya cerca, se mueve a su alrededor a la velocidad de la nave sin alejarse
        const e = escortOf(a);
        const ex = e.x - a.x, ey = e.y - a.y, ed = Math.hypot(ex, ey) || 1;
        const sp = speedOf(a);
        if (ed > 120) { wx = ex / ed * sp; wy = ey / ed * sp; }
        else {
          const pull = (ed - 100) * 2;
          wx = -ey / ed * sp * 0.5 + ex / ed * pull;
          wy = ex / ed * sp * 0.5 + ey / ed * pull;
        }
      } else {
        // Sin objetivo: sigue su rutina de paseo
        const m = idleMove(a, dt);
        wx = m.wx; wy = m.wy;
      }

      const k = 1 - Math.exp(-3 * dt);
      a.vx += (wx - a.vx) * k;
      a.vy += (wy - a.vy) * k;
      // Sin combate se quedan en el 80 % central del mapa; solo huyendo o atacando llegan a los bordes
      const mx = a.aggro ? 20 : z.w * 0.1, my = a.aggro ? 20 : z.h * 0.1;
      a.x = clamp(a.x + a.vx * dt, mx, z.w - mx);
      a.y = clamp(a.y + a.vy * dt, my, z.h - my);
      // El morro mira a su objetivo solo en combate (no al huir); sin combate, hacia donde se mueve
      if (a.aggro && a.victim && !a.fleeing) a.heading = Math.atan2(a.victim.y - a.y, a.victim.x - a.x);
      else if (Math.hypot(a.vx, a.vy) > 5) a.heading = Math.atan2(a.vy, a.vx);
      pushOutOfBase(a, null, z);
      a.hit = Math.max(0, a.hit - dt);
      // Tiempo sin recibir golpes: pasado el retardo, el escudo vuelve a llenarse
      a.calm = (a.calm || 0) + dt;
      if (a.calm >= SHIELD_REGEN_DELAY && a.shield < t.shield) a.shield = Math.min(t.shield, a.shield + t.shield * SHIELD_REGEN_RATE * dt);
    }
    g.aliens = g.aliens.filter(a => a.hp > 0);
  }

  // Distancia de un punto (x, y) al segmento (x1, y1)-(x2, y2)
  function segDist(x, y, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    const t = len2 ? clamp(((x - x1) * dx + (y - y1) * dy) / len2, 0, 1) : 0;
    return Math.hypot(x1 + dx * t - x, y1 + dy * t - y);
  }

  // Bots: cazan NPC, recorren el mapa y cambian de mapa por sus puertas. Solo actúan en el mapa de la nave,
  // porque solo ahí existen NPC; en los demás mapas solo cuentan los segundos hasta su próximo salto.
  function updateAllies(dt) {
    for (const b of g.allies) {
      // El combate termina cuando muere uno de los dos: si la nave muere, el bot olvida la pelea
      if (g.p.dead && !b.enemy) b.hostile = false;
      if (b.dead) {
        b.respawnT -= dt;
        if (b.respawnT <= 0) respawnBot(b);
        continue;
      }
      const x0 = b.x, y0 = b.y;
      if (b.zi === g.zi) {
        updateBotActive(b, dt);
        pushOutOfBase(b, b.company, g.zone);
      } else if (!b.enemy) {
        b.hopT -= dt;
        if (b.hopT <= 0) crossBotPortal(b);
      }
      b.moving = dist(x0, y0, b.x, b.y) > 0.5;
    }
  }

  function updateBotActive(b, dt) {
    // Si la nave le ha atacado, le devuelve el ataque como a un jugador hostil, sin atender a los NPC.
    // Dentro de la zona de no ataque la nave no es objetivo, igual que para los NPC
    if (b.hostile && targetable(g.p)) {
      const d = dist(b.x, b.y, g.p.x, g.p.y);
      b.angle = Math.atan2(g.p.y - b.y, g.p.x - b.x);
      if (d > BOT_RANGE * 0.7) botMoveTo(b, g.p.x, g.p.y, dt, true);
      b.cool -= dt;
      if (b.cool <= 0 && d <= BOT_RANGE) botFire(b, g.p);
      return;
    }
    if (!b.target || !g.aliens.includes(b.target)) b.target = nearestAlien(b.x, b.y, BOT_SIGHT);
    const t = b.target;
    if (t) {
      const d = dist(b.x, b.y, t.x, t.y);
      b.angle = Math.atan2(t.y - b.y, t.x - b.x);
      if (d > BOT_RANGE * 0.7) botMoveTo(b, t.x, t.y, dt);
      b.cool -= dt;
      if (b.cool <= 0 && d <= BOT_RANGE) botFire(b, t);
      return;
    }
    // Sin objetivo: espera un momento y, al llegar, elige el siguiente punto o puerta
    if (b.wait > 0) { b.wait -= dt; return; }
    if (botMoveTo(b, b.tx, b.ty, dt)) {
      if (b.portal) { crossBotPortal(b); return; }
      chooseBotGoal(b);
      b.wait = rnd(2, 5);
    }
  }

  // Daño a un bot: igual que a la nave, pero sin escudo. Al morir explota y reaparece en la base de su mapa
  function hurtBot(b, d) {
    if (b.dead) return;
    spawnText(b.x, b.y - 30, Math.round(d), '#b07cff');
    b.hp -= d;
    if (b.hp <= 0) {
      b.hp = 0; b.dead = true; b.respawnT = BOT_RESPAWN;
      b.target = null; b.portal = false; b.hostile = false;
      b.honor -= Math.floor(b.honor * DEATH_HONOR_LOSS);
      explode(b.x, b.y, 22, '#6fe39a');
    }
  }

  function respawnBot(b) {
    b.zi = ZONES.findIndex(z => z.id === HOME_ZONE[b.company]);
    const base = ZONES[b.zi].base;
    b.dead = false; b.hp = b.maxHp;
    b.x = base.x; b.y = base.y; b.tx = b.x; b.ty = b.y;
    b.wait = 0; b.target = null; b.portal = false; b.hostile = !!b.enemy;
  }

  // Mueve al bot hacia (x, y) a su velocidad; devuelve true al llegar.
  // Solo en persecución de una nave en combate (pursuit) puede salir del mapa; en lo demás se queda dentro
  function botMoveTo(b, x, y, dt, pursuit = false) {
    const d = dist(b.x, b.y, x, y);
    if (d < 4) return true;
    const s = Math.min(b.speed * dt, d);
    b.angle = Math.atan2(y - b.y, x - b.x);
    b.x += Math.cos(b.angle) * s;
    b.y += Math.sin(b.angle) * s;
    if (!pursuit) {
      const z = ZONES[b.zi];
      b.x = clamp(b.x, 20, z.w - 20);
      b.y = clamp(b.y, 20, z.h - 20);
    }
    return false;
  }

  // Un punto aleatorio del mapa o, una de cada cinco veces, la puerta del mapa
  function chooseBotGoal(b) {
    const z = ZONES[b.zi], pts = portalsOf(b.zi);
    b.portal = !b.enemy && pts.length > 0 && Math.random() < 0.2;
    if (b.portal) {
      // Elige una de las puertas de la zona al azar
      b.gate = pts[Math.floor(Math.random() * pts.length)];
      b.tx = b.gate.x; b.ty = b.gate.y;
    } else {
      b.tx = rnd(600, z.w - 600); b.ty = rnd(600, z.h - 600);
    }
  }

  // El bot cruza la puerta de su mapa y aparece junto a la del destino, igual que la nave
  function crossBotPortal(b) {
    const pts = portalsOf(b.zi);
    const pt = b.gate || pts[Math.floor(Math.random() * pts.length)];
    if (!pt) return;
    b.zi = pt.to; b.x = pt.spawn.x; b.y = pt.spawn.y;
    b.tx = b.x; b.ty = b.y; b.portal = false; b.gate = null; b.target = null;
    b.wait = rnd(2, 5); b.hopT = rnd(30, 90);
  }

  // Disparo de bot. Contra un NPC es un proyectil verde, que no da recompensa al jugador.
  // Contra la nave es un disparo como el de un NPC, que no puede alcanzar al propio bot
  function botFire(b, t) {
    const ang = Math.atan2(t.y - b.y, t.x - b.x);
    b.cool = BOT_COOL;
    soundAt(b.x, b.y, playLaserSound);
    if (t === g.p) {
      g.enemyShots.push({
        x: b.x, y: b.y, vx: Math.cos(ang) * 300, vy: Math.sin(ang) * 300,
        life: BOT_RANGE / 300, dmg: LASERS[BOT_LASER].damage, miss: Math.random() < MISS_CHANCE, from: b,
      });
      return;
    }
    g.bullets.push({
      x: b.x + Math.cos(ang) * 18, y: b.y + Math.sin(ang) * 18,
      vx: Math.cos(ang) * BOT_BULLET_SPEED, vy: Math.sin(ang) * BOT_BULLET_SPEED,
      life: BOT_RANGE / BOT_BULLET_SPEED, dmg: LASERS[BOT_LASER].damage, color: '#6fe39a', bot: b,
    });
  }

  function updateBullets(dt) {
    for (const b of g.bullets) {
      if (b.homing && b.target && b.target.hp > 0) {
        const ang = Math.atan2(b.target.y - b.y, b.target.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        const diff = Math.atan2(Math.sin(ang - cur), Math.cos(ang - cur));
        const na = cur + clamp(diff, -b.turn * dt, b.turn * dt);
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
      const px = b.x, py = b.y;
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) continue;
      // Se comprueba el tramo recorrido en el frame, para que un proyectil rápido no atraviese al NPC
      // Un proyectil del jugador también puede dar al bot que tiene fijado; los de un bot solo dan a NPC
      const foes = b.bot ? g.aliens : [...g.aliens, ...g.allies.filter(x => x === b.target)];
      for (const a of foes) {
        const sp = (a.isBot ? SPRITES[BOT_SHIP] : NPC_SPRITES[a.type]) || null;
        if (a.hp > 0 && shipHit(a, sp, a.isBot ? BOT_RADIUS : ALIEN[a.type].r, px, py, b.x, b.y)) {
          if (a.isBot) { a.hostile = true; hurtBot(a, b.dmg); }
          else hitAlien(a, b.dmg, b.bot || g.p);
          if (b.missile) {
            soundAt(b.x, b.y, playMissileImpactSound);
            explode(b.x, b.y, 16, b.color);
          } else {
            spark(b.x, b.y, b.color);
          }
          b.life = 0;
          break;
        }
      }
    }
    g.bullets = g.bullets.filter(b => b.life > 0);
  }

  function updateEnemyShots(dt) {
    for (const s of g.enemyShots) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      // Un disparo fallado sigue de largo; el resto impacta en la primera nave que toca (la del jugador o un bot)
      if (s.miss || s.life <= 0) continue;
      // El misil ralentizador sólo afecta a la nave: atraviesa a los bots
      const x0 = s.x - s.vx * dt, y0 = s.y - s.vy * dt;
      const hit = [g.p, ...(s.slow ? [] : g.allies)].find(v => v !== s.from && targetable(v) &&
        shipHit(v, v === g.p ? SPRITES[g.shipId] : SPRITES[BOT_SHIP], v === g.p ? 14 : BOT_RADIUS, x0, y0, s.x, s.y));
      if (!hit) continue;
      if (s.slow) {
        // Un misil ralentizador no hace daño: sólo frena la nave durante su tiempo; volver a impactar lo renueva
        g.p.slowT = s.slow.time; g.p.slowF = s.slow.factor;
      } else if (hit === g.p) hurt(s.dmg);
      else hurtBot(hit, s.dmg);
      s.life = 0;
    }
    g.enemyShots = g.enemyShots.filter(s => s.life > 0);
  }

  // Algoritmo de recogida de cajas. La xenomita no ocupa bodega y entra siempre al 100 %.
  // Sin espacio libre se cancela y la caja conserva sus materias de bodega. Si todo cabe, entra entero.
  // Si no cabe, reparto proporcional al peso de cada materia con redondeo hacia abajo; lo que sobra se pierde.
  function takeCargo(items) {
    for (const [key, n] of Object.entries(items)) if (!(key in g.cargo)) g.refine[key] += n;
    const want = Object.fromEntries(Object.entries(items).filter(([key, n]) => key in g.cargo && n > 0));
    const total = Object.values(want).reduce((s, n) => s + n, 0);
    const free = Math.max(0, cargoCap() - Object.values(g.cargo).reduce((s, n) => s + n, 0));
    if (total === 0) return { taken: 0, partial: false, rest: {} };
    if (free <= 0) return { taken: 0, partial: false, rest: want };
    const partial = total > free;
    let taken = 0;
    const rest = {};
    for (const [key, n] of Object.entries(want)) {
      const share = partial ? Math.floor(n * free / total) : n;
      g.cargo[key] += share;
      taken += share;
      if (n - share > 0) rest[key] = n - share;
    }
    return { taken, partial, rest };
  }

  function updatePickups(dt) {
    const p = g.p;
    for (const k of g.pickups) {
      k.life -= dt;
      const d = dist(k.x, k.y, p.x, p.y);
      if (k.type !== 'cargo' && !p.dead && d < 120) { k.x += (p.x - k.x) * 4 * dt; k.y += (p.y - k.y) * 4 * dt; }
      // Las cajas de carga solo se recogen si se ha hecho clic sobre ellas (k.want)
      const collect = k.type !== 'cargo' || k.want;
      if (!p.dead && d < 22 && k.life > 0 && collect) {
        if (k.type === 'repair') p.hp = Math.min(maxHpNow(), p.hp + 25);
        else if (k.type === 'cargo') {
          // Lo que no ha entrado se queda en la caja, que sigue en el mapa hasta que expire; hay que volver a pulsarla
          const { taken, partial, rest } = takeCargo(k.cargo);
          if (Object.keys(rest).length) {
            k.cargo = rest;
            k.want = false;
            showBanner(partial && taken > 0 ? 'Bodega llena: recogida parcial' : 'Bodega llena');
            continue;
          }
          showBanner(partial ? 'Bodega llena: recogida parcial' : 'Caja de carga recogida');
        }
        k.life = 0;
      }
    }
    g.pickups = g.pickups.filter(k => k.life > 0);
  }

  function updateParticles(dt) {
    for (const q of g.parts) {
      q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
      q.vx *= Math.exp(-3 * dt); q.vy *= Math.exp(-3 * dt);
    }
    g.parts = g.parts.filter(q => q.life > 0);
  }

  // ---------- Dibujo ----------
  const sx = x => x - g.p.x + W / 2;
  const sy = y => y - g.p.y + H / 2;

  function polyPts(sides, r) {
    return Array.from({ length: sides }, (_, i) => {
      const a = i / sides * Math.PI * 2;
      return [Math.cos(a) * r, Math.sin(a) * r];
    });
  }

  function drawPoly(x, y, rot, pts, fill, stroke) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    pts.forEach((pt, i) => i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1]));
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function bar(x, y, w, h, ratio, color) {
    // El contorno depende de lineWidth: se fija aquí para no heredar el de la última figura dibujada
    ctx.save();
    ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * clamp(ratio, 0, 1), h);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.strokeRect(x + 0.5, y + 0.5, w, h);
    ctx.restore();
  }

  function drawStars() {
    const camX = g.p.x - W / 2, camY = g.p.y - H / 2;
    for (const s of g.stars) {
      const x = mod(s.x * W - camX * s.z * 0.25, W);
      const y = mod(s.y * H - camY * s.z * 0.25, H);
      ctx.fillStyle = `rgba(200,220,255,${0.3 + s.z * 0.6})`;
      ctx.fillRect(x, y, s.z * 1.8, s.z * 1.8);
    }
  }

  function drawWorldBackground() {
    const z = g.zone;
    // Línea roja del límite jugable: al cruzarla empieza la radiación
    ctx.strokeStyle = 'rgba(255,60,60,0.7)';
    ctx.lineWidth = 3;
    ctx.strokeRect(sx(0), sy(0), z.w, z.h);
    if (z.base) {
      const bx = sx(z.base.x), by = sy(z.base.y);
      ctx.beginPath();
      ctx.arc(bx, by, z.base.r, 0, Math.PI * 2);
      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = 'rgba(93,255,138,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#5dff8a';
      ctx.font = '12px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('BASE', bx, by - z.base.r - 8);
      ctx.textAlign = 'left';
    }
    for (const portal of portalsOf(g.zi)) {
      const x = sx(portal.x), y = sy(portal.y);
      // Línea de puntos fina: borde exacto de la zona de no ataque, la misma que usa la protección
      ctx.save();
      ctx.setLineDash([2, 4]);
      ctx.strokeStyle = 'rgba(127,214,255,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, NAZ_RANGE, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.arc(x, y, 52, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#ffd166';
      ctx.font = '13px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(ZONES[portal.to].id, x, y + 68);
      ctx.textAlign = 'left';
      // El icono de teletransporte solo aparece al alcance de la puerta
      if (dist(g.p.x, g.p.y, portal.x, portal.y) < PORTAL_RANGE) drawPortalIcon(portalIconBox(portal));
    }
  }

  function drawAliens() {
    const p = g.p;
    drawAiderBeams();
    for (const a of g.aliens) {
      const t = ALIEN[a.type];
      const x = sx(a.x), y = sy(a.y);
      const rot = a.heading || 0;
      const flash = a.hit > 0;
      ctx.save();
      const sprite = NPC_SPRITES[a.type];
      if (sprite) {
        ctx.filter = flash ? 'brightness(3)' : 'none';
        drawShipSprite(x, y, rot, sprite);
        ctx.filter = 'none';
      } else {
        drawPoly(x, y, rot, polyPts(t.sides, t.r), flash ? '#ffffff' : t.color, '#ffffff22');
      }
      bar(x - 18, y - t.r - 10, 36, 4, a.hp / t.hp, '#5dff8a');
      if (a.shield > 0) bar(x - 18, y - t.r - 15, 36, 3, a.shield / t.shield, '#5ac8ff');
      if (g.p.target === a) {
        ctx.beginPath();
        ctx.arc(x, y, t.r + 8, 0, Math.PI * 2);
        ctx.strokeStyle = g.p.attacking ? '#ff4d6d' : '#ffd166';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      // Nombre del NPC siempre visible, bajo el NPC
      ctx.fillStyle = '#ff3b3b';
      ctx.font = '11px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`..::{ ${t.name} }::..`, x, y + t.r + 22);
      ctx.restore();
    }
  }

  // Bots aliados: triángulo verde con su nombre y nivel. No están en g.aliens, así que no son objetivos
  function drawAllies() {
    ctx.save();
    for (const b of g.allies) {
      if (b.zi !== g.zi || b.dead) continue;
      const x = sx(b.x), y = sy(b.y);
      const color = b.enemy ? '#ff5c5c' : '#6fe39a';
      const sprite = SPRITES[BOT_SHIP] || null;
      if (sprite) drawNaveSprite(x, y, b.angle, sprite, SHIPS[BOT_SHIP], b.moving);
      else drawPoly(x, y, b.angle, polyPts(3, 16), color, '#ffffff22');
      if (b.hp < b.maxHp) bar(x - 18, y - 26, 36, 4, b.hp / b.maxHp, '#ff5c5c');
      if (g.p.target === b) {
        ctx.beginPath();
        ctx.arc(x, y, sprite ? 40 : 24, 0, Math.PI * 2);
        ctx.strokeStyle = g.p.attacking ? '#ff4d6d' : '#ffd166';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.textAlign = 'center';
      if (b.enemy || b.company === g.p.company) {
        // Enemigos en rojo y aliados de la empresa del jugador en azul (aliados, no de otra empresa).
        // Ambos con el mismo estilo que el nombre del jugador: negrita y borde negro
        ctx.font = 'bold 15px Consolas, monospace';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#000000';
        ctx.strokeText(b.name, x, y + 16 + 22);
        ctx.fillStyle = b.enemy ? '#ff5c5c' : '#4da6ff';
      } else {
        ctx.fillStyle = color;
        ctx.font = '13px Consolas, monospace';
      }
      ctx.fillText(b.name, x, y + 16 + 22);
      const nameW = ctx.measureText(b.name).width;
      if (b.rank != null) drawRank(b.rank, x - nameW / 2 - 4, y + 16 + 22 - 6);
      drawCompany(b.company, x + nameW / 2 + 4, y + 16 + 22 - 6);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  }

  function drawPickups() {
    for (const k of g.pickups) {
      const x = sx(k.x), y = sy(k.y);
      if (k.type === 'repair') {
        ctx.fillStyle = '#5dff8a';
        ctx.fillRect(x - 6, y - 2, 12, 4);
        ctx.fillRect(x - 2, y - 6, 4, 12);
      } else if (k.type === 'cargo') {
        ctx.fillStyle = '#9fe3ff';
        ctx.fillRect(x - 7, y - 7, 14, 14);
      }
    }
  }

  function drawProjectiles() {
    ctx.save();
    for (const b of g.bullets) {
      const x = sx(b.x), y = sy(b.y);
      if (b.homing) {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
      } else {
        const len = 14, m = Math.hypot(b.vx, b.vy) || 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - b.vx / m * len, y - b.vy / m * len);
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
    for (const s of g.enemyShots) {
      ctx.beginPath();
      if (s.slow) {
        // Misil ralentizador: punto azul más grande y con brillo
        ctx.fillStyle = '#7fe7ff';
        ctx.shadowColor = '#7fe7ff';
        ctx.shadowBlur = 10;
        ctx.arc(sx(s.x), sy(s.y), 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      } else if (s.mucus) {
        // Mucosa de los Lordakia: una gota gruesa y alargada en la dirección del disparo
        ctx.fillStyle = '#5ec3e8';
        ctx.ellipse(sx(s.x), sy(s.y), 7 * s.mucus, 3.5 * s.mucus, Math.atan2(s.vy, s.vx), 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#ff7a7a';
        ctx.arc(sx(s.x), sy(s.y), 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawTexts() {
    ctx.save();
    ctx.font = 'bold 14px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    for (const t of g.texts) {
      const x = t.onPlayer ? W / 2 + t.x : sx(t.x);
      const y = t.onPlayer ? H / 2 + t.y : sy(t.y);
      ctx.globalAlpha = Math.max(0, t.life / t.max);
      ctx.strokeText(t.text, x, y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, x, y);
    }
    ctx.restore();
  }

  // Descarga eléctrica del PEM: anillo que se expande desde el NPC con arcos en zigzag que chisporrotean
  function drawPems() {
    for (const q of g.pems) {
      const k = 1 - q.life / q.max;
      const x = sx(q.x), y = sy(q.y), r = 30 + k * 150;
      ctx.save();
      ctx.globalAlpha = q.life / q.max;
      ctx.strokeStyle = '#7fe7ff';
      ctx.shadowColor = '#7fe7ff';
      ctx.shadowBlur = 12;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 + k * 2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * r * 0.4, y + Math.sin(a) * r * 0.4);
        for (let s = 1; s <= 4; s++) {
          const d = r * (0.4 + 0.15 * s), j = rnd(-8, 8);
          ctx.lineTo(x + Math.cos(a) * d - Math.sin(a) * j, y + Math.sin(a) * d + Math.cos(a) * j);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const q of g.parts) {
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.color;
      ctx.fillRect(sx(q.x), sy(q.y), q.size, q.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawMoveMarker() {
    const p = g.p;
    if (p.target || p.tx === null) return;
    const x = sx(p.tx), y = sy(p.ty);
    ctx.strokeStyle = 'rgba(93,255,138,0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y);
    ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10);
    ctx.stroke();
  }

  // Nombre fijo del jugador (de momento no tiene nomenclatura propia)
  const PLAYER_NAME = 'Ragdeap';

  // Rangos de menor a mayor; el índice es el valor de `rank` (null = sin rango)
  const RANKS = [
    '01-cadete-espacial', '02-piloto-espacial', '03-piloto-mayor', '04-cabo', '05-sargento',
    '06-sargento-primero', '07-subteniente', '08-teniente', '09-teniente-primero', '10-subcapitan',
    '11-capitan', '12-capitan-primero', '13-comandante-subalterno', '14-comandante', '15-comandante-jefe',
    '16-subcoronel', '17-coronel', '18-coronel-mayor', '19-general-de-brigada', '20-general', '21-general-supremo',
  ];
  const rankImgs = RANKS.map(f => {
    const img = new Image();
    img.src = 'rangos/' + f + '.svg';
    return img;
  });

  // Dibuja el icono de rango con su borde derecho en `right`, centrado en `cy`. Mantiene la proporción del SVG
  function drawRank(rank, right, cy) {
    const img = rankImgs[rank];
    if (!img || !img.complete || !img.naturalWidth) return;
    const h = 18, w = h * img.naturalWidth / img.naturalHeight;
    ctx.drawImage(img, right - w, cy - h / 2, w, h);
  }

  // Logo de cada empresa, a la derecha del nombre
  const logoImgs = {};
  for (const [company, file] of Object.entries({ VRU: 'vru', EIC: 'eic', MMO: 'mmo' })) {
    const img = new Image();
    img.src = 'empresas/' + file + '.svg';
    logoImgs[company] = img;
  }

  // Dibuja el logo de la empresa con su borde izquierdo en `left`, centrado en `cy`, con la misma altura que el icono de rango
  function drawCompany(company, left, cy) {
    const img = logoImgs[company];
    if (!img || !img.complete || !img.naturalWidth) return;
    const h = 18, w = h * img.naturalWidth / img.naturalHeight;
    ctx.drawImage(img, left, cy - h / 2, w, h);
  }

  // Reparto de rangos por empresa, de mayor a menor. `n` = jugadores fijos; `pct` = % de la empresa (mínimo 1).
  // `rank` es el índice en RANKS
